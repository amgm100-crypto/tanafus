<style>
/* Layout: Apple-style storefront — translucent global nav, centered headline, icon strip, gray promo tiles; game = one question card with a team turn strip */
:root{
  --bg:#FFFFFF;
  --bg-alt:#F8F8FA;
  --tile:#FFFFFF;
  --ink:#26323E;
  --muted:#5B656E;
  --hair:#DFE1E5;
  --blue:#0B7D65;
  --blue-link:#0A6E59;
  --on-blue:#FFFFFF;
  --nav:rgba(38,50,62,.94);
  --good:#248A3D; --good-soft:#E3F4E7;
  --bad:#D70015;  --bad-soft:#FCE6E8;
  --red2:#D1B871;
  --shadow:0 4px 24px rgba(38,50,62,.08);
  --scrim:rgba(38,50,62,.42);
  --c1:#0071E3;--c2:#248A3D;--c3:#C93400;--c4:#8944AB;--c5:#D30F45;--c6:#0E7C86;--c7:#3634A3;--c8:#B25000;
  --f:"Readex Pro","IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
  --gold:#D1B871;--gold-ink:#8F7128;--teal:#509CB5;--coral:#D07362;--purple:#83779F;--amber:#DBA24F;--sage:#439086;--slate:#26323E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C252F;--bg-alt:#212B36;--tile:#2A3541;--ink:#F1F3F5;--muted:#A9B2BC;--hair:#3A4654;--blue:#24A385;--blue-link:#5CC6AA;--on-blue:#FFFFFF;--gold-ink:#D1B871;
  --nav:rgba(28,37,47,.94);--red2:#D1B871;--good:#3FD27A;--good-soft:#1C4237;--bad:#FF6B61;--bad-soft:#4A2A3A;--shadow:none;--scrim:rgba(10,18,34,.55);
  --c1:#0A84FF;--c2:#30D158;--c3:#FF9F0A;--c4:#BF5AF2;--c5:#FF375F;--c6:#40C8E0;--c7:#5E5CE6;--c8:#FFB340;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C252F;--bg-alt:#212B36;--tile:#2A3541;--ink:#F1F3F5;--muted:#A9B2BC;--hair:#3A4654;--blue:#24A385;--blue-link:#5CC6AA;--on-blue:#FFFFFF;--gold-ink:#D1B871;
  --nav:rgba(28,37,47,.94);--red2:#D1B871;--good:#3FD27A;--good-soft:#1C4237;--bad:#FF6B61;--bad-soft:#4A2A3A;--shadow:none;--scrim:rgba(10,18,34,.55);
  --c1:#0A84FF;--c2:#30D158;--c3:#FF9F0A;--c4:#BF5AF2;--c5:#FF375F;--c6:#40C8E0;--c7:#5E5CE6;--c8:#FFB340;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.47;letter-spacing:0;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
svg.i{width:1em;height:1em;display:block}

/* Global nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
.gnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--hair) 60%,transparent)}
.gnav .wrap{height:48px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:600;font-size:15px;white-space:nowrap}
.logo .wm{height:24px;width:auto;color:var(--ink);display:block}
.hero-wm{margin:6px 0 14px!important;line-height:0}
.hero-wm .wm{height:clamp(84px,14vw,132px);width:auto;color:var(--ink)}
.eyebrow{color:var(--red2)!important}
.band-h::after,.section h1::after{content:"";display:block;width:34px;height:8px;margin:12px auto 0;background:linear-gradient(90deg,var(--blue) 0 14px,transparent 14px 20px,var(--red2) 20px)}
.ency-tx em{color:var(--red2)!important}
footer .wrap>span:first-child::before{content:"";display:inline-block;width:6px;height:6px;background:var(--blue);box-shadow:8px 0 0 var(--red2);margin-inline-end:16px;vertical-align:middle}
.links{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links button{background:none;border:0;padding:6px 10px;font-size:12.5px;color:var(--ink);opacity:.8;white-space:nowrap;border-radius:8px}
.links button:hover{opacity:1}
.links button[aria-current="true"]{opacity:1;font-weight:600}

/* Sub nav (section title + action) */
.subnav{border-bottom:1px solid var(--hair);background:var(--bg)}
.subnav .wrap{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.subnav h2{margin:0;font-size:21px;font-weight:600}
.back{background:none;border:0;padding:4px 0;color:var(--blue-link);font-size:14px;display:inline-flex;align-items:center;gap:4px}
.back:hover{text-decoration:underline}

/* Hero */
.hero{text-align:center;padding-block:56px 30px}
.eyebrow{color:var(--muted);font-size:17px;font-weight:600;margin:0 0 6px}
.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.08;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.hero p{font-size:clamp(19px,2.6vw,24px);color:var(--ink);margin:12px auto 0;max-width:30ch;line-height:1.35;font-weight:400}
.cta{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:980px;padding:11px 22px;font-size:17px;background:var(--blue);color:var(--on-blue);font-weight:400;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--blue-link);border:1px solid var(--blue-link)}
.btn.lg{padding:14px 30px;font-size:18px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--blue-link);font-size:17px}
.link:hover{text-decoration:underline}

/* Icon strip (like a product chapter nav) */
.strip{display:flex;justify-content:center;gap:clamp(14px,4vw,44px);padding-block:8px 34px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ink);min-width:64px}
.strip svg{width:40px;height:40px}
.strip button:hover span{color:var(--blue-link)}
.strip button[disabled]{opacity:.35;cursor:not-allowed}

/* Promo tiles */
.tiles-band{background:var(--bg-alt);padding-block:12px 12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--tile);border-radius:var(--r);padding:40px 28px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;min-height:300px}
.tile.wide{grid-column:1/-1}
.tile .ic{width:64px;height:64px;margin-bottom:12px}
.tile h3{margin:0;font-size:clamp(26px,3.6vw,36px);font-weight:600;line-height:1.12}
.tile p{margin:0;color:var(--ink);font-size:17px;max-width:34ch;line-height:1.4}
.tile .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .go{margin-top:14px;display:flex;gap:16px}
.tile[aria-disabled="true"] .ic,.tile[aria-disabled="true"] h3{opacity:.45}
.soon{font-size:13px;color:var(--muted);background:var(--bg-alt);padding:4px 12px;border-radius:980px;margin-top:14px}

/* Pickers */
.section{padding-block:36px 48px}
.section h1{font-size:clamp(28px,5vw,44px);font-weight:700;margin:0 0 6px;text-align:center;line-height:1.1}
.section .lead{text-align:center;color:var(--muted);font-size:19px;margin:0 auto 30px;max-width:40ch}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cat{background:var(--bg-alt);border:0;border-radius:var(--r);padding:26px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;transition:transform .2s}
.cat:hover:not([disabled]){transform:scale(1.02)}
.cat svg{width:52px;height:52px;margin-bottom:8px}
.cat b{font-size:19px;font-weight:600;line-height:1.25}
.cat span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .info{position:absolute;top:10px;inset-inline-end:10px;width:26px;height:26px;border-radius:50%;border:1px solid var(--hair);background:var(--tile);display:grid;place-items:center;color:var(--muted);padding:0}
.cat .info svg{width:14px;height:14px;margin:0}
.cat .about{position:absolute;inset:0;border-radius:var(--r);background:var(--tile);border:1px solid var(--hair);padding:18px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:14px;color:var(--ink);z-index:2;text-align:start}
.cat .about strong{font-size:17px}
.letters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;max-width:640px;margin:0 auto}
.letter{aspect-ratio:1;max-width:100%;background:var(--bg-alt);border:0;border-radius:14px;font-size:clamp(22px,4.4vw,30px);font-weight:500;display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.letter small{position:absolute;bottom:4px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.letter:hover:not([disabled]){background:var(--blue);color:var(--on-blue)}
.letter:hover:not([disabled]) small{color:var(--on-blue)}
.letter[disabled]{opacity:.3;cursor:not-allowed}
.letter.all{grid-column:span 7;aspect-ratio:auto;padding:12px;font-size:16px}
.letter.all small{position:static;margin-inline-start:6px}
.list{max-width:640px;margin:0 auto;background:var(--bg-alt);border-radius:var(--r);overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;background:none;border:0;border-bottom:1px solid var(--hair);text-align:start}
.row:last-child{border-bottom:0}
.row:hover:not([disabled]){background:color-mix(in srgb,var(--hair) 30%,transparent)}
.row[disabled]{opacity:.4;cursor:not-allowed}
.row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.row b{font-weight:500;font-size:17px;flex:1}
.row span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.row .chev{color:var(--muted);width:14px;height:14px}

/* Teams sheet */
.sheet{max-width:560px;margin:0 auto;text-align:center}
.picked{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.pill{background:var(--bg-alt);border-radius:980px;padding:6px 14px;font-size:14px;color:var(--ink)}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 6px}
.stepper button{width:52px;height:52px;border-radius:50%;border:0;background:var(--bg-alt);font-size:26px;display:grid;place-items:center}
.stepper button:hover:not([disabled]){background:var(--hair)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper output{font-size:72px;font-weight:600;min-width:2ch;line-height:1;font-variant-numeric:tabular-nums}
.unit{color:var(--muted);font-size:17px;margin:0 0 18px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.quick button{border:1px solid var(--hair);background:var(--tile);border-radius:980px;padding:6px 16px;font-size:15px;font-variant-numeric:tabular-nums}
.quick button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue-link);background:color-mix(in srgb,var(--blue) 8%,var(--tile))}
.range{width:100%;max-width:420px;margin:12px auto 26px;display:block;accent-color:var(--blue)}

/* Level picker on the teams sheet */
.lvseg{display:flex;gap:4px;background:var(--bg-alt);border-radius:14px;padding:4px;max-width:520px;margin:0 auto 30px;flex-wrap:wrap}
.lvseg button{flex:1 1 80px;border:0;background:none;border-radius:10px;padding:10px 6px;font-size:16px;display:grid;gap:0;color:var(--ink)}
.lvseg button small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvseg button[aria-checked="true"]{background:var(--tile);box-shadow:0 1px 6px rgba(30,47,77,.15);font-weight:600}
.lvseg button[disabled]{opacity:.35;cursor:not-allowed}
.step-h{font-size:clamp(22px,3.4vw,28px);font-weight:700;margin:0 0 12px;text-align:center}

/* Landing */
.ency{width:100%;display:flex;align-items:center;gap:clamp(18px,4vw,40px);text-align:start;border:0;background:var(--tile);border-radius:24px;padding:clamp(24px,5vw,48px);color:var(--ink);box-shadow:var(--shadow);transition:transform .2s}
.ency:hover{transform:scale(1.01)}
.ency-ic{flex:none;width:clamp(80px,14vw,128px);aspect-ratio:1;max-width:100%;border-radius:28px;background:color-mix(in srgb,var(--blue) 10%,var(--tile));color:var(--blue);display:grid;place-items:center}
.ency-ic svg{width:58%;height:58%}
.ency-tx{display:grid;gap:6px;min-width:0}
.ency-tx small{color:var(--muted);font-size:14px;font-weight:600}
.ency-tx b{font-size:clamp(26px,4.4vw,42px);line-height:1.1;font-weight:700}
.ency-tx span{color:var(--muted);font-size:17px;max-width:46ch}
.ency-tx em{font-style:normal;color:var(--blue-link);font-size:17px;margin-top:4px}
.band-h{font-size:clamp(24px,3.6vw,32px);font-weight:700;margin:40px 0 16px;text-align:center}
.contests{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.contest{background:var(--tile);border-radius:var(--r);padding:24px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:210px}
.contest svg{width:46px;height:46px;color:var(--blue);margin-bottom:6px}
.contest b{font-size:18px;font-weight:600;line-height:1.3}
.contest small{color:var(--muted);font-size:13px;line-height:1.45}
.contest .soon{margin-top:auto}
.contest.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--hair)}
.contest.ghost svg{color:var(--muted)}
.contest.ghost b{color:var(--muted);font-weight:500}
@media (max-width:900px){.contests{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.contests{grid-template-columns:repeat(2,minmax(0,1fr))}.ency{flex-direction:column;text-align:center;align-items:center}.ency-tx{justify-items:center}.contest{min-height:0}}

/* Wizard */
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;width:100%;justify-content:center;flex-wrap:wrap}
.steps li>span,.steps li>button{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:none;border:0;padding:6px 10px;border-radius:980px}
.steps li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--hair)}
.steps li.now>span{color:var(--ink);font-weight:600}
.steps li.now i{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.steps li.past>button{color:var(--blue-link)}
.steps li.past i{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps li+li::before{content:"";width:18px;height:1px;background:var(--hair);align-self:center}
.steps li{display:flex;gap:6px;align-items:center;align-self:center}
.steps{align-items:center;align-self:center}
.cat .pick{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;position:relative}
.cat .pick b{color:var(--ink)}
.cat:has(.pick[aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--bg-alt))}
.cat .tick{position:absolute;top:-16px;inset-inline-start:-4px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--hair);background:var(--tile);color:transparent;font-size:13px;display:grid;place-items:center}
.cat .pick[aria-pressed="true"] .tick{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.cat .pick:focus-visible{outline:2px solid var(--blue);outline-offset:6px;border-radius:12px}
.nextbar{position:sticky;bottom:0;z-index:5;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.nextbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:68px}
.barbtns{display:flex;gap:10px;flex:none}
.btn.prev{display:inline-flex;align-items:center;gap:4px;padding-inline:16px 20px}
.btn.prev svg{width:18px;height:18px}
.nextbar span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;min-width:0}
.choicegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:820px;margin:0 auto}
.choicegrid:not(.lv){grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:var(--bg-alt);border:0;border-radius:var(--r);padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.opt b{font-size:20px;font-weight:600}
.opt span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt small{font-size:14px;color:var(--muted);line-height:1.4}
.opt.big svg{width:44px;height:44px;color:var(--blue);margin-bottom:6px}
.opt .dot{width:14px;height:14px;border-radius:50%}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--bg-alt))}
.opt:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--hair)}
.opt[aria-checked="true"]:hover{box-shadow:inset 0 0 0 2px var(--blue)}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.letter[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.letter[aria-pressed="true"] small{color:var(--on-blue)}
@media (max-width:734px){.choicegrid.lv{grid-template-columns:repeat(2,minmax(0,1fr))}.choicegrid:not(.lv){grid-template-columns:1fr}.steps li+li::before{width:8px}.steps li>span,.steps li>button{padding:4px 4px;font-size:13px}}

/* Admin */
footer a,.flink{color:var(--blue-link);text-decoration:none}
.badge{font-size:12px;padding:4px 12px;border-radius:980px;background:var(--bg-alt);color:var(--muted)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.notice{background:var(--bg-alt);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);margin:0 0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.toolbar input[type=search]{flex:1 1 240px;min-width:0}
.toolbar input,.toolbar select,.sheet-form input[type=text],.sheet-form textarea,.sheet-form select{font:inherit;font-size:16px;color:var(--ink);background:var(--tile);border:1px solid var(--hair);border-radius:12px;padding:10px 14px;min-height:44px}
.toolbar select{flex:0 1 auto;max-width:100%}
.toolbar.acts{margin-bottom:6px}
.file{display:inline-flex;align-items:center;cursor:pointer}
.amsg{font-size:14px;color:var(--good)}
.acount{color:var(--muted);font-size:14px;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.qlist{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:var(--tile)}
.qrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--hair)}
.qrow:last-child{border-bottom:0}
.qmain{min-width:0;flex:1}
.qmain p{margin:0 0 2px;font-size:16px;font-weight:500;line-height:1.5}
.qans{display:block;color:var(--good);font-size:14px;font-weight:600}
.qmeta{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qbtns{display:flex;gap:6px;align-items:center;flex:none}
.mini{border:1px solid var(--hair);background:var(--tile);border-radius:980px;padding:5px 14px;font-size:14px;color:var(--blue-link);min-height:32px}
.mini.danger{color:var(--bad)}
.mini:hover{background:var(--bg-alt)}
.warn{font-size:13px;color:var(--bad)}
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet-form{background:var(--tile);color:var(--ink);border-radius:22px;width:100%;max-width:640px;padding:22px clamp(16px,4vw,28px);display:grid;gap:12px;box-shadow:0 20px 60px rgba(30,47,77,.25);max-height:100%;overflow-y:auto}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fhead h3{margin:0;font-size:21px;font-weight:600}
.fl{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.sheet-form textarea{resize:vertical;width:100%}
.sheet-form input[type=text],.sheet-form select{width:100%}
.seg{display:flex;background:var(--bg-alt);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button,.seg label{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:14px;text-align:center;cursor:pointer;color:var(--ink);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button[aria-checked="true"]{background:var(--tile);box-shadow:0 1px 4px rgba(30,47,77,.15);font-weight:600}
.optrow{display:flex;gap:10px;align-items:center;margin-top:6px}
.optrow input[type=radio]{width:20px;height:20px;accent-color:var(--good);flex:none}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.ferr{color:var(--bad);font-size:14px;margin:0;min-height:1em}
.factions{display:flex;justify-content:flex-end;gap:10px}
@media (max-width:734px){.g3{grid-template-columns:1fr 1fr}.g3 .fl:first-child{grid-column:1/-1}.qrow{flex-direction:column}.qbtns{align-self:flex-end}}

/* Game */
.game{background:var(--bg-alt);min-height:calc(100vh - 48px);padding-block:18px 40px}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.turn{display:flex;align-items:baseline;gap:10px}
.turn small{color:var(--muted);font-size:14px}
.turn b{font-size:clamp(24px,4vw,32px);font-weight:700}
.end{border:0;background:var(--tile);color:var(--bad);border-radius:980px;padding:8px 18px;font-size:15px;box-shadow:var(--shadow)}
.end:hover{background:var(--bad-soft)}
.teams{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 14px;scrollbar-width:none;scroll-behavior:smooth}
.teams::-webkit-scrollbar{display:none}
.teams span{flex:none;min-width:36px;height:36px;padding:0 10px;border-radius:980px;display:grid;place-items:center;font-size:14px;background:var(--tile);color:var(--muted);font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.teams span.now{background:var(--blue);color:var(--on-blue);font-weight:600}
.card{background:var(--tile);border-radius:24px;padding:clamp(22px,5vw,48px);box-shadow:var(--shadow)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.meta-row .lvl-سهل{color:var(--good)}.meta-row .lvl-صعب{color:var(--bad)}
.qtext{font-size:clamp(24px,4vw,36px);font-weight:600;line-height:1.35;margin:0 0 28px;text-wrap:pretty}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{display:flex;align-items:center;gap:14px;text-align:start;background:var(--bg-alt);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-size:19px;line-height:1.4;transition:background .15s,border-color .15s}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tile);font-size:15px;font-weight:600;color:var(--muted)}
.choice:hover:not([disabled]){border-color:var(--hair)}
.choice[disabled]{cursor:default}
.choice.correct{background:var(--good-soft);border-color:var(--good)}
.choice.correct .k{background:var(--good);color:#fff}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:#fff}
.choice.dim{opacity:.5}
.two .choice{justify-content:center;font-size:24px;font-weight:600;padding:24px}
.two .choice .k{display:none}
.answer{background:var(--bg-alt);border-radius:14px;padding:16px 18px}
.answer small{display:block;color:var(--muted);font-size:13px}
.answer b{font-size:26px;font-weight:700;color:var(--good)}
.note{margin-top:14px;font-size:16px;color:var(--ink);line-height:1.6}
.note .src{display:block;color:var(--muted);font-size:13px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}

.done{text-align:center;padding-block:64px}
.done svg{width:64px;height:64px;margin:0 auto 14px;color:var(--good)}
.done h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px;font-weight:700}
.done p{color:var(--muted);font-size:19px;margin:0}

/* سين جيم */
.sj-setup{max-width:780px;margin:0 auto;display:grid;gap:16px}
.sj-box{background:var(--bg-alt);border-radius:var(--r);padding:20px clamp(16px,3vw,24px);display:grid;gap:12px}
.sj-box :is(h2,h3):not(.h4){margin:0;font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sj-box :is(h2,h3):not(.h4) small{font-size:13px;color:var(--muted);font-weight:400}
.sj-box .seg{background:color-mix(in srgb,var(--hair) 60%,transparent)}
.sj-box .seg button{font-size:16px;padding:10px}
.sj-sub{font-size:13px;color:var(--muted);margin:-4px 0 0}
.sj-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sj-two>div{display:grid;gap:10px;align-content:start}
.sj-two h2.h4{margin:0;font-size:15px;font-weight:600}
.sj-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sj-names input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--tile);border:1px solid var(--hair);border-inline-start:5px solid var(--tc);border-radius:12px;padding:10px 14px;min-height:46px}
.sj-names input:focus{outline:2px solid var(--blue);outline-offset:1px}
.sj-helps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sj-help{background:var(--tile);border:0;border-radius:14px;padding:14px;text-align:start;display:grid;gap:4px;align-content:start;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--hair);position:relative}
.sj-help b{font-size:16px;font-weight:600;padding-inline-end:26px}
.sj-help small{font-size:13px;color:var(--muted);line-height:1.45}
.sj-help::after{content:"";position:absolute;top:13px;inset-inline-end:12px;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--hair);background:var(--tile)}
.sj-help[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--tile))}
.sj-help[aria-pressed="true"]::after{content:"✓";background:var(--blue);box-shadow:none;color:var(--on-blue);font-size:12px;display:grid;place-items:center}
.sj-tabs{display:flex;gap:8px;flex-wrap:wrap}
.sj-tab{border:0;border-radius:980px;padding:8px 14px;background:var(--tile);color:var(--ink);font-size:15px;display:inline-flex;gap:8px;align-items:center;box-shadow:inset 0 0 0 1.5px var(--hair);min-height:40px;max-width:100%}
.sj-tab i{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
.sj-tab b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sj-tab span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sj-tab[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--tc)}
.sj-tab[aria-selected="true"] b{font-weight:700}
.sj-tab.full span{color:var(--good)}
.sj-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sj-cat{background:var(--tile);border:0;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:start;font-size:14px;color:var(--ink);box-shadow:inset 0 0 0 1.5px transparent;min-height:54px}
.sj-cat svg{width:22px;height:22px;flex:none;color:var(--blue)}
.sj-cat span{display:grid;line-height:1.3;min-width:0}
.sj-cat small{font-size:11.5px;color:var(--muted)}
.sj-cat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tc);background:color-mix(in srgb,var(--tc) 9%,var(--tile))}
.sj-cat[aria-pressed="true"] small{color:var(--tc);font-weight:600}
.sj-cat.taken{background:color-mix(in srgb,var(--tc) 7%,var(--tile));cursor:not-allowed}
.sj-cat.taken small{color:var(--tc)}
.sj-cat.taken svg,.sj-cat.taken b{opacity:.55}
.sj-cat.na{opacity:.45;cursor:not-allowed}
.sj-resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--blue) 8%,var(--tile));border-radius:var(--r);padding:14px 18px}
.sj-scores{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;margin:14px 0 18px}
.sj-score{background:var(--tile);border-radius:16px;padding:12px 14px 10px;display:grid;gap:0;border-top:5px solid var(--tc);box-shadow:var(--shadow);transition:transform .2s}
.sj-score.now{box-shadow:inset 0 0 0 2px var(--tc),var(--shadow)}
.sj-score small{color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sj-score b{font-size:clamp(24px,3.6vw,32px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--tc)}
.sj-score .hl{font-size:12px;color:var(--muted);min-height:16px}
.sj-score .tag{font-size:11px;color:var(--tc);font-weight:600}
.sj-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sj-col{background:var(--tile);border-radius:var(--r);padding:14px;display:grid;gap:12px;align-content:start;border-top:5px solid var(--tc);box-shadow:var(--shadow)}
.sj-head{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.sj-head svg{width:30px;height:30px;color:var(--blue);grid-row:span 2}
.sj-head b{font-size:15px;line-height:1.3;font-weight:600}
.sj-head small{color:var(--muted);font-size:12px;display:flex;gap:6px;flex-wrap:wrap}
.sj-head small em{font-style:normal;color:var(--tc);font-weight:600}
.sj-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sj-tile{border:0;border-radius:10px;background:var(--blue);color:var(--on-blue);font-size:17px;font-weight:700;padding:12px 0;font-variant-numeric:tabular-nums;min-height:46px;transition:transform .15s,filter .15s}
.sj-tile:hover:not([disabled]){filter:brightness(1.08);transform:translateY(-1px)}
.sj-tile[disabled]{background:var(--bg-alt);color:var(--muted);font-weight:500;font-size:12px;line-height:1.2;padding:6px 2px;overflow:hidden}
.sj-tile.won{background:color-mix(in srgb,var(--wc) 15%,var(--bg-alt));color:var(--wc)}
.sj-val{background:var(--blue);color:var(--on-blue)!important;border-radius:980px;padding:2px 10px;font-weight:600}
.sj-order{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.sj-order span{background:var(--bg-alt);border-radius:980px;padding:3px 10px;color:var(--ink);border-inline-start:4px solid var(--tc)}
.sj-helpbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.sj-helpbar>small{color:var(--muted);font-size:13px;margin-inline-end:4px}
.sj-helpbar .mini[disabled]{opacity:.45;text-decoration:line-through}
.sj-helpbar .mini.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue);text-decoration:none;opacity:1}
.sj-hint{margin-top:14px;background:color-mix(in srgb,var(--blue) 8%,var(--bg-alt));border-radius:12px;padding:10px 14px;font-size:16px}
.choice.gone{opacity:.22;text-decoration:line-through}
.sj-award{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);display:grid;gap:12px}
.sj-award p{margin:0;font-weight:600;font-size:17px}
.sj-award div{display:flex;gap:10px;flex-wrap:wrap}
.sj-award .btn.team{background:var(--tc)}
.sj-rank{max-width:520px;margin:26px auto 0;display:grid;gap:8px;text-align:start}
.sj-rank li{list-style:none;display:flex;align-items:center;gap:12px;background:var(--bg-alt);border-radius:14px;padding:12px 16px;border-inline-start:5px solid var(--tc)}
.sj-rank li b{flex:1;font-size:18px}
.sj-rank li span{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tc)}
.sj-rank li i{font-style:normal;color:var(--muted);width:22px}
.sj-rank{padding:0}
.contest.live{border:0;color:var(--ink);box-shadow:inset 0 0 0 2px var(--blue);cursor:pointer;transition:transform .2s}
.contest.live:hover{transform:translateY(-2px)}
.contest .go{margin-top:auto;font-size:13px;background:var(--blue);color:var(--on-blue);padding:4px 14px;border-radius:980px;margin-top:14px}
@media (max-width:734px){.sj-two{grid-template-columns:1fr}.sj-helps{grid-template-columns:1fr 1fr}.sj-board{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sj-col{padding:10px}.sj-tile{font-size:15px}.sj-scores{gap:6px;margin:10px 0 14px}.sj-score{padding:8px 10px 6px;border-radius:12px;border-top-width:4px}.sj-score small{font-size:12.5px}.sj-score .hl{font-size:11px}.sj-score .hl .tag{display:none}}
@media (max-width:440px){.sj-names{grid-template-columns:1fr}.sj-helps{grid-template-columns:1fr}.sj-cats{grid-template-columns:1fr 1fr}.sj-head svg{display:none}.sj-head{grid-template-columns:1fr}}

/* بالأربع تربح */
.b4-rules{margin:0;padding-inline-start:22px;display:grid;gap:6px;font-size:16px}
.b4-pts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.b4-pts span{background:var(--tile);border-radius:14px;padding:12px 14px;display:grid;gap:2px;font-size:14px;color:var(--muted)}
.b4-pts b{font-size:26px;color:var(--good);font-variant-numeric:tabular-nums}
.b4-pts .g b{color:#A87B00}
.b4{background:var(--bg-alt);min-height:calc(100vh - 48px);padding-block:14px 28px}
.b4-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.b4-title{display:flex;align-items:baseline;gap:10px}
.b4-title b{font-size:clamp(22px,3vw,30px);font-weight:700}
.b4-title span{color:var(--muted);font-size:15px}
.b4-acts,.b4-tools{display:flex;gap:8px;flex-wrap:wrap}
.b4 .mini,.b4-host .mini{display:inline-flex;align-items:center;gap:6px}
.b4 .mini svg,.b4-host .mini svg{width:16px;height:16px}
.b4-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:20px;align-items:start}
.b4-board{display:grid;grid-template-columns:14px repeat(var(--n),minmax(0,1fr) 14px);grid-template-rows:14px repeat(var(--n),minmax(0,1fr) 14px);aspect-ratio:1;width:min(100%,calc(100vh - 150px));min-width:0;margin:0 auto;background:var(--tile);border-radius:24px;padding:clamp(10px,2vw,22px);box-shadow:var(--shadow)}
.b4-dot{background:var(--muted);border-radius:50%;width:10px;height:10px;place-self:center;opacity:.55}
.b4-e{border:0;background:none;padding:0;display:grid;place-items:center;min-width:0;min-height:0}
.b4-e span{display:block;background:var(--hair);border-radius:4px;opacity:.55}
.b4-e.h span{width:100%;height:6px}
.b4-e.v span{height:100%;width:6px}
.b4-e.on span{background:var(--tc);opacity:1}
.b4-e.on.h span{height:9px}.b4-e.on.v span{width:9px}
.b4-e.can{cursor:pointer}
.b4-e.can span{background:var(--blue);opacity:.9;animation:b4pulse 1.1s ease-in-out infinite}
.b4-e.on.can span{background:var(--tc)}
.b4-e.can:hover span{opacity:1;transform:scale(1.06)}
@keyframes b4pulse{50%{opacity:.35}}
.b4-sq{border:0;margin:6px;border-radius:16px;background:var(--bg-alt);color:var(--ink);display:grid;place-items:center;align-content:center;gap:0;min-width:0;min-height:0;position:relative;transition:transform .15s,background .2s;box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--hair) 80%,transparent)}
.b4-sq b{font-size:clamp(26px,calc(46vmin / var(--n)),76px);line-height:1;font-weight:700}
.b4-sq small{font-size:clamp(10px,1.3vw,13px);color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:4px}
.b4-sq[data-b4sq]{cursor:pointer}
.b4-sq[data-b4sq]:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--blue) 10%,var(--bg-alt))}
.b4-sq.gold{background:linear-gradient(160deg,#FBEFC4,#F0D683);color:#6B4E00;box-shadow:inset 0 -3px 0 #D9B850}
.b4-sq.gold small{color:#8A6A00}
.b4-sq.own{background:color-mix(in srgb,var(--tc) 22%,var(--tile));color:var(--tc);box-shadow:inset 0 0 0 2px var(--tc)}
.b4-sq.own small{color:var(--tc)}
.b4-sq.own.gold{background:linear-gradient(160deg,#FBEFC4,color-mix(in srgb,var(--tc) 35%,#F0D683))}
.b4-sq.sel{box-shadow:inset 0 0 0 3px var(--blue)}
.b4-sq:disabled{cursor:default}
.b4-right{display:grid;gap:12px}
.b4-prompt{background:var(--tile);border-radius:var(--r);padding:16px 18px;font-size:19px;line-height:1.45;display:grid;gap:4px;box-shadow:var(--shadow)}
.b4-prompt small{color:var(--blue-link);font-size:14px}
.b4-msg{font-size:14px;color:var(--good);font-weight:600}
.b4-teams{display:grid;gap:10px}
.b4-team{background:var(--tile);border-radius:16px;padding:12px 14px;border-inline-start:6px solid var(--tc);display:grid;gap:4px;box-shadow:var(--shadow)}
.b4-team.now{box-shadow:inset 0 0 0 2px var(--tc),var(--shadow)}
.b4-tn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b4-tn b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b4-tn em{font-style:normal;font-size:12px;background:var(--tc);color:#fff;border-radius:980px;padding:2px 10px}

.band-sub{text-align:center;color:var(--muted);margin:-8px 0 18px}
.contest .c-meta{font-size:12px;color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:980px;padding:2px 10px;margin-top:4px}

.ac-owner{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;background:var(--tile);border-radius:var(--r);padding:18px 22px;margin-top:22px;box-shadow:var(--shadow)}

.ac-login{display:grid;grid-template-columns:1fr minmax(280px,380px);gap:clamp(20px,4vw,48px);align-items:center;background:var(--tile);border-radius:28px;padding:clamp(22px,4vw,44px);margin-top:28px;box-shadow:var(--shadow)}

.ac-form input,.ac-edit input:not([type=checkbox]):not([type=color]):not([type=file]){font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--hair);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}

.ac-err{color:var(--bad);margin:0;min-height:1.2em;font-size:14px}
.ac-back{text-align:center;margin-top:18px}
.ac-hello{display:inline-flex;align-items:center;gap:10px;font-size:18px;margin:0 0 4px}

.ac-navorg{display:inline-flex;align-items:center;gap:6px;padding-inline-start:10px;margin-inline-start:4px;border-inline-start:1px solid var(--hair);font-size:13px;font-weight:600;max-width:40vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ac-navorg img{height:26px;width:auto;max-width:60px;object-fit:contain}
.ac-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
.ac-edit{display:grid;gap:14px}
.ac-edit small{font-size:12px;color:var(--muted);font-weight:400}
.ac-pw{display:flex;gap:8px}.ac-pw input{flex:1}
.ac-brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ac-logo{width:120px;height:120px}

.ac-cols input[type=color]{width:56px;height:36px;border:0;border-radius:10px;background:none;padding:0;cursor:pointer}
.ac-prev{border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--hair)}
.ac-prev-nav{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-alt)}

.ac-prev-nav i{width:10px;height:10px;background:var(--p1)}.ac-prev-nav i:last-child{background:var(--p2)}

.ac-prev-body{display:flex;align-items:center;gap:10px;padding:16px 14px;background:var(--tile)}

.ac-prev-btn{background:var(--p1);color:var(--p1on);border-radius:980px;padding:6px 16px;font-size:14px}
.ac-prev-tag{color:var(--p2);font-weight:700;font-size:14px}
.ac-act{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important}
.ac-btns{display:flex;gap:10px;align-items:center}
.ac-list{background:var(--tile);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:grid;gap:10px}
.ac-list h3{margin:0 0 4px;display:flex;justify-content:space-between}.ac-list h3 small{color:var(--muted);font-weight:400}
.ac-row{display:grid;grid-template-columns:48px 1fr auto;grid-template-areas:"l t s" "b b b";gap:8px 12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg-alt)}

.ac-row-logo{grid-area:l;width:48px;height:48px;border-radius:12px;background:var(--p1);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden}

.mini.danger{color:var(--bad)}
.ac-cred{display:grid;gap:6px;background:color-mix(in srgb,var(--good) 10%,var(--tile));border-radius:16px;padding:16px 18px;margin-top:18px;box-shadow:inset 0 0 0 1.5px var(--good)}
.ac-cred code{font-size:18px;font-weight:700;background:var(--tile);padding:2px 8px;border-radius:8px}
.ac-cred small{color:var(--muted)}.ac-cred .mini{justify-self:start}
@media (max-width:820px){.ac-login{grid-template-columns:1fr}.ac-grid{grid-template-columns:1fr}}
.ac-pvbar{position:fixed;z-index:70;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#26323E;color:#fff;border-radius:980px;padding:8px 10px 8px 16px;box-shadow:0 8px 30px rgba(20,33,58,.35);font-size:14px;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}

.empty{padding:80px 16px;text-align:center;color:var(--muted)}
footer{background:var(--bg-alt);color:var(--muted);font-size:12px;padding-block:18px 26px;border-top:1px solid var(--hair)}

.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.cat,.teams{transition:none;scroll-behavior:auto}}

/* game screen */
