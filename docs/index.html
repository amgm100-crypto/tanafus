.er-code-word{font-size:40px;font-weight:700;text-align:center;letter-spacing:.3em;color:#3634A3;background:#F8F8FA;border-radius:16px;padding:10px}
.er-alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:3px}
.er-alpha span{display:grid;justify-items:center;background:#F8F8FA;border-radius:8px;padding:2px 0;line-height:1.2}
.er-alpha b{font-size:17px}
.er-alpha small{font-size:10px;color:#5B656E}
.er-alpha.abj{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
.er-lamps{display:flex;gap:10px;justify-content:center;padding:8px 0}
.er-lamp{display:grid;justify-items:center;gap:4px;border:0;background:none;padding:0;color:#5B656E}
.er-lamp i{width:44px;height:44px;border-radius:50%;background:#DFE1E5;box-shadow:inset 0 -4px 0 rgba(30,47,77,.12);transition:background .15s,box-shadow .15s}
.er-lamp.on i{background:#FFD60A;box-shadow:0 0 18px #FFD60A,inset 0 -4px 0 rgba(178,80,0,.25)}
.er-lamp small{font-size:13px;font-weight:600;min-height:18px}
.er-lamps.sw .er-lamp{cursor:pointer}
.er-expr{background:#13324A;color:#FFFFFF;border-radius:16px;padding:16px;font-size:22px;text-align:center;line-height:2.3;direction:rtl;white-space:nowrap;overflow-x:auto;font-size:19px}
.er-var{display:inline-block;min-width:34px;text-align:center;line-height:34px;border-radius:10px;background:#22C3D6;color:#13324A;font-weight:800;margin:0 2px}
.er-gate{font-style:normal;font-size:15px;border-radius:980px;padding:3px 10px;background:rgba(255,255,255,.14);font-weight:600}
.er-gate.and{color:#7FE3EE}.er-gate.or{color:#FFD60A}.er-gate.not{color:#FF9A92}.er-gate.xor{color:#C4B5FD}
.er-lockers{display:flex;gap:6px;justify-content:center}
.er-lockers span{width:46px;height:60px;border-radius:8px;background:#DFE1E5;display:grid;place-items:center;font-weight:700;font-size:20px;color:#26323E;box-shadow:inset 0 -4px 0 rgba(30,47,77,.12)}
.er-paths{width:100%;max-width:300px;height:auto}
.er-kq{font-size:20px;font-weight:600;line-height:1.5}
.er-num{width:100%;font:inherit;font-size:30px;font-weight:700;text-align:center;border:2px solid #DFE1E5;border-radius:16px;padding:10px;color:#26323E;background:#FFFFFF;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.er-num:focus{outline:none;border-color:var(--tc)}
.er-opts{display:grid;gap:8px}
.er-opt{text-align:start;border:2px solid #E6EBF2;background:#F7F9FC;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5;color:#26323E}
.er-opt[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,#FFFFFF);font-weight:600}
.er-rose{position:relative;width:260px;height:260px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#FBF7EF 0 55%,#F2E6CC 56% 100%);box-shadow:inset 0 0 0 4px #C9A253}
.er-rose-c{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:#C9A253;transform:translate(-50%,-50%)}
.er-dir{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:980px;padding:4px 8px;font-size:12px;background:#FFFFFF;box-shadow:0 2px 8px rgba(30,47,77,.15);color:#26323E;white-space:nowrap}
.er-dir[aria-pressed="true"]{background:var(--tc);color:#FFFFFF}
.er-mapwrap{display:grid;justify-items:center;gap:4px}
.er-n{font-weight:700;color:#D70015;font-size:14px}
.er-map{display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));gap:3px;width:min(100%,300px);background:#2C5D8F;padding:6px;border-radius:14px}
.er-cell{aspect-ratio:1;border:0;border-radius:6px;background:#9CC9DF;display:grid;place-items:center;padding:0;color:#26323E}
.er-cell.isl{background:#E7D3A2}
.er-cell svg{width:70%;height:70%}
.er-cell[aria-pressed="true"]{background:#FFFFFF;box-shadow:inset 0 0 0 3px #D70015}
.er-simon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,260px);margin:0 auto}
.er-sl{aspect-ratio:1;border:0;border-radius:24px;background:color-mix(in srgb,var(--c) 35%,#FFFFFF);transition:background .1s,transform .1s,box-shadow .1s}
.er-sl.on{background:var(--c);box-shadow:0 0 30px var(--c);transform:scale(1.04)}
.er-simon-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.er-simon-bar .mini{display:inline-flex;align-items:center;gap:6px}
.er-simon-bar .mini svg{width:14px;height:14px}
.er-simon-bar span{letter-spacing:.2em;color:var(--tc);font-size:18px}
.er-hintbox{background:#FFF8E1;border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:inset 0 0 0 1.5px #F0D683}
.er-hintbox small{display:block;color:#8A6A00;font-weight:700;font-size:12px}
.er-cool{display:flex;align-items:center;gap:8px;background:#FCE6E8;color:#D70015;border-radius:12px;padding:10px 14px;font-size:14px}
.er-cool svg{width:18px;height:18px}
.er-solved,.er-lockd{display:grid;justify-items:center;text-align:center;gap:6px;padding:10px 0}
.er-solved svg{width:44px;height:44px;color:#248A3D;background:#E3F4E7;border-radius:50%;padding:8px}
.er-solved b,.er-lockd b{font-size:20px}
.er-lockd svg{width:52px;height:52px;color:#D70015;background:#FCE6E8;border-radius:16px;padding:10px}
.er-reward{display:flex;gap:14px;align-items:center;background:#F7F9FC;border-radius:16px;padding:12px}
.er-used{font-size:13px;color:#248A3D;display:flex;gap:6px;align-items:center}
.er-used svg{width:18px;height:18px}
.er-dials{display:flex;gap:6px;justify-content:center;padding:6px 0}
.er-dial{display:grid;justify-items:center;gap:2px;background:linear-gradient(180deg,#5C3F24,#7A5634);border-radius:12px;padding:6px 4px;width:50px;color:#FBEFC4}
.er-dial small{font-size:14px;font-weight:700;color:#F0D683}
.er-dial button{border:0;background:rgba(255,255,255,.12);color:#FBEFC4;border-radius:8px;width:38px;height:30px;font-size:13px}
.er-dial b{font-size:30px;font-variant-numeric:tabular-nums;background:#FBF7EF;color:#26323E;border-radius:8px;width:40px;text-align:center;line-height:1.3}

.er-toast{position:absolute;bottom:120px;left:50%;transform:translate(-50%,20px);background:#26323E;color:#FFFFFF;border-radius:980px;padding:10px 20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.er-toast.show{opacity:1;transform:translate(-50%,0)}
.er-toast.good{background:#248A3D}
.er-toast.bad{background:#D70015}
.er-modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,33,58,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px;z-index:5;overflow-y:auto;-webkit-user-select:text;user-select:text;touch-action:auto}
.er-card{background:#FFFFFF;border-radius:28px;max-width:620px;width:100%;padding:clamp(22px,4vw,36px);display:grid;gap:12px;text-align:center;box-shadow:0 30px 80px rgba(20,33,58,.45);animation:erup .5s cubic-bezier(.2,.9,.3,1.15)}
@keyframes erup{from{opacity:0;transform:translateY(30px) scale(.96)}}
.er-card h2{margin:0;font-size:clamp(28px,4.4vw,40px);line-height:1.15}
.er-card p{margin:0;font-size:17px;line-height:1.7;color:#34496F}
.er-modal.story .er-card{text-align:start;background:linear-gradient(180deg,#FFFFFF,#F7F2E8)}
.er-modal.story .er-card .btn,.er-card .btn{justify-self:center;margin-top:6px}
.er-eyebrow{color:var(--red2)!important;font-weight:700;font-size:14px!important}
.er-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.er-facts span{background:#F8F8FA;border-radius:14px;padding:10px 6px;display:grid}
.er-facts b{font-size:24px;font-variant-numeric:tabular-nums}
.er-facts small{font-size:12px;color:#5B656E}
.er-burst{justify-self:center;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#FFF6DA,#F4DDA0);display:grid;place-items:center;color:#8A6A00;animation:erglow 1.6s ease-in-out infinite}
.er-burst svg{width:46px;height:46px}
@keyframes erglow{50%{box-shadow:0 0 0 18px rgba(244,221,160,.35)}}
.er-modal.lose .er-burst{background:#FCE6E8;color:#D70015}
.er-res{list-style:none;padding:0;margin:4px 0;display:grid;gap:6px;text-align:start}
.er-res li{display:flex;gap:10px;align-items:center;background:#F8F8FA;border-radius:12px;padding:10px 14px}
.er-res li b{flex:1}
.er-res li span{font-size:13px;color:#5B656E}
.er-res li.ok span{color:#248A3D;font-weight:700}
.er-res li.no span{color:#D70015}
.er-res li em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.er-loading{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;background:#E4ECF5;text-align:center;padding:20px}
.er-spin{width:44px;height:44px;border-radius:50%;border:4px solid #DFE1E5;border-top-color:var(--tc,#0071E3);animation:erspin 1s linear infinite;justify-self:center}
@keyframes erspin{to{transform:rotate(360deg)}}
@media (max-width:734px){
  .er-hud{left:8px;right:8px;gap:6px}
  .er-hud-c{position:static;transform:none;order:-1;width:100%;display:flex;justify-content:center}
  .er-time{min-width:0;padding:4px 18px 6px;flex-direction:row}
  .er-time b{font-size:24px}
  .er-chip.team{display:none}
  .er-chip{min-height:36px;padding:6px 10px;font-size:13px}
  .er-chip.ttl b{font-size:14px}
  .er-ib{width:36px;height:36px;border-radius:12px}
  .er-panel{top:auto;bottom:0;inset-inline:0;width:100%;max-height:82%;border-radius:24px 24px 0 0;animation-name:erinb}
  @keyframes erinb{from{transform:translateY(40px)}}
  .er-digit{width:38px;height:50px}
  .er-digit b{font-size:20px}
  .er-item small{display:none}
  .er-item{min-width:0}
  .er-tag{font-size:11.5px;padding:4px 9px 4px 8px}
  .er-facts b{font-size:19px}
}

/* host screen */
.er-host{padding-block:26px 40px;background:var(--bg-alt);min-height:calc(100vh - 48px)}
.er-host .wrap{max-width:1180px}
.er-hh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.er-hh h1{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.1}
.er-hh .eyebrow{margin:0 0 6px;font-size:15px}
.er-hb{display:flex;gap:8px;flex-wrap:wrap}
.er-join{display:flex;gap:28px;align-items:center;background:var(--tile);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.er-qr{background:#FFFFFF;border-radius:16px;padding:10px;width:200px;max-width:100%}
.er-qr svg,.er-qr img{width:100%;height:auto;display:block}
.er-jt{display:grid;gap:6px;max-width:420px}
.er-jt small{color:var(--muted);font-weight:600}
.er-jt .tk-code{font-size:clamp(44px,7vw,72px)}
.er-jt p{margin:0;color:var(--muted)}
.er-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.er-tcard{background:var(--tile);border-radius:16px;padding:12px 14px;border-top:5px solid var(--tc);display:grid;gap:4px;box-shadow:var(--shadow)}
.er-tcard b{font-size:17px}
.er-tcard span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.er-pips{display:flex;gap:4px}
.er-pips i{width:12px;height:12px;border-radius:50%;background:var(--hair)}
.er-pips i.on{background:var(--tc)}
.er-hfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}
.er-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.er-board.coop{grid-template-columns:1fr}
.er-race{background:var(--tile);border-radius:22px;padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow);border-inline-start:6px solid var(--tc)}
.er-race.done{background:color-mix(in srgb,var(--good) 8%,var(--tile))}
.er-rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.er-rh b{font-size:22px}
.er-rh span{color:var(--muted);font-size:13px}
.er-rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.er-rooms span{display:grid;justify-items:center;gap:2px;background:var(--bg-alt);border-radius:12px;padding:8px 4px;font-weight:700;color:var(--muted)}
.er-rooms span svg{width:20px;height:20px}
.er-rooms span small{font-size:11px;font-weight:500}
.er-rooms span.now{background:color-mix(in srgb,var(--tc) 14%,var(--tile));color:var(--tc);box-shadow:inset 0 0 0 2px var(--tc)}
.er-rooms span.ok{background:var(--good-soft);color:var(--good)}
.er-rooms span.no{background:var(--bad-soft);color:var(--bad)}
.er-prog{display:flex;align-items:center;justify-content:space-between;gap:10px}
.er-stp{display:flex;gap:5px}
.er-stp i{width:24px;height:24px;border-radius:8px;background:var(--bg-alt);box-shadow:inset 0 0 0 1.5px var(--hair)}
.er-stp i.on{background:var(--tc);box-shadow:none}
.er-stp i.chest{background:#F4DDA0;margin-inline-start:6px;box-shadow:none}
.er-left{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.er-left.warm{color:#B25000}
.er-left.hot{color:var(--bad)}
.er-rm{display:flex;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.er-rm span{display:inline-flex;gap:4px;align-items:center}
.er-rm svg{width:14px;height:14px}
.er-rdone{margin:0;color:var(--good);font-weight:700}
.er-qrpop{margin-top:10px}
.er-pick .btn{color:#FFFFFF}
.er-tnames{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}.er-tnames li{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc) 14%,var(--tile));color:var(--tc)}
.er-grp{display:inline-block;border:2px solid rgba(127,227,238,.55);border-radius:12px;padding:0 6px;margin:3px 2px;line-height:2.2}
.er-grp .er-grp{border-color:rgba(255,214,10,.55)}
/* quick quiz on the home page: a dark rounded panel with a glass card */
.qz-band{padding-block:34px 6px}
.qz-panel{--qa:#FF8A5B;--qb:#FFC857;--qc:#F0648C;position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:44px;align-items:center;
  padding:clamp(26px,4vw,52px);border-radius:34px;color:#fff;
  background:radial-gradient(60% 80% at 85% 10%,rgba(255,138,91,.28),transparent 60%),radial-gradient(50% 70% at 10% 100%,rgba(240,100,140,.22),transparent 60%),linear-gradient(160deg,#1F2833,#17191F 70%);
  box-shadow:0 30px 60px -30px rgba(23,25,31,.55)}
.qz-panel::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent)}
.qz-eye{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#FFD2BF;border:1px solid rgba(255,138,91,.45);background:rgba(255,138,91,.1);border-radius:980px;padding:6px 14px;margin:0 0 16px}
.qz-eye i{width:7px;height:7px;border-radius:50%;background:var(--qa);box-shadow:0 0 0 4px rgba(255,138,91,.22)}
.qz-intro h2{font-size:clamp(34px,4.6vw,60px);line-height:1.15;margin:0 0 16px;color:#fff}
.qz-intro h2 span{background:linear-gradient(90deg,var(--qb),var(--qa) 50%,var(--qc));-webkit-background-clip:text;background-clip:text;color:transparent}
.qz-intro>p{color:rgba(255,255,255,.66);font-size:17px;line-height:1.8;margin:0;max-width:440px}
.qz-facts{display:flex;gap:0;margin-top:26px;flex-wrap:wrap}
.qz-facts span{display:grid;padding-inline:18px;border-inline-start:1px solid rgba(255,255,255,.14)}
.qz-facts span:first-child{padding-inline-start:0;border:0}
.qz-facts b{font-size:22px}.qz-facts small{font-size:13px;color:rgba(255,255,255,.55)}
.qz-stage{position:relative;padding-top:14px}
.qz-tag{position:absolute;top:0;inset-inline-end:22px;z-index:2;font-size:13px;font-weight:700;color:#2B1B12;background:linear-gradient(90deg,var(--qb),var(--qa));border-radius:980px;padding:6px 14px;box-shadow:0 8px 20px -6px rgba(255,138,91,.6);transform:rotate(-3deg)}
.qz-card{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:26px;padding:26px 22px 20px;display:grid;gap:14px;box-shadow:0 24px 50px -24px rgba(0,0,0,.6)}
.qz-top{display:flex;align-items:center;gap:10px}
.qz-cat{font-size:13px;font-weight:600;color:#FFB59A;border:1px solid rgba(255,138,91,.45);background:rgba(255,138,91,.1);border-radius:10px;padding:4px 11px}
.qz-num{flex:1;text-align:center;font-size:13px;color:rgba(255,255,255,.6)}
.qz-ring{--p:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--qa) calc(var(--p) * 360deg),rgba(255,255,255,.12) 0);position:relative}
.qz-ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#1E2229}
.qz-ring b{position:relative;font-size:16px;color:#fff}
.qz-ring.low{background:conic-gradient(#FF5470 calc(var(--p) * 360deg),rgba(255,255,255,.12) 0)}.qz-ring.low b{color:#FF7A8E}
.qz-bar{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.qz-bar i{height:5px;border-radius:9px;background:rgba(255,255,255,.13)}
.qz-bar i.cur{background:linear-gradient(90deg,var(--qb),var(--qa))}.qz-bar i.ok{background:#3DD68C}.qz-bar i.no{background:#FF5470}
.qz-q{font-size:clamp(21px,2.4vw,28px);line-height:1.5;margin:6px 0 4px;color:#fff}
.qz-opts{display:grid;gap:10px}
.qz-o{display:flex;align-items:center;gap:12px;text-align:start;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);border-radius:14px;padding:11px 14px;font:inherit;font-size:16.5px;color:#fff;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.qz-o i{font-style:normal;font-weight:700;width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.qz-o:not(:disabled):hover{border-color:rgba(255,138,91,.7);background:rgba(255,138,91,.1);transform:translateY(-1px)}
.qz-o.ok{border-color:#3DD68C;background:rgba(61,214,140,.16)}.qz-o.ok i{background:#3DD68C;color:#0F2A1D}
.qz-o.no{border-color:#FF5470;background:rgba(255,84,112,.14)}.qz-o.no i{background:#FF5470;color:#fff}
.qz-o.dim{opacity:.45}.qz-o:disabled{cursor:default}
.qz-hint{margin:0;font-size:14px;color:rgba(255,255,255,.58)}
.qz-end{text-align:center;justify-items:center;padding-block:30px 24px}
.qz-score{position:relative;width:140px;height:140px}
.qz-score svg{width:100%;height:100%;transform:rotate(-90deg)}
.qz-score circle{fill:none;stroke:rgba(255,255,255,.12);stroke-width:10}
.qz-score circle.v{stroke:var(--qa);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:calc(326.7 * (1 - var(--p)));animation:qzfill 1.1s ease-out both}
@keyframes qzfill{from{stroke-dashoffset:326.7}}
.qz-score b{position:absolute;inset:0;display:grid;place-content:center;font-size:46px;line-height:1;color:#fff}
.qz-score small{font-size:14px;color:rgba(255,255,255,.6);font-weight:500}
.qz-end h3{margin:0;font-size:28px;color:#fff}.qz-end p{margin:0;color:rgba(255,255,255,.65)}
.qz-best{font-size:14px}
.qz-rev{width:100%;text-align:start}
.qz-rev summary{cursor:pointer;font-weight:600;color:#FFB59A;text-align:center}
.qz-rev ol{margin:12px 0 0;padding-inline-start:20px;display:grid;gap:9px;font-size:14px;max-height:260px;overflow:auto}
.qz-rev li b{display:block;font-weight:600;color:#fff}.qz-rev li span{color:rgba(255,255,255,.6)}
.qz-rev li.ok span{color:#3DD68C}.qz-rev li.no span{color:#FF7A8E}
.qz-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.qz-acts .btn{background:linear-gradient(90deg,var(--qa),var(--qc));border:0;color:#fff;box-shadow:0 10px 24px -10px rgba(255,138,91,.8)}
.qz-acts .btn.sec{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);box-shadow:none}
@media (max-width:860px){.qz-panel{grid-template-columns:1fr;gap:26px;border-radius:26px}.qz-intro{text-align:center}.qz-intro>p{margin-inline:auto}.qz-facts{justify-content:center}.qz-tag{inset-inline-end:14px}}
/*EM-CSS-START*/
/* إعمار */
.em-wrap{max-width:1400px}
.em-phase{display:flex;align-items:center;gap:16px;background:var(--tile);border-radius:20px;padding:12px 20px;margin-bottom:14px;box-shadow:var(--shadow);border-inline-start:6px solid var(--blue)}
.em-phase.ph-build{border-color:var(--c3)}.em-phase.ph-rescue{border-color:var(--bad)}.em-phase.ph-result,.em-phase.ph-event,.em-phase.ph-spin{border-color:var(--c4)}
.em-phase>div:first-child{display:grid}
.em-phase small{color:var(--muted);font-size:14px}
.em-phase b{font-size:clamp(22px,3vw,32px);line-height:1.2}
.em-clock{font-size:clamp(34px,5vw,56px);font-weight:700;font-variant-numeric:tabular-nums;margin-inline-start:auto;direction:ltr}
.em-clock.low,.em-pclk2.low{color:var(--bad)}
.em-ctl{display:flex;gap:8px;align-items:center}
.em-phase:not(:has(.em-clock)) .em-ctl{margin-inline-start:auto}
.em-lobby{margin-bottom:16px}
.em-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.em-cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.em-city{background:var(--tile);border:0;border-radius:18px;padding:12px;display:grid;gap:8px;text-align:start;border-top:5px solid var(--tc);box-shadow:var(--shadow);color:var(--ink);transition:transform .15s}
.em-city:hover{transform:translateY(-2px)}
.em-ch{display:flex;align-items:center;gap:6px;min-width:0}
.em-ch b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.em-dev{margin-inline-start:auto;display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.em-dev svg{width:14px;height:14px}
.em-res{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.em-res span{display:flex;align-items:center;justify-content:center;gap:3px;background:var(--bg-alt);border-radius:8px;padding:3px 2px;font-variant-numeric:tabular-nums;font-size:14px}
.em-res i{font-style:normal;font-size:13px}
.em-res.big span{font-size:20px;padding:8px 4px;border-radius:12px;background:var(--tile)}
.em-res.big i{font-size:18px}
.em-stats{display:flex;gap:10px;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.em-score{color:var(--tc);font-weight:700;font-size:16px}
.em-st{font-size:13px;border-radius:8px;padding:4px 8px;background:var(--bg-alt)}
.em-st.st-eased{background:color-mix(in srgb,var(--c3) 16%,var(--tile));color:var(--c3)}
.em-st.st-safe,.em-st.st-saved,.em-st.st-good{background:var(--good-soft);color:var(--good)}
.em-st.st-lost{background:var(--bad-soft);color:var(--bad)}
.em-st.st-need{background:color-mix(in srgb,var(--c3) 16%,var(--tile));color:var(--c3)}
.em-side{display:grid;gap:12px;position:sticky;top:60px}
.em-box{background:var(--tile);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;gap:8px}
.em-box h2.h4{margin:0;font-size:15px}
.em-log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.em-log li{border-bottom:1px solid var(--hair);padding-bottom:6px}
.em-log li:last-child{border:0}
.em-rank ol{margin:0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:r}
.em-rank li{display:flex;gap:8px;align-items:center;font-size:14px;counter-increment:r}
.em-rank li::before{content:counter(r);width:20px;height:20px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:12px}
.em-rank li span{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:600}
.em-evp{grid-template-columns:auto minmax(0,420px);justify-content:center;justify-items:start;text-align:start;align-items:center;column-gap:48px;margin-bottom:16px}
.em-evp{grid-template-columns:1fr;justify-items:center;text-align:center}
.em-evtx{display:grid;gap:10px;justify-items:inherit}
.em-evtx h2{margin:0}
.em-need{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.em-need .mini{border-color:var(--tc);color:var(--tc)}
@keyframes emrev{from{opacity:0;transform:translateY(8px)}}
.em-final .em-podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:22px;text-align:start}
.em-fcard{background:var(--tile);border-radius:18px;padding:12px;display:grid;gap:8px;border-top:5px solid var(--tc);box-shadow:var(--shadow)}
.em-fh{display:flex;gap:8px;align-items:center}
.em-fh i{width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}
.em-fh span{margin-inline-start:auto;font-weight:700;color:var(--tc)}
.em-fcard ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:grid;gap:2px}
.em-fcard li{display:flex;justify-content:space-between}
.em-fcard li span{color:var(--ink);font-variant-numeric:tabular-nums}
/* host modal + phone console */
.em-modal{position:fixed;inset:0;z-index:45;background:var(--scrim);display:grid;place-items:center;padding:16px}
.em-modal-in{background:var(--bg);border-radius:24px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;position:relative;box-shadow:0 20px 60px rgba(30,47,77,.3)}
.em-x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg-alt);font-size:16px;z-index:2}
.em-phone .wrap{max-width:560px}
.em-con{display:grid;gap:12px}
.em-ch2{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-inline-end:40px}
.em-phone .em-ch2{padding-inline-end:0}
.em-ch2>div:first-child{display:grid;justify-items:start;gap:2px}
.em-ch2 small{color:var(--muted);font-size:13px}
.em-ch2 b{font-size:24px;color:var(--tc);line-height:1.2}
.em-ph{display:grid;justify-items:end;text-align:end}
.em-pclk{font-size:30px;font-variant-numeric:tabular-nums;direction:ltr}
.em-con .em-res.big span{box-shadow:var(--shadow)}
.em-tabs{display:flex}
.em-tabs button{flex:1}
.em-dot{font-style:normal;background:var(--bad);color:#fff;border-radius:980px;padding:0 6px;font-size:12px}
.em-card{background:var(--tile);border-radius:18px;padding:16px;display:grid;gap:8px;box-shadow:var(--shadow)}
.em-card.hot{box-shadow:inset 0 0 0 2px var(--tc),var(--shadow);text-align:center;justify-items:center}
.em-card.bad{box-shadow:inset 0 0 0 2px var(--bad);text-align:center;justify-items:center}
.em-card h2,.em-card h3,.em-card p{margin:0}
.em-card h2{font-size:26px}
.em-small{font-size:14px;color:var(--muted);margin:0}
.em-chs{display:grid;gap:10px}
.em-chb{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:start;border:0;background:var(--tile);border-radius:18px;padding:14px;box-shadow:var(--shadow);color:var(--ink)}
.em-chb i{grid-row:1/3;font-style:normal;font-size:34px;width:56px;height:56px;border-radius:16px;background:var(--bg-alt);display:grid;place-items:center}
.em-chb b{font-size:18px}
.em-chb small{grid-column:2;color:var(--muted);font-size:13px}
.em-chb span{grid-row:1/3;grid-column:3;font-size:13px;color:var(--tc);font-weight:600}
.em-chb:active{transform:scale(.98)}
.em-pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.em-bb{display:grid;grid-template-columns:auto 1fr;column-gap:8px;text-align:start;border:0;background:var(--tile);border-radius:14px;padding:10px;box-shadow:var(--shadow);color:var(--ink)}
.em-bb i{grid-row:1/4;font-style:normal;font-size:26px}
.em-bb b{font-size:15px}
.em-bb span{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.em-bb small{font-size:11.5px;color:var(--muted);line-height:1.35}
.em-bb.sel{box-shadow:inset 0 0 0 2.5px var(--tc),var(--shadow)}
.em-bb.no{opacity:.5}
.em-c{white-space:nowrap}
.em-ofh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.em-ofh span{font-size:13px;color:var(--muted)}
.em-ofb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.em-ofb .btn{font-size:15px;padding:7px 18px;min-height:36px}
.em-pickb{display:grid;gap:2px}
.em-pickb small{font-size:14px;opacity:.9}
.em-toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:980px;font-size:15px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.em-toast.on{opacity:1;transform:translate(-50%,0)}
/* challenge overlay */
.em-play{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(12px,env(safe-area-inset-top)) 16px 24px}
.em-play-in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.em-pt{display:flex;align-items:center;gap:10px;position:relative;padding-inline-end:44px}
.em-pt>div{display:grid;flex:1}
.em-pt small{color:var(--muted);font-size:13px}
.em-pt b{font-size:15px;font-weight:500;line-height:1.4}
.em-pt .em-x{top:0}
.em-pclk2{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.em-play.won .em-pb{opacity:.6;pointer-events:none}
.em-play.lost .em-pb{opacity:.4;pointer-events:none}
.em-done{border-radius:18px;padding:16px;display:grid;gap:8px;justify-items:center;text-align:center;animation:emrev .3s both}
.em-done.ok{background:var(--good-soft)}.em-done.no{background:var(--bad-soft)}
.em-done b{font-size:24px}.em-done.ok b{color:var(--good)}.em-done.no b{color:var(--bad)}
.em-pipes{position:relative;padding-inline:34px;direction:ltr}
.em-pg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;background:var(--bg-alt);border-radius:14px;padding:6px}
.em-pg button{aspect-ratio:1;border:0;border-radius:8px;background:var(--tile);padding:0;touch-action:manipulation}
.em-pg svg{width:100%;height:100%;display:block;transition:transform .12s}
.em-pg path{stroke:#9AA7BD;stroke-width:22;fill:none;stroke-linecap:round}
.em-pg circle{fill:#9AA7BD}
.em-pg .wet path{stroke:#1E90E8}.em-pg .wet circle{fill:#1E90E8}
.em-src,.em-dst{position:absolute;font-size:24px;top:calc(6px + (100% - 12px) / var(--n) * (var(--r) + .5));transform:translateY(-50%)}
.em-src{left:0}.em-dst{right:0}
.em-lamps{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;max-width:420px;margin:0 auto;width:100%}
.em-lamps button{aspect-ratio:1;border:0;border-radius:16px;background:#3A5078;font-size:clamp(22px,7vw,40px);touch-action:manipulation;transition:.15s}
.em-lamps button span{display:block;filter:grayscale(1);opacity:.4}
.em-lamps button.on{background:#FFE58A;box-shadow:0 0 24px rgba(255,214,0,.55)}
.em-lamps button.on span{filter:none;opacity:1}
.em-mk{display:grid;gap:12px;text-align:center}
.em-mk h3{margin:0;font-size:22px;line-height:1.5}
.em-mk small{color:var(--muted)}
.em-mko{display:grid;gap:8px}
.em-mko .btn{font-size:19px;background:var(--tile);color:var(--ink);box-shadow:var(--shadow)}
.em-mko .btn.ok{background:var(--good);color:#fff}.em-mko .btn.no{background:var(--bad);color:#fff}
.em-tl{display:grid;gap:12px;justify-items:center}
.em-tb{display:grid;grid-template-columns:repeat(var(--w),1fr);gap:3px;width:min(100%,calc(64px * var(--w)));direction:ltr;background:var(--bg-alt);padding:6px;border-radius:14px}
.em-tb button{aspect-ratio:1;border:1.5px dashed var(--hair);border-radius:8px;background:var(--tile);padding:0}
.em-tb button[style*="background"]{border-style:solid;border-color:transparent}
.em-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.em-tray button{border:0;background:var(--tile);border-radius:14px;padding:10px;box-shadow:var(--shadow);font-size:28px;min-width:56px;min-height:56px;display:grid;place-items:center}
.em-tray button.sel{box-shadow:inset 0 0 0 3px var(--blue),var(--shadow)}
.em-pc{display:grid;grid-template-columns:repeat(var(--w),18px);grid-template-rows:repeat(var(--h),18px);gap:2px;direction:ltr}
.em-pc i{border-radius:4px}
.em-mem{display:grid;gap:12px;justify-items:center}
.em-mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,340px);direction:ltr}
.em-mg button{aspect-ratio:1;border:0;border-radius:12px;background:color-mix(in srgb,var(--c2) 12%,var(--tile));font-size:clamp(24px,8vw,36px);padding:0}
@media (max-width:960px){.em-body{grid-template-columns:1fr}.em-side{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:560px){.em-evp{grid-template-columns:1fr;justify-items:center;text-align:center}.em-pal{grid-template-columns:1fr}.em-phase{flex-wrap:wrap}}
/* إعمار: the 3D (isometric) city — CSS transforms only, no library */
.em-iso{--gd:#9FCF8B;--gs:#6E9E5E;--tl:#B9DDA6;container-type:inline-size;width:100%;aspect-ratio:1.3;display:grid;place-items:center;position:relative;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,#BFE3F5 55%,var(--tile)),var(--tile) 75%);overflow:hidden}
.em-iso.g-sand{--gd:#E9CF97;--gs:#BF9F62;--tl:#F2DEAF}
.em-iso.g-rock{--gd:#B9C4A2;--gs:#879272;--tl:#CBD5B6}
.em-iso.g-palm{--gd:#A9D49A;--gs:#77A468;--tl:#C3E3B6}
.em-map{width:66cqw;aspect-ratio:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:.7cqw;padding:1.4cqw;direction:ltr;background:var(--gd);border-radius:2.4cqw;transform:translateY(7cqw) rotateX(56deg) rotateZ(45deg);transform-style:preserve-3d;box-shadow:.9cqw .9cqw 0 var(--gs),1.6cqw 1.6cqw 2.4cqw rgba(30,47,77,.22)}
.em-cell{position:relative;border:0;padding:0;margin:0;min-width:0;min-height:0;width:100%;height:100%;border-radius:.9cqw;background:var(--tl);transform-style:preserve-3d;font:inherit;color:inherit;box-shadow:inset 0 0 0 .15cqw rgba(255,255,255,.35);transform:translateZ(.15cqw)}
.em-cell.blk{background:transparent;box-shadow:none}
.em-cell.k-water{background:#6FB9DB;border-radius:0;box-shadow:none}
.em-wv{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 1.2cqw,rgba(255,255,255,.35) 1.2cqw 1.5cqw);animation:emwave 3s linear infinite}
@keyframes emwave{to{background-position:6cqw 0}}
button.em-cell{cursor:pointer}
button.em-cell:not(.on):hover,button.em-cell:not(.on):focus-visible{background:color-mix(in srgb,var(--tc,var(--blue)) 30%,var(--tl));outline:0}
.em-bx{--hh:calc(var(--h) * 1.5cqw);position:absolute;inset:13%;transform-style:preserve-3d;pointer-events:none}
.em-bx b{position:absolute;display:block}
.em-bx .t{inset:0;background:var(--rc);border-radius:.4cqw;transform:translateZ(var(--hh))}
.em-bx .s1{left:0;top:100%;width:100%;height:var(--hh);background:color-mix(in srgb,var(--rc) 78%,#2a2a2a);transform-origin:top;transform:rotateX(90deg)}
.em-bx .s2{left:100%;top:0;width:var(--hh);height:100%;background:color-mix(in srgb,var(--rc) 62%,#2a2a2a);transform-origin:left;transform:rotateY(-90deg)}
.em-bx i,.em-ghost i,.em-bn{position:absolute;left:50%;top:50%;font-style:normal;line-height:1;white-space:nowrap;transform:translate(-50%,-50%) translateZ(var(--hh,0px)) rotateZ(-45deg) rotateX(-56deg) translateY(-55%)}
.em-bx i,.em-ghost i{font-size:8.5cqw;filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.18))}
.em-bx.k-sand,.em-bx.k-palm{--rc:transparent}.em-bx.k-sand b,.em-bx.k-palm b{display:none}
.em-bx.k-rock{--rc:#9AA08F}
.em-bn{font-size:3.2cqw;font-weight:700;color:#fff;background:var(--good);border-radius:980px;padding:.3cqw .9cqw;transform:translate(-50%,-50%) translateZ(calc(var(--hh) + 1cqw)) rotateZ(-45deg) rotateX(-56deg) translate(60%,-190%)}
.em-ghost{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.em-ghost i{opacity:.5;animation:empulse 1.2s infinite}
@keyframes empulse{50%{opacity:.9}}
.em-bx.new{animation:emrise .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes emrise{from{transform:scale3d(.4,.4,.01);opacity:0}}
.em-bn{z-index:2}
/* the forecast and the arriving event */
.em-fc{display:flex;gap:16px;align-items:center;background:var(--tile);border-radius:20px;padding:14px 20px;margin-bottom:14px;box-shadow:var(--shadow);border-inline-start:6px solid var(--c4)}
.em-fc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--tile))}
.em-fc.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--tile))}
.em-fci{font-size:clamp(40px,5vw,64px);line-height:1}
.em-fc>div{display:grid;gap:2px}
.em-fc small{color:var(--muted);font-size:14px}
.em-fc b{font-size:clamp(22px,2.8vw,32px);line-height:1.2}
.em-fc p{margin:0;font-size:clamp(15px,1.6vw,19px)}
.em-fc.em-hint{position:relative;overflow:hidden;border-color:var(--c4);background:color-mix(in srgb,var(--c4) 10%,var(--tile));animation:embump .6s cubic-bezier(.3,1.5,.5,1) both}
.em-fc.em-hint .em-hq{font-size:clamp(24px,3.2vw,40px)}
.em-hbar{position:absolute;inset-inline:0;bottom:0;height:6px;background:var(--c4);transform-origin:right;animation:emhbar linear forwards}
@keyframes emhbar{to{transform:scaleX(0)}}
.em-fc.sm{margin:0;padding:12px 14px;gap:12px}.em-fc.sm .em-fci{font-size:40px}.em-fc.sm b{font-size:20px}.em-fc.sm p{font-size:14px}
.em-arrive{grid-template-columns:auto minmax(0,460px);justify-content:center;align-items:center;column-gap:28px;text-align:start;justify-items:start}
.em-big{font-size:clamp(70px,10vw,120px);line-height:1;animation:embump 1s cubic-bezier(.3,1.6,.5,1) both}
.em-arrive.bad .em-big{animation:embump 1s cubic-bezier(.3,1.6,.5,1) both,emshake .5s .9s 2}
@keyframes embump{from{transform:scale(.2);opacity:0}}
@keyframes emshake{25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.em-lh{margin:18px 0 8px;font-size:18px}
.em-fcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;margin-bottom:8px}
.em-fcr{display:grid;grid-template-columns:auto 1fr;column-gap:10px;border-radius:12px;padding:10px 12px;align-items:center}
.em-fcr.bad{background:color-mix(in srgb,var(--bad) 9%,var(--tile))}.em-fcr.good{background:color-mix(in srgb,var(--good) 9%,var(--tile))}
.em-fcr i{grid-row:1/4;font-style:normal;font-size:30px}
.em-fcr b{font-size:16px}.em-fcr span{font-size:14px}.em-fcr small{font-size:12.5px;color:var(--muted)}
.em-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;margin-top:10px}
.em-legend span{display:grid;grid-template-columns:auto 1fr;column-gap:8px;background:var(--bg-alt);border-radius:12px;padding:8px 10px}
.em-legend i{grid-row:1/4;font-style:normal;font-size:26px;align-self:center}
.em-legend small{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.em-keys{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.em-keys li{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.em-keys i{font-style:normal;font-size:18px}
.em-keys span{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.em-keys small{color:var(--muted);white-space:nowrap}
.em-bb.hot{box-shadow:inset 0 0 0 2.5px var(--bad),var(--shadow)}
.em-bb.hot::after{content:"تحمي من الأزمة الجاية";grid-column:1/-1;font-size:11.5px;color:var(--bad);font-weight:600}
.em-ch .em-score{margin-inline-start:6px}
.em-pj{display:grid;gap:4px}
.em-pj>div:first-child{display:flex;justify-content:space-between;font-size:14px}
.em-pj>div:first-child span{color:var(--muted);font-variant-numeric:tabular-nums}
.em-pj>i{height:6px;border-radius:3px;background:var(--bg-alt);position:relative;overflow:hidden}
.em-pj>i::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);background:var(--blue);border-radius:3px}
.em-pj.done>i::after{background:var(--good)}
.em-pjm{display:flex;flex-wrap:wrap;gap:4px}
.em-pjm span{font-size:12px;border-radius:980px;padding:1px 8px;background:color-mix(in srgb,var(--tc) 16%,var(--tile));color:var(--tc);font-weight:600}
.em-pjm small{color:var(--muted);font-size:12px}
.em-offers{display:grid;gap:8px}
.em-of{background:var(--tile);border-radius:14px;padding:12px;border-inline-start:5px solid var(--tc);display:grid;gap:6px;box-shadow:var(--shadow)}
.em-of p{margin:0;font-size:15px}
.em-of.st-ok{opacity:.8}.em-of.st-no,.em-of.st-x{opacity:.55}
.em-tos{display:flex;flex-wrap:wrap;gap:6px}
.em-tos button{border:1.5px solid var(--hair);background:var(--tile);border-radius:980px;padding:6px 12px;font-size:14px}
.em-tos button.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--tile));color:var(--tc);font-weight:600}
.em-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.em-two h2.h4{margin:0 0 6px;font-size:14px}
.em-two1{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.em-amt{display:flex;align-items:center;gap:4px;background:var(--bg-alt);border-radius:10px;padding:4px;margin-bottom:4px}
.em-amt i{font-style:normal;width:24px;text-align:center}
.em-amt b{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.em-amt button{width:32px;height:32px;border-radius:50%;border:0;background:var(--tile);font-size:18px}
.em-pjs{display:grid;gap:10px}
.em-pjc.done{box-shadow:inset 0 0 0 2px var(--good),var(--shadow)}
.em-need2{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;font-variant-numeric:tabular-nums}
.em-lands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.em-land{border:0;background:var(--tile);border-radius:16px;padding:6px 6px 10px;display:grid;gap:4px;box-shadow:var(--shadow);color:var(--ink)}
.em-land b{font-size:15px}
.em-land.sel{box-shadow:inset 0 0 0 3px var(--tc),var(--shadow)}
/*EM-CSS-END*/
/*DISP-CSS-START*/
/* display orientation: host screen and players' devices (html[data-orient][data-orole]) */
.ori{display:inline-block;flex:none;border:2px solid currentColor;border-radius:3px;opacity:.75}
.ori.land{width:18px;height:12px}.ori.port{width:12px;height:18px}
.disp-box .seg button{gap:8px}
.disp-box .sj-sub{margin-top:8px}
/* host, portrait: one column */
html[data-orole=host][data-orient=port] .b4-main{grid-template-columns:1fr}
html[data-orole=host][data-orient=port] .b4-board{width:100%}
html[data-orole=host][data-orient=port] .b4-teams{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-orole=host][data-orient=port] .sj-board{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-orole=host][data-orient=port] .tk-teams{grid-template-columns:repeat(min(var(--n),3),minmax(0,1fr))}
html[data-orole=host][data-orient=port] .tk-lobby{grid-template-columns:1fr;justify-items:center;text-align:center}
html[data-orole=host][data-orient=port] .tk-link{justify-content:center}
html[data-orole=host][data-orient=port] .em-body{grid-template-columns:1fr}
html[data-orole=host][data-orient=port] .em-side{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
html[data-orole=host][data-orient=port] .em-cities{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-orole=host][data-orient=port] .em-evp{grid-template-columns:1fr;justify-items:center;text-align:center}
html[data-orole=host][data-orient=port] .er-board{grid-template-columns:1fr}
html[data-orole=host][data-orient=port] .er-teams{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-orole=host][data-orient=port] .ss-slide{width:900px;height:1600px}
html[data-orole=host][data-orient=port] .ss-cards{grid-template-columns:1fr}
html[data-orole=host][data-orient=port] .ss-cards[style*="--n:4"]{grid-template-columns:1fr 1fr}
html[data-orole=host][data-orient=port] .ss-top{flex-wrap:wrap}
/* host, portrait chosen but the screen is landscape: a centred portrait column */
html[data-orole=host][data-orient=port][data-omis] body{background:var(--bg-alt)}
html[data-orole=host][data-orient=port][data-omis] #app{max-width:max(420px,calc(100vh * .6));margin-inline:auto;background:var(--bg);box-shadow:0 0 0 1px var(--hair)}
/* host, landscape chosen on a tall screen that is still wide enough: keep the side-by-side layouts */
@media (orientation:portrait) and (min-width:700px){
  html[data-orole=host][data-orient=land] .b4-main{grid-template-columns:minmax(0,1fr) minmax(220px,280px)}
  html[data-orole=host][data-orient=land] .b4-board{width:100%}
  html[data-orole=host][data-orient=land] .b4-teams{grid-template-columns:1fr}
  html[data-orole=host][data-orient=land] .em-body{grid-template-columns:minmax(0,1fr) 260px}
  html[data-orole=host][data-orient=land] .em-side{position:sticky;grid-template-columns:1fr}
  html[data-orole=host][data-orient=land] .tk-lobby{grid-template-columns:auto 1fr;justify-items:start;text-align:start}
  html[data-orole=host][data-orient=land] .sj-board{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
/* players, landscape: two columns on the phone (only while the phone is really turned) */
@media (orientation:landscape){
  html[data-orole=player][data-orient=land] .tk-me{max-width:920px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  html[data-orole=player][data-orient=land] .tk-me>.tk-me-head,html[data-orole=player][data-orient=land] .tk-me>.tk-me-foot,html[data-orole=player][data-orient=land] .tk-me>.ss-warn{grid-column:1/-1}
  html[data-orole=player][data-orient=land] .tk-me-card{height:100%;align-content:center}
  html[data-orole=player][data-orient=land] .tk-big b{font-size:min(30vh,140px)}
  html[data-orole=player][data-orient=land] .em-phone .wrap{max-width:1000px}
  html[data-orole=player][data-orient=land] .em-con{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  html[data-orole=player][data-orient=land] .em-con>*{grid-column:1/-1}
  html[data-orole=player][data-orient=land] .em-con>.em-res{grid-column:1}
  html[data-orole=player][data-orient=land] .em-con>.em-stats{grid-column:2;align-self:center}
  html[data-orole=player][data-orient=land] .em-con>.em-iso{grid-column:1;max-width:440px;width:100%;justify-self:center}
  html[data-orole=player][data-orient=land] .em-con>.em-iso+.em-pal{grid-column:2}
  html[data-orole=player][data-orient=land] .em-con>.em-pal{grid-template-columns:repeat(2,minmax(0,1fr))}
  html[data-orole=player][data-orient=land] .em-chs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  html[data-orole=player][data-orient=land] .em-play-in{max-width:980px}
}
/* rotate hint */
.ori-hint{position:fixed;z-index:300;font-family:var(--f)}
.ori-hint.full{inset:0;background:rgba(20,33,58,.94);color:#fff;display:grid;place-items:center;padding:24px;text-align:center}
.ori-hint.full .ori-card{display:grid;gap:12px;justify-items:center;max-width:380px}
.ori-hint.full b{font-size:24px;line-height:1.3}
.ori-hint.full p{margin:0;color:#DFE1E5;font-size:15px}
.ori-hint .ori-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.ori-hint.full .mini{background:rgba(255,255,255,.14);color:#fff}
.ori-dev{width:54px;height:88px;border:4px solid #fff;border-radius:12px;position:relative;margin-bottom:8px;animation:oriTurn 2.4s ease-in-out infinite}
.ori-dev::after{content:"";position:absolute;bottom:6px;left:50%;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#fff}
.ori-dev.to-port{transform:rotate(-90deg);animation-name:oriTurnB}
@keyframes oriTurn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@keyframes oriTurnB{0%,25%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}
.ori-hint.bar{bottom:16px;inset-inline:16px;margin-inline:auto;max-width:560px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(30,47,77,.25)}
.ori-hint.bar .ori-card{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.ori-hint.bar .ori-dev{width:20px;height:32px;border-width:2px;border-radius:5px;margin:0;border-color:currentColor}
.ori-hint.bar .ori-dev::after{display:none}
.ori-hint.bar p{margin:0;font-size:14px;line-height:1.45}
.ori-hint.bar b{display:none}
.ori-hint.bar .ori-btns{margin:0}
.ori-hint.bar .ori-btns .btn{display:none}
.ori-hint.bar .mini{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.ori-dev{animation:none}}
/*DISP-CSS-END*/
/*MF-CSS-START*/
/* حقل الألغام */
.mf-pts{grid-template-columns:repeat(4,minmax(0,1fr))}
.mf-pts .bad b{color:var(--bad)}
.mf-tools{grid-template-columns:repeat(3,minmax(0,1fr))}
.mf-hand{display:grid;gap:22px;justify-items:center;padding-top:18px}
.mf-steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mf-steps span{background:var(--tile);border-radius:980px;padding:4px 12px;font-size:14px;color:var(--muted);border-inline-start:4px solid var(--tc)}
.mf-steps span.now{color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 2px var(--tc)}
.mf-steps span.done{color:var(--good)}
.mf-handcard{background:var(--tile);border-radius:28px;padding:clamp(28px,6vw,56px) clamp(20px,5vw,56px);display:grid;gap:12px;justify-items:center;text-align:center;max-width:640px;width:100%;box-shadow:var(--shadow);border-top:8px solid var(--tc,var(--blue))}
.mf-handcard.ready{--tc:var(--good)}
.mf-handcard h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.1;color:var(--tc)}
.mf-handcard small{color:var(--muted);font-size:15px}
.mf-handcard p{margin:0 0 8px;font-size:clamp(17px,2.4vw,21px);line-height:1.6}
.mf-hand-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--blue)) 14%,var(--tile));color:var(--tc,var(--blue))}
.mf-hand-ic .mf-mine{width:52px;height:52px}
.mf-foot{display:flex;justify-content:center}
.mf-count{font-size:18px;font-weight:600;color:var(--tc)}
.mf-count small{color:var(--muted);font-weight:400;font-size:14px}
.mf-count.ok{color:var(--good)}
.mf-tip{text-align:center;color:var(--muted);margin:10px 0 14px;font-size:15px}
.mf-actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}
.mf-center{display:grid;justify-items:center;min-width:0}
.mf-board{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:clamp(5px,1vw,10px);width:min(100%,calc((100vh - 250px) * var(--c) / var(--r)));min-width:min(100%,300px)}
.mf-cell{aspect-ratio:1;border:0;border-radius:clamp(8px,1.4vw,16px);background:var(--blue);color:var(--on-blue);display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums;padding:0;overflow:hidden;
  box-shadow:inset 0 -4px 0 color-mix(in srgb,#14213A 22%,transparent);transition:transform .15s,filter .15s}
button.mf-cell{cursor:pointer}
button.mf-cell:hover:not([disabled]){filter:brightness(1.1);transform:translateY(-2px)}
.mf-n{font-size:clamp(14px,2.4vw,26px);font-weight:700;opacity:.9}
.mf-mine{width:58%;height:58%}
.mf-planting .mf-cell{background:var(--tile);color:var(--muted);box-shadow:inset 0 0 0 2px var(--hair)}
.mf-planting .mf-cell.planted{background:color-mix(in srgb,var(--tc) 16%,var(--tile));color:var(--tc);box-shadow:inset 0 0 0 3px var(--tc);animation:mfPop .25s ease-out}
.mf-cell.open{background:var(--tile);color:var(--ink);box-shadow:inset 0 0 0 2px var(--hair)}
.mf-cell.open b{font-size:clamp(20px,3.6vw,40px);font-weight:800}
.mf-cell.open .mf-by{position:absolute;bottom:6px;inset-inline-start:6px;width:9px;height:9px;border-radius:50%;background:var(--tc)}
.mf-cell.n1 b{color:var(--c1)}.mf-cell.n2 b{color:var(--c2)}.mf-cell.n3 b{color:var(--c5)}.mf-cell.n4 b{color:var(--c4)}.mf-cell.n5 b,.mf-cell.n6 b,.mf-cell.n7 b,.mf-cell.n8 b{color:var(--c3)}
.mf-cell.boom{background:radial-gradient(circle at 50% 50%,#FFB340 0 22%,#FF6B3D 45%,#D30F45 100%);color:#26323E}
.mf-cell.boom.fresh{animation:mfShake .5s ease-out}
.mf-cell.hidden-mine{background:color-mix(in srgb,var(--bad) 14%,var(--tile));color:var(--bad);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 40%,transparent)}
.mf-cell.shut{background:color-mix(in srgb,var(--blue) 22%,var(--tile));color:var(--muted)}
.mf-dots{position:absolute;bottom:5px;inset-inline:0;display:flex;justify-content:center;gap:3px}
.mf-dots i{width:10px;height:10px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 2px #fff}
.mf-cell.det-mine{background:color-mix(in srgb,var(--bad) 70%,var(--blue))}
.mf-cell.det-safe{background:color-mix(in srgb,var(--good) 60%,var(--blue))}
.mf-flag{position:absolute;top:4px;inset-inline-end:7px;font-size:clamp(12px,1.8vw,18px);font-weight:700}
.mf-center.detecting button.mf-cell{outline:3px dashed color-mix(in srgb,var(--c3) 70%,transparent);outline-offset:-5px}
.mf-tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mf-tbar .mini.on{background:var(--c3);color:#fff;border-color:var(--c3)}
.mf-tbar .mini[disabled]{opacity:.45}
.mf-clock,.mf-qt{background:var(--tile);border-radius:980px;padding:5px 14px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--shadow);min-width:64px;text-align:center}
.mf-clock.out,.mf-qt.low{color:var(--bad)}
.mf-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,280px);gap:18px;margin-top:16px;align-items:start}
.mf-teams{display:grid;gap:10px}
.mf-team{background:var(--tile);border-radius:16px;padding:10px 14px;display:grid;border-inline-start:6px solid var(--tc);box-shadow:var(--shadow)}
.mf-team.now{box-shadow:inset 0 0 0 2px var(--tc),var(--shadow)}
.mf-team small{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-team b{font-size:clamp(24px,3vw,32px);font-weight:700;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1.2}
.mf-tl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mf-tl .mf-mine{width:14px;height:14px}
.mf-tl span{background:var(--bg-alt);border-radius:980px;padding:1px 8px;color:var(--ink)}
.mf-tl span.used{opacity:.45;text-decoration:line-through}
.mf-qwrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;margin-top:16px;align-items:start}
.mf-mini .mf-board{width:100%;min-width:0;gap:4px}
.mf-mini .mf-cell{border-radius:6px;box-shadow:none}
.mf-mini .mf-n{font-size:11px}
.mf-mini .mf-cell.open b{font-size:14px}
.mf-mini .mf-dots i{width:6px;height:6px;box-shadow:none}
.mf-mini .mf-cell.sel{background:var(--c3);outline:3px solid var(--c3);outline-offset:2px;animation:mfPulse 1.2s ease-in-out infinite}
.mf-mini button.mf-cell[disabled]{cursor:default;opacity:1}
.mf-judge{display:flex;gap:10px;flex-wrap:wrap}
.count.ok{color:var(--good);font-weight:700;font-size:20px}
.count.no{color:var(--bad);font-weight:700;font-size:20px}
.mf-pop{position:fixed;inset:0;z-index:200;background:var(--scrim);display:grid;place-items:center;padding:20px;animation:mfFade .2s ease-out}
.mf-popcard{background:var(--tile);border-radius:28px;padding:clamp(26px,5vw,48px);max-width:560px;width:100%;display:grid;gap:10px;justify-items:center;text-align:center;box-shadow:0 20px 60px rgba(20,33,58,.35);animation:mfPop .35s cubic-bezier(.2,1.4,.4,1)}
.mf-popcard h2{margin:0;font-size:clamp(30px,5vw,46px);font-weight:800}
.mf-popcard p{margin:0;font-size:clamp(17px,2.4vw,21px);line-height:1.55}
.mf-popcard .btn{margin-top:10px}
.mf-popcard.safe h2{color:var(--good)}
.mf-popcard.boom h2{color:var(--bad)}
.mf-popcard.wrong h2{color:var(--muted)}
.mf-popcard.det.mine h2{color:var(--c3)}
.mf-popcard.det.safe h2{color:var(--good)}
.mf-delta{font-size:clamp(18px,2.6vw,24px)!important;font-weight:600}
.mf-delta .bad{color:var(--bad)}
.mf-big{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:62px;font-weight:800;background:var(--bg-alt)}
.mf-big.x{color:var(--muted)}
.mf-big.n1{color:var(--c1)}.mf-big.n2{color:var(--c2)}.mf-big.n3{color:var(--c5)}.mf-big.n4{color:var(--c4)}.mf-big.n0{color:var(--muted)}
.mf-popcard.det .mf-big{color:inherit}
.mf-popcard.det.mine .mf-big{color:var(--c3)}.mf-popcard.det.safe .mf-big{color:var(--good)}
.mf-burst{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;color:#26323E;
  background:radial-gradient(circle,#FFE08A 0 18%,#FFB340 32%,#FF6B3D 55%,#D30F45 72%,transparent 74%);animation:mfBurst .7s cubic-bezier(.2,1.6,.4,1)}
.mf-burst .mf-mine{width:64px;height:64px}
.mf-done .mf-rh{font-size:26px;margin:40px 0 4px}
.mf-rsub{font-size:15px!important;margin-bottom:16px!important}
.mf-reveal .mf-board{width:min(100%,560px)}
.mf-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:15px}
.mf-legend span{display:inline-flex;align-items:center;gap:6px}
.mf-legend i{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.mf-bonus{font-style:normal;font-size:13px;background:color-mix(in srgb,var(--c3) 15%,transparent);color:var(--c3);border-radius:980px;padding:2px 10px;font-weight:600;white-space:nowrap}
@keyframes mfPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes mfFade{from{opacity:0}to{opacity:1}}
@keyframes mfBurst{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.tn-hero .tn-fl i:nth-child(8n+4){background:#D07362}
.tn-hero .tn-fl i:nth-child(8n+5){background:#83779F}

@media (max-width:620px){.tn-hero{padding-block:56px 40px!important}.tn-hero .intro-pts{display:grid}.tn-hero .intro-pts>span+span{border-inline-start:0;border-top:1px solid rgba(255,255,255,.1)}}
/* encyclopedia tile: green tint, gold link */
.ency{border-radius:20px}

.tn-steps li::after{background:linear-gradient(90deg,#0B7D65,#D1B871,#509CB5,#D07362)!important}

.tn-cards .c-shot{background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,#0B7D65 14%,transparent),transparent 60%),linear-gradient(160deg,#F1F5F3,#ECEFF3)}
.tn-cards .c-views>span{color:var(--ink)}
.tn-cards .feat .c-badge{color:#6B5520;background:color-mix(in srgb,#D1B871 30%,transparent)}
.contest .go{border-radius:999px}
/* plans: gold badge on the featured plan */
.tn-plan .badge,.tn-plans .badge{background:#D1B871!important;color:#26323E!important}
/* buttons: pill shapes like the reference */
.btn{border-radius:999px}
/* footer: dark slate */
footer{background:#26323E;color:rgba(248,248,250,.7);border-top:0}
.band-sub a{color:var(--blue-link);font-weight:600}
@media (max-width:620px){.tn-hero .tn-fl i{opacity:.45}}
footer a,footer .flink{color:#D1B871}

/* hero: shapes of our own, each carrying a letter */
.tn-hero .tn-fl i{opacity:1;border-radius:0;clip-path:none}
.tn-hero .tn-fl i>b{color:#fff!important;font-weight:700}
.tn-hero .tn-fl i:nth-child(4n+1){clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);border-radius:0}
.tn-hero .tn-fl i:nth-child(4n+2){border-radius:50% 50% 50% 12%;clip-path:none}
.tn-hero .tn-fl i:nth-child(4n+3){border-radius:50% 50% 12% 12%/58% 58% 12% 12%;clip-path:none}
.tn-hero .tn-fl i:nth-child(4n){clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);border-radius:0;--r:0deg}

.tn-hero .tn-fl i:nth-child(7n+2){background:var(--id-sand)}

.tn-hero .tn-fl i:nth-child(7n+3){background:var(--id-sky)}
.tn-hero .tn-fl i:nth-child(7n+4){background:var(--id-rose)}
.tn-hero .tn-fl i:nth-child(7n+5){background:var(--id-vio)}
.tn-hero .tn-fl i:nth-child(7n+6){background:var(--id-saf)}
.tn-hero .tn-fl i:nth-child(7n){background:var(--id-mint)}

/* step cards: a big faint letter instead of the corner diamond */
.tn-steps li::before{content:"ت";transform:none;background:none;border-radius:0;width:auto;height:auto;inset-inline-end:14px;bottom:-34px;font-size:150px;font-weight:700;line-height:1;color:rgba(255,255,255,.06)}
.tn-steps li:nth-child(2)::before{content:"ن"}
.tn-steps li:nth-child(3)::before{content:"س"}
/* each contest has its own tinted page */
body[data-ct]{--ctbg:color-mix(in srgb,var(--ct) 15%,var(--bg));background:
  radial-gradient(60% 45% at 100% 0%,color-mix(in srgb,var(--ct) 30%,transparent),transparent 70%),
  radial-gradient(55% 40% at 0% 100%,color-mix(in srgb,var(--ct) 24%,transparent),transparent 70%),
  radial-gradient(color-mix(in srgb,var(--ct) 32%,transparent) 1px,transparent 1.5px) 0 0/24px 24px,var(--ctbg);background-attachment:fixed}
body[data-ct="enc"]{--ct:var(--id-em)}
body[data-ct="sj"]{--ct:var(--id-sky)}
body[data-ct="b4"]{--ct:var(--id-sand)}
body[data-ct="ss"]{--ct:var(--id-vio)}
body[data-ct="mf"]{--ct:var(--id-rose)}
body[data-ct="tk"]{--ct:var(--id-saf)}
body[data-ct="em"]{--ct:var(--id-mint)}
body[data-ct="er"]{--ct:#509CB5}
body[data-ct] .eyebrow{color:color-mix(in srgb,var(--ct) 62%,var(--ink))!important}

/* home counters */
.intro-pts .tn-cnt b{font-variant-numeric:tabular-nums}

.tn-rep{margin-top:34px}

.tn-rep-tot span{background:var(--tile);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow);display:grid}
.tn-rep-tot b{font-size:26px;color:var(--blue)}.tn-rep-tot small{color:var(--muted)}
.tn-rep-sc{overflow-x:auto;background:var(--tile);border-radius:18px;box-shadow:var(--shadow)}

.tn-rep th,.tn-rep td{padding:12px 14px;text-align:center;border-bottom:1px solid var(--hair);white-space:nowrap}

.tn-rep th:first-child,.tn-rep td:first-child{text-align:start}
.tn-rep td b{display:block}.tn-rep td small{color:var(--muted);font-size:12px}

.tn-rep tr:last-child td{border-bottom:0}

.ord-bar{position:sticky;bottom:12px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#26323E;color:#F8F8FA;border-radius:18px;padding:14px 20px;box-shadow:0 14px 34px -14px rgba(38,50,62,.6);margin:8px 0 14px}
.ord-price{font-size:28px;font-weight:800;color:#D1B871}.ord-price small{font-size:13px;font-weight:500;color:rgba(248,248,250,.7)}
.ord-acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.ord-form{display:grid;gap:14px;max-width:720px}
.ord-form label>span,.ord-logo>span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.ord-form input,.ord-form textarea{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--bg);color:var(--ink)}
.ord-form .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.ord-form .g2{grid-template-columns:1fr}}
.ord-logo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ord-logo>span{width:100%}
.ord-done{max-width:640px;text-align:center}
.ord-done .ord-steps{justify-content:center}
.ord-wa{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;background:#25A35A;color:#fff;margin:10px auto 6px;box-shadow:0 16px 34px -12px rgba(37,163,90,.6)}
.ord-wa svg{width:52px;height:52px}
.ord-sum{color:var(--muted)}
.inb-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.inb-card{background:var(--tile);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-inline-start:4px solid var(--blue)}
.inb-card.st-done,.inb-card.st-cancelled{opacity:.65;border-inline-start-color:var(--hair)}
.inb-card.st-contacted{border-inline-start-color:#D1B871}
.inb-top{display:flex;align-items:center;gap:10px}
.inb-top img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff}
.inb-top>div{flex:1;min-width:0}.inb-top b{display:block}.inb-top small{color:var(--muted);font-size:12px}
.inb-top select{font:inherit;font-size:13px;padding:5px 8px;border-radius:10px;border:1px solid var(--hair);background:var(--bg);color:var(--ink)}
.inb-card p{margin:10px 0}
.inb-body{white-space:pre-wrap}
.inb-acts{display:flex;gap:8px;flex-wrap:wrap}
.inb-acts .mini{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.inb-acts svg{width:16px;height:16px}
.inb-kind{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.inb-kind.k-complaint{background:color-mix(in srgb,#D07362 18%,transparent);color:#B4523F}
.inb-kind.k-suggestion{background:color-mix(in srgb,#D1B871 28%,transparent);color:#7A6020}
.inb-done{font-size:13px;display:flex;gap:6px;align-items:center}
.tn-inbox h2 small{font-size:14px;color:var(--muted);font-weight:500}
