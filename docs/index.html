/* market: number patterns and best deals; all answers must be right */
function emTiles(el, L, fin){
  const W = [4,4,5][L], H = [3,4,4][L];
  let region = null;
  for (let tries = 0; tries < 300 && !region; tries++){
    const reg = Array(W * H).fill(-1); let id = 0, bad = false;
    for (const s of shuffle([...Array(W * H).keys()])){ if (reg[s] >= 0) continue;
      const tgt = 2 + Math.floor(Math.random() * 3), cells = [s]; reg[s] = id;
      while (cells.length < tgt){ const fr = []; cells.forEach(c => { const r = Math.floor(c / W), cc = c % W; [[0,1],[1,0],[-1,0],[0,-1]].forEach(([dr, dc]) => { const rr = r + dr, c2 = cc + dc; if (rr >= 0 && rr < H && c2 >= 0 && c2 < W && reg[rr * W + c2] < 0) fr.push(rr * W + c2); }); });
        if (!fr.length) break; const x = fr[Math.floor(Math.random() * fr.length)]; reg[x] = id; cells.push(x); }
      if (cells.length < 2){ bad = true; break; } id++; }
    if (!bad) region = reg;
  }
  if (!region) region = Array.from({length: W * H}, (_, i) => Math.floor(i / 2));
  const ids = [...new Set(region)], norm = cs => { const mr = Math.min(...cs.map(c => c[0])), mc = Math.min(...cs.map(c => c[1])); return cs.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); };
  const rotP = cs => norm(cs.map(([r, c]) => [c, -r]));
  const pieces = ids.map((pid, k) => { let cs = norm(region.map((v, i) => v === pid ? [Math.floor(i / W), i % W] : null).filter(Boolean)); const t = Math.floor(Math.random() * 4); for (let j = 0; j < t; j++) cs = rotP(cs); return {k, cs, at:null}; });
  const cols = ["#0071E3","#E0413A","#248A3D","#C93400","#8944AB","#0E7C86","#D30F45","#3634A3","#B25000","#0F8A6B"];
  let sel = null;
  const board = () => { const b = Array(W * H).fill(-1); pieces.forEach(p => { if (p.at) p.cs.forEach(([r, c]) => b[(p.at[0] + r) * W + p.at[1] + c] = p.k); }); return b; };
  const fits = (p, r0, c0, b) => p.cs.every(([r, c]) => { const rr = r0 + r, cc = c0 + c; return rr >= 0 && rr < H && cc >= 0 && cc < W && b[rr * W + cc] < 0; });
  const mini = p => { const h = Math.max(...p.cs.map(c => c[0])) + 1, w = Math.max(...p.cs.map(c => c[1])) + 1;
    return `<span class="em-pc" style="--w:${w};--h:${h}">${p.cs.map(([r, c]) => `<i style="grid-row:${r + 1};grid-column:${c + 1};background:${cols[p.k % cols.length]}"></i>`).join("")}</span>`; };
  const draw = () => { const b = board();
    el.innerHTML = `<div class="em-tl"><div class="em-tb" style="--w:${W};--h:${H}">${b.map((v, i) => `<button type="button" data-c="${i}" style="${v >= 0 ? `background:${cols[v % cols.length]}` : ""}"></button>`).join("")}</div>
      <p class="em-small">${sel != null ? "اضغط مكان القطعة على الأرض، أو دوّرها." : "اختر قطعة، ثم اضغط مكانها. اضغط قطعة موضوعة لإرجاعها."}</p>
      <div class="em-tray">${pieces.filter(p => !p.at).map(p => `<button type="button" class="${sel === p.k ? "sel" : ""}" data-pc="${p.k}">${mini(p)}</button>`).join("")}</div>
      ${sel != null ? `<button type="button" class="mini" id="emRot">⟳ تدوير القطعة</button>` : ""}</div>`;
    el.querySelectorAll("[data-pc]").forEach(x => x.onclick = () => { sel = sel === +x.dataset.pc ? null : +x.dataset.pc; draw(); });
    const rb = el.querySelector("#emRot"); if (rb) rb.onclick = () => { const p = pieces[sel]; p.cs = rotP(p.cs); draw(); };
    el.querySelectorAll("[data-c]").forEach(x => x.onclick = () => { if (emCur && emCur.over) return; const i = +x.dataset.c, r = Math.floor(i / W), c = i % W, bb = board();
      if (bb[i] >= 0){ pieces[bb[i]].at = null; draw(); return; }
      if (sel == null) return; const p = pieces[sel];
      const anchor = p.cs.map(([pr, pc]) => [r - pr, c - pc]).find(([r0, c0]) => fits(p, r0, c0, bb));
      if (!anchor){ emToast("القطعة لا تتسع هنا"); return; }
      p.at = anchor; sel = null; draw();
      if (pieces.every(q => q.at)) setTimeout(() => fin(true), 300); }); };
  draw();
}


/* market: spot the price pattern, pick the best deal */
function emMarket(el, L, fin){
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const seqs = [
    () => { const a = R(2, 20), d = R(2, 9); return [0,1,2,3,4].map(i => a + d * i); },
    () => { const a = R(2, 5), q = R(2, 3); return [0,1,2,3,4].map(i => a * q ** i); },
    () => { const a = R(1, 10), d1 = R(2, 6), d2 = R(7, 12), s = [a]; for (let i = 1; i < 5; i++) s.push(s[i - 1] + (i % 2 ? d1 : d2)); return s; },
    () => { const a = R(1, 9), s = [a]; for (let i = 1; i < 5; i++) s.push(s[i - 1] + i + R(0, 0) + (L ? 1 : 0) * i); return s; },
    () => { const a = R(1, 5), b = R(2, 6), s = [a, b]; for (let i = 2; i < 5; i++) s.push(s[i - 1] + s[i - 2]); return s; },
    () => { const c = R(0, 5); return [1,2,3,4,5].map(i => i * i + c); },
    () => { const a = R(1, 4), s = [a]; for (let i = 1; i < 5; i++) s.push(s[i - 1] * 2 + 1); return s; }
  ];
  const pick = L === 0 ? seqs.slice(0, 3) : L === 1 ? seqs.slice(1, 6) : seqs.slice(3);
  const items = [];
  const cnt = [3, 4, 5][L];
  for (let k = 0; k < cnt; k++){
    if (k % 2 === 0 || L === 0 && k === 2){ const s = pick[Math.floor(Math.random() * pick.length)](), ans = s[4];
      const opts = new Set([ans]); while (opts.size < 4){ const v = ans + R(-6, 6) * (Math.abs(ans) > 40 ? 3 : 1); if (v > 0 && v !== ans) opts.add(v); }
      items.push({q:`سعر الكيس في السوق: ${s.slice(0, 4).map(n).join("، ")}، ثم؟`, opts: shuffle([...opts]).map(v => [n(v), v === ans])}); }
    else { const res = EM_RES[EM_RK[R(0, EM_RK.length - 1)]], prices = shuffle([2, 3, 4, 5, 6, 8]).slice(0, L === 2 ? 4 : 3).sort((a, b) => a - b);
      const best = prices[0], offs = prices.map(p => { const q = R(2, 9) * (L ? 1 : 1); return {q, p, t: q * p}; });
      if (L) offs.forEach(o => { if (o.p !== best) { o.q = R(2, 9); o.t = o.q * o.p; } });
      items.push({q:`أي عرض أرخص لكيس ${res.n} الواحد؟`, opts: shuffle(offs).map(o => [`${n(o.q)} أكياس بـ ${n(o.t)} ذهب`, o.p === best])}); }
  }
  let i = 0;
  const draw = () => { const it = items[i];
    el.innerHTML = `<div class="em-mk"><small>${n(i + 1)} من ${n(items.length)}</small><h3>${it.q}</h3><div class="em-mko">${it.opts.map(([l], j) => `<button type="button" class="btn sec" data-o="${j}">${l}</button>`).join("")}</div></div>`;
    el.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { if (emCur && emCur.over) return; const ok = it.opts[+b.dataset.o][1];
      b.classList.add(ok ? "ok" : "no"); if (!ok){ const j = it.opts.findIndex(x => x[1]); el.querySelector(`[data-o="${j}"]`).classList.add("ok"); return setTimeout(() => fin(false, "إجابة غير صحيحة. السوق يحتاج تركيزًا!"), 700); }
      i++; setTimeout(() => i >= items.length ? fin(true) : draw(), 350); }); };
  draw();
}
/* farm: remember where the crops were, then put them back */
function emFarm(el, L, fin, cur){

}

/* ================= Contest: حقل الألغام =================
   One shared screen run by the host, no player phones. Before play, each team in
   turn comes to the host device and secretly plants its mines on the board; the
   screen hides between teams. A square chosen by two or more teams is a shared
   mine. Then teams take turns: pick a square, answer a question from the bank.
   Correct: the square opens. A safe square gives points and shows how many mined
   squares touch it (minesweeper). A mine explodes on the picker (loss) and every
   other team that planted it gains; the picker's own mine costs double.
   Wrong: the square stays covered and the turn passes.
   Optional tools per team: detector (ask once if a square is mined) and shield
   (cancels the loss of one explosion). Ends when every safe square is open, the
   time runs out, or the host ends it. Bonus «أخطر زارع» for the team whose mines
   caught the most victims. */
const MF_NAME = "حقل الألغام";
const MF_PTS = {safe:10, boom:20, own:40, owner:20, bonus:30};
const MF_SIZES = {"4x5":[5,4], "5x5":[5,5], "6x6":[6,6]};   // [columns, rows]
const MF_KINDS = [["mcq","اختيار من متعدد"],["tf","صح وخطأ"],["open","سؤال وجواب"]];
const mfDefName = i => "الفريق " + ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن"][i];
let mfCfg = Object.assign({teams:4, names:Array(8).fill(""), size:"5x5", mines:3, level:"مختلط", kind:"mcq", cats:[], time:30, dur:0, det:true, shield:true, sound:true}, store.get("mf-cfg", {}));
let MF = store.get("mf-game", null);
if (MF && !(MF.cells && MF.scores && MF.phase)) MF = null;
let mfIv = null, mfAC = null;
const mfSaveCfg = () => store.set("mf-cfg", mfCfg);
const mfSave = () => store.set("mf-game", MF);
const mfName = i => (mfCfg.names[i] || "").trim() || mfDefName(i);
const mfCells = s => { const [c, r] = MF_SIZES[s] || MF_SIZES["5x5"]; return c * r; };

/* ---------- sound (synthesised, no files) ---------- */
function mfSound(kind){
  if (!mfCfg.sound) return;
  try {
    mfAC = mfAC || new (window.AudioContext || window.webkitAudioContext)();
    const ac = mfAC, t = ac.currentTime, out = ac.createGain(); out.connect(ac.destination);
    if (kind === "boom"){
      const len = ac.sampleRate * 1.4, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      const src = ac.createBufferSource(), lp = ac.createBiquadFilter(); src.buffer = buf; lp.type = "lowpass";
      lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(90, t + 1.2);
      out.gain.setValueAtTime(0.9, t); out.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
      src.connect(lp); lp.connect(out); src.start(t);
      const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(35, t + .6);
      g.gain.setValueAtTime(.8, t); g.gain.exponentialRampToValueAtTime(.001, t + .7); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .7);
      return;
    }
    const notes = kind === "safe" ? [[660,0],[990,.12]] : kind === "wrong" ? [[220,0],[165,.18]] : kind === "plant" ? [[440,0]] : kind === "det" ? [[520,0],[520,.16]] : kind === "tick" ? [[880,0]] : [[523,0],[659,.12],[784,.24],[1046,.36]];
    notes.forEach(([f, d]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = kind === "wrong" ? "triangle" : "sine"; o.frequency.value = f;
      const dur = kind === "plant" || kind === "tick" ? .08 : .28;
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.25, t + d + .02); g.gain.exponentialRampToValueAtTime(.001, t + d + dur);
      o.connect(g); g.connect(out); o.start(t + d); o.stop(t + d + dur + .02); });
  } catch(e){}
}

/* ---------- board helpers ---------- */
const mfNbrs = (c) => { const r = Math.floor(c / MF.cols), k = c % MF.cols, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dk = -1; dk <= 1; dk++){ if (!dr && !dk) continue;
    const rr = r + dr, kk = k + dk; if (rr >= 0 && rr < MF.rows && kk >= 0 && kk < MF.cols) out.push(rr * MF.cols + kk); }
  return out; };
const mfOwners = c => MF.mines[c] || [];
const mfAdj = c => mfNbrs(c).filter(x => mfOwners(x).length).length;
const mfSafeTotal = () => MF.cells - Object.keys(MF.mines).length;
const mfSafeOpen = () => Object.values(MF.open).filter(o => !o.boom).length;
const MF_MINE = `<svg class="mf-mine" viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g><circle cx="12" cy="12" r="6.2" fill="currentColor"/><circle cx="9.8" cy="9.8" r="1.6" fill="#fff" opacity=".75"/></svg>`;
const mfDots = owners => `<span class="mf-dots">${owners.map(o => `<i style="--tc:var(--c${o+1})"></i>`).join("")}</span>`;

function mfGrid(mode){
  // mode: "plant" (current team's selection), "play", "reveal" (end: show every mine)
  const sel = mode === "plant" ? MF.plant.sel : [], me = MF.plant.t;
  return `<div class="mf-board" style="--c:${MF.cols};--r:${MF.rows}" role="grid">${Array.from({length:MF.cells}, (_,c) => {

    if (o && o.boom) return `<div class="mf-cell boom ${o.fresh ? "fresh" : ""}" aria-label="مربع ${num}: لغم انفجر">${MF_MINE}${mfDots(o.owners)}</div>`;
    if (o) return `<div class="mf-cell open n${o.n}" style="--tc:var(--c${o.by+1})" aria-label="مربع ${num}: آمن، حوله ${o.n}"><b>${o.n ? n(o.n) : ""}</b><i class="mf-by"></i></div>`;

    const d = MF.det[c];
    return `<button type="button" class="mf-cell ${d ? "det-" + d : ""}" data-mfcell="${c}" aria-label="مربع ${num}">${d ? `<span class="mf-flag">${d === "mine" ? "⚠" : "✓"}</span>` : ""}<span class="mf-n">${num}</span></button>`;

}

      <small>اكتمل الزرع</small>
      <h1>الحقل جاهز!</h1>
      <p>زرعت ${n(MF.teams.length)} فرق ألغامها بالسر في ${n(MF.cells)} مربعًا، ولا أحد يعرف مكانها غير أصحابها.<br>يبدأ ${esc(MF.teams[0])}.</p>
      <button class="btn lg" type="button" id="mfPlay">ابدأ اللعب</button>
    </div></div></section>`;
  document.getElementById("mfPlay").onclick = () => { MF.phase = "play"; if (MF.cfg.dur) MF.end = Date.now() + MF.cfg.dur * 60000; mfSound("start"); mfSave(); mfRender(); };
}

/* ---------- play ---------- */
function mfSnap(){ const s = {...MF}; delete s.hist; MF.hist.push(JSON.stringify(s)); if (MF.hist.length > 30) MF.hist.shift(); }
function mfUndo(){ const h = MF.hist; if (!h.length) return; const s = JSON.parse(h.pop()); s.hist = h; if (MF.end && s.end) s.end = MF.end; MF = s; MF.last = null; MF.cur = null; mfSave(); mfRender(); }
function mfTeams(){
  return `<div class="mf-teams" style="--n:${MF.teams.length}">${MF.teams.map((t,i) => {
    const live = Object.entries(MF.mines).filter(([c, o]) => o.includes(i) && !MF.open[c]).length;
    const tools = [MF.cfg.det ? `<span class="${MF.detUsed[i] ? "used" : ""}">كاشف</span>` : "", MF.cfg.shield ? `<span class="${MF.shield[i] ? "" : "used"}">درع</span>` : ""].join("");
    return `<div class="mf-team ${i === MF.turn && MF.phase === "play" ? "now" : ""}" style="--tc:var(--c${i+1})"><small>${esc(t)}</small><b>${n(MF.scores[i])}</b>
      <span class="mf-tl">${MF_MINE}${n(live)} لم ينفجر${tools ? ` ${tools}` : ""}</span></div>`; }).join("")}</div>`;
}
function mfClock(){
  if (!MF.end) return "";
  const s = Math.max(0, Math.ceil((MF.end - Date.now()) / 1000));
  return `${n(Math.floor(s / 60))}:${String(s % 60).padStart(2, "0")}`;
}
function mfBoard(){
  window.scrollTo({top:0});
  const T = MF.teams.length, safeLeft = mfSafeTotal() - mfSafeOpen(), canDet = MF.cfg.det && !MF.detUsed[MF.turn];
  $app.innerHTML = `<section class="game gut view mf-play"><div class="wrap">
    <div class="gbar"><div class="turn"><small>الدور على</small><b style="color:var(--c${MF.turn+1})">${esc(MF.teams[MF.turn])}</b><small>· ${MF.detMode ? "اختر المربع اللي تبي تكشفه بالكاشف" : "اختر مربعًا"}</small></div>
      <div class="mf-tbar">${MF.end ? `<span class="mf-clock" id="mfClock">${mfClock()}</span>` : ""}
        ${canDet ? `<button type="button" class="mini ${MF.detMode ? "on" : ""}" id="mfDet">${MF.detMode ? "إلغاء الكاشف" : "استخدم الكاشف"}</button>` : ""}
        <button type="button" class="mini" id="mfSnd" aria-pressed="${!!mfCfg.sound}">${mfCfg.sound ? "الصوت: يعمل" : "الصوت: مطفأ"}</button>
        <button type="button" class="mini" id="mfUndo" ${MF.hist.length ? "" : "disabled"}>تراجع</button>
        <button class="end" type="button" id="mfEnd">إنهاء المسابقة</button></div></div>
    <div class="mf-main">
      <div class="mf-center ${MF.detMode ? "detecting" : ""}">${mfGrid("play")}
        <p class="hint">المربعات الآمنة الباقية: ${n(safeLeft)} · الرقم في المربع المكشوف = عدد المربعات الملغومة حوله</p></div>
      <aside>${mfTeams()}</aside>
    </div>
  </div></section>${MF.last ? mfPop() : ""}`;
  $app.querySelectorAll("[data-mfcell]").forEach(b => b.onclick = () => mfPick(+b.dataset.mfcell));
  const d = document.getElementById("mfDet"); if (d) d.onclick = () => { MF.detMode = !MF.detMode; mfSave(); mfBoard(); };
  document.getElementById("mfSnd").onclick = () => { mfCfg.sound = !mfCfg.sound; mfSaveCfg(); mfBoard(); };
  document.getElementById("mfUndo").onclick = mfUndo;
  const e = document.getElementById("mfEnd");
  e.onclick = () => { if (e.dataset.sure){ mfFinish(true); return; } e.dataset.sure = "1"; e.textContent = "متأكد؟ اضغط مرة ثانية"; setTimeout(() => { if (e.isConnected){ delete e.dataset.sure; e.textContent = "إنهاء المسابقة"; } }, 4000); };
  const go = document.getElementById("mfPopOk"); if (go) { go.onclick = mfPopClose; go.focus(); }
  Object.values(MF.open).forEach(o => { delete o.fresh; });
}
function mfPopClose(){
  MF.last = null; mfSave();
  if (MF.phase === "over" || mfSafeOpen() >= mfSafeTotal() || (MF.end && Date.now() >= MF.end)) return mfFinish(false);
  mfBoard();
}
function mfPop(){
  const L = MF.last, nm = i => `<b style="color:var(--c${i+1})">${esc(MF.teams[i])}</b>`;
  let ic = "", h = "", body = "", cls = L.kind;
  if (L.kind === "safe"){ ic = `<span class="mf-big n${L.n}">${n(L.n)}</span>`; h = "مربع آمن!";
    body = `<p>${L.n === 0 ? "ولا لغم حوله." : L.n === 1 ? "حوله لغم واحد." : L.n === 2 ? "حوله لغمان." : `حوله ${n(L.n)} ألغام.`}</p><p class="mf-delta">${nm(L.t)} +${n(MF_PTS.safe)}</p>`; }
  else if (L.kind === "boom"){ ic = `<span class="mf-burst">${MF_MINE}</span>`; h = "انفجار!";
    const others = L.owners.filter(o => o !== L.t);
    body = `<p>${L.own && !others.length ? `داس ${nm(L.t)} على لغمه نفسه! نسيتوا وين زرعتوه؟` : L.own ? `داس ${nm(L.t)} على لغم مشترك بينه وبين ${mfJoin(others.map(nm))}!` : L.owners.length > 1 ? `لغم مشترك زرعه ${mfJoin(L.owners.map(nm))}.` : `هذا لغم ${nm(L.owners[0])}.`}</p>
      <p class="mf-delta">${L.shielded ? `🛡 الدرع حمى ${nm(L.t)} من الخسارة` : `${nm(L.t)} <span class="bad">−${n(L.loss)}</span>`}${others.map(o => ` · ${nm(o)} +${n(MF_PTS.owner)}`).join("")}</p>`; }
  else if (L.kind === "wrong"){ ic = `<span class="mf-big x">✕</span>`; h = "إجابة خاطئة";
    body = `<p>المربع ${n(L.c + 1)} يبقى مغطّى، والدور ينتقل إلى ${nm(MF.turn)}.</p>`; }
  else if (L.kind === "det"){ cls = "det " + L.res; ic = `<span class="mf-big">${L.res === "mine" ? "⚠" : "✓"}</span>`; h = L.res === "mine" ? "انتبه! فيه لغم" : "المربع آمن";
    body = `<p>الكاشف فحص المربع ${n(L.c + 1)} لـ${nm(L.t)}. ${L.res === "mine" ? "لا تدوسه!" : "تقدر تختاره بأمان."}</p><p>أكمل دورك واختر مربعًا.</p>`; }
  const over = L.kind !== "det" && (mfSafeOpen() >= mfSafeTotal() || (MF.end && Date.now() >= MF.end));
  return `<div class="mf-pop" role="dialog" aria-modal="true" aria-label="${h}"><div class="mf-popcard ${cls}">${ic}<h2>${h}</h2>${body}
    <button class="btn lg" type="button" id="mfPopOk">${over ? "عرض النتائج" : L.kind === "det" ? "تمام" : "متابعة"}</button></div></div>`;
}
function mfPick(c){
  if (MF.open[c] || MF.last) return;
  if (MF.detMode){
    mfSnap(); const res = mfOwners(c).length ? "mine" : "safe";
    MF.det[c] = res; MF.detUsed[MF.turn] = true; MF.detMode = false;
    MF.last = {kind:"det", c, res, t:MF.turn}; mfSound("det"); mfSave(); return mfBoard();
  }
  let pool = mfPoolOf(MF.cfg).filter(q => !MF.used.includes(q.id));
  if (!pool.length){ MF.used = []; pool = mfPoolOf(MF.cfg); }
  const q = pool[Math.floor(Math.random() * pool.length)];
  MF.used.push(q.id);
  MF.cur = {c, q:sjPrep(q), pick:-1, shown:false, t0:Date.now(), rung:false};
  mfSave(); mfQuestion();
}
function mfSwap(){
  const cur = MF.cur; let pool = mfPoolOf(MF.cfg).filter(q => !MF.used.includes(q.id));
  if (!pool.length) return;
  const q = pool[Math.floor(Math.random() * pool.length)]; MF.used.push(q.id);
  MF.cur = {c:cur.c, q:sjPrep(q), pick:-1, shown:false, t0:Date.now(), rung:false}; mfSave(); mfQuestion();
}
function mfQuestion(){
  window.scrollTo({top:0});
  const cur = MF.cur, q = cur.q, me = MF.turn, judged = cur.pick >= 0 || cur.shown;
  const right = q.kind === "open" ? null : cur.pick === q.ai;
  const opts = q.kind === "open" ? "" : `<div class="choices ${q.kind === "tf" ? "two" : ""}">${q.options.map((o,k) => {
    const cls = cur.pick < 0 ? "" : k === q.ai ? "correct" : k === cur.pick ? "wrong" : "dim";
    return `<button type="button" class="choice ${cls}" data-mfo="${k}" ${cur.pick >= 0 ? "disabled" : ""}><span class="k">${KEYS[k] || k+1}</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
  const qt = MF.cfg.time && !judged ? `<span class="mf-qt" id="mfQt">${n(Math.max(0, Math.ceil((cur.t0 + MF.cfg.time * 1000 - Date.now()) / 1000)))}</span>` : "";
  $app.innerHTML = `<section class="game gut view mf-play"><div class="wrap">
    <div class="gbar"><div class="turn"><small>يجيب</small><b style="color:var(--c${me+1})">${esc(MF.teams[me])}</b><small>· المربع ${n(cur.c + 1)}</small></div>
      <div class="mf-tbar">${MF.end ? `<span class="mf-clock" id="mfClock">${mfClock()}</span>` : ""}${qt}
        ${judged ? "" : `<button type="button" class="mini" id="mfSwap">سؤال آخر</button><button class="mini" type="button" id="mfBack">العودة للوحة</button>`}</div></div>
    <div class="mf-qwrap">
      <article class="card">
        <div class="meta-row"><span class="sj-val">المربع ${n(cur.c + 1)}</span><span>${esc(q.category)}</span>${q.difficulty ? `<span class="lvl-${esc(q.difficulty)}">${esc(q.difficulty)}</span>` : ""}</div>
        <p class="qtext">${esc(q.question)}</p>
        ${opts}
        ${q.kind === "open" && cur.shown ? `<div class="answer"><small>الإجابة</small><b>${esc(q.answerText)}</b></div>` : ""}
        ${judged && q.explanation ? `<div class="note">${esc(q.explanation)}</div>` : ""}
        <div class="actions">${q.kind === "open"
          ? (cur.shown ? `<span class="count">هل أجاب ${esc(MF.teams[me])} صحيحًا؟</span><div class="mf-judge"><button class="btn" type="button" data-mfj="1">صح، اكشف المربع</button><button class="btn sec" type="button" data-mfj="0">خطأ</button></div>`
                       : `<span class="count">يجيب الفريق شفهيًا، ثم أظهر الإجابة.</span><button class="btn" type="button" id="mfShowA">إظهار الإجابة</button>`)
          : (cur.pick < 0 ? `<span class="count">اضغط على الخيار الذي اختاره الفريق.</span>`
                         : `<span class="count ${right ? "ok" : "no"}">${right ? "إجابة صحيحة!" : "إجابة خاطئة"}</span><button class="btn" type="button" data-mfj="${right ? 1 : 0}">${right ? "اكشف المربع" : "انقل الدور"}</button>`)}</div>
      </article>
      <div class="mf-mini">${mfGrid("play")}</div>
    </div>
  </div></section>`;
  const mini = $app.querySelector(`.mf-mini [data-mfcell="${cur.c}"]`); if (mini) mini.classList.add("sel");
  $app.querySelectorAll(".mf-mini [data-mfcell]").forEach(b => b.disabled = true);
  $app.querySelectorAll("[data-mfo]").forEach(b => b.onclick = () => { cur.pick = +b.dataset.mfo; mfSound(cur.pick === q.ai ? "safe" : "wrong"); mfSave(); mfQuestion(); });
  const sa = document.getElementById("mfShowA"); if (sa) sa.onclick = () => { cur.shown = true; mfSave(); mfQuestion(); };
  const bk = document.getElementById("mfBack"); if (bk) bk.onclick = () => { MF.cur = null; mfSave(); mfBoard(); };
  const sw = document.getElementById("mfSwap"); if (sw) sw.onclick = mfSwap;
  $app.querySelectorAll("[data-mfj]").forEach(b => b.onclick = () => mfResolve(b.dataset.mfj === "1"));
}
function mfResolve(ok){
  const c = MF.cur.c, t = MF.turn, T = MF.teams.length;
  MF.cur = null; mfSnap();
  MF.played++;
  if (!ok){ MF.turn = (t + 1) % T; MF.last = {kind:"wrong", c, t}; mfSound("wrong"); }
  else {
    const owners = mfOwners(c);
    if (!owners.length){ const k = mfAdj(c); MF.open[c] = {by:t, n:k, fresh:1}; MF.scores[t] += MF_PTS.safe; MF.last = {kind:"safe", c, t, n:k}; mfSound("safe"); }
    else {
      const own = owners.includes(t), others = owners.filter(o => o !== t);
      let loss = own ? MF_PTS.own : MF_PTS.boom, shielded = false;
      if (MF.cfg.shield && MF.shield[t]){ MF.shield[t] = false; shielded = true; loss = 0; }
      MF.scores[t] -= loss;
      others.forEach(o => { MF.scores[o] += MF_PTS.owner; MF.victims[o]++; });
      MF.open[c] = {by:t, boom:true, owners:owners.slice(), fresh:1};
      MF.last = {kind:"boom", c, t, owners:owners.slice(), own, loss, shielded}; mfSound("boom");
    }
    MF.turn = (t + 1) % T;
  }
  mfSave(); mfBoard();
}
function mfFinish(early){
  if (MF.phase !== "over"){
    MF.phase = "over"; MF.early = !!early; MF.cur = null; MF.last = null; MF.detMode = false;
    const top = Math.max(...MF.victims);
    MF.bonus = top > 0 ? MF.victims.map((v,i) => v === top ? i : -1).filter(i => i >= 0) : [];
    MF.bonus.forEach(i => MF.scores[i] += MF_PTS.bonus);
    mfSave(); mfSound("end");
  }
  mfResults();
}
function mfResults(){
  window.scrollTo({top:0});
  const g = MF, rank = g.teams.map((t,i) => ({t, i, s:g.scores[i]})).sort((a,b) => b.s - a.s);
  const top = rank.filter(r => r.s === rank[0].s);
  const head = top.length > 1 ? "تعادل في الصدارة!" : `الفائز: ${esc(rank[0].t)}`;
  const shared = Object.values(g.mines).filter(o => o.length > 1).length;
  $app.innerHTML = `<section class="done gut view mf-done"><div class="wrap">${I(P.trophy)}
    <h1>${head}</h1><p>${g.early ? "أُنهيت المسابقة قبل كشف كل المربعات" : g.end && Date.now() >= g.end && mfSafeOpen() < mfSafeTotal() ? "انتهى وقت المسابقة" : "انكشفت كل المربعات الآمنة"} · ${n(g.played)} سؤالًا</p>
    <ol class="sj-rank">${rank.map((r,k) => `<li style="--tc:var(--c${r.i+1})"><i>${n(k+1)}</i><b>${esc(r.t)}${g.bonus.includes(r.i) ? ` <em class="mf-bonus">أخطر زارع +${n(MF_PTS.bonus)}</em>` : ""}</b><span>${n(r.s)}</span></li>`).join("")}</ol>
    <h2 class="mf-rh">وين كانت الألغام؟</h2>
    <p class="mf-rsub">كل نقطة ملوّنة تدل على الفريق اللي زرع اللغم${shared ? ` · ${shared === 1 ? "لغم واحد مشترك" : n(shared) + " ألغام مشتركة"} بين أكثر من فريق` : ""}.</p>
    <div class="mf-center mf-reveal">${mfGrid("reveal")}</div>
    <div class="mf-legend">${g.teams.map((t,i) => `<span style="--tc:var(--c${i+1})"><i></i>${esc(t)}</span>`).join("")}</div>
    <div class="cta" style="margin-top:28px"><button class="btn" type="button" id="mfAgain">مسابقة جديدة بنفس الإعدادات</button>
      <button class="btn sec" type="button" id="mfEdit">تعديل الإعدادات</button></div></div></section>`;
  document.getElementById("mfAgain").onclick = () => { MF = null; mfSave(); mfStart(); };
  document.getElementById("mfEdit").onclick = () => { MF = null; mfSave(); nav("mf"); };
}

/* ---------- clocks ---------- */
function mfTickStart(){ if (!mfIv) mfIv = setInterval(mfTick, 250); }
function mfStop(){ clearInterval(mfIv); mfIv = null; }
function mfTick(){
  if (!MF || MF.phase !== "play" || location.hash !== "#mfplay") return;
  const ck = document.getElementById("mfClock"); if (ck) ck.textContent = mfClock();
  if (MF.end && Date.now() >= MF.end){ if (ck) ck.classList.add("out");
    if (!MF.cur && !MF.last){ mfFinish(false); return; } }
  const cur = MF.cur, qt = document.getElementById("mfQt");
  if (cur && qt && MF.cfg.time && !cur.rung){ const s = Math.max(0, Math.ceil((cur.t0 + MF.cfg.time * 1000 - Date.now()) / 1000));
    if (qt.textContent !== n(s)){ qt.textContent = n(s); if (s <= 5 && s > 0) mfSound("tick"); }
    qt.classList.toggle("low", s <= 5);
    if (s === 0 && !cur.rung){ cur.rung = true; qt.textContent = "انتهى الوقت"; mfSound("wrong"); mfSave(); } }
}
/*MF-JS-END*/
load();
})();
</script>

</body></html>
