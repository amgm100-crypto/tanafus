<script>window.TN_CONFIG = {"url": "https://pcawdjzmvsdiynimgbgu.supabase.co", "key": "sb_publishable_fqP8mKShZEGlXKU2eAatFg_elP8Q257"};
/* تنافس — hosted backend adapter (Supabase).
   Re-implements the three capabilities the site used on claude.ai, with the same API:
     db   : doc(path).get/set/delete, collection(name).get        -> table public.docs
     user : canEdit()                                              -> owner signed in with Supabase Auth (role admin)
     room : emit/on/presence/peers/onPeers                         -> one Supabase Realtime channel
   Plus org login without exposing password hashes: TN.login / TN.profile (RPCs).
   Needs window.TN_CONFIG = {url, key} and supabase-js loaded first. */
(function(){
  const cfg = window.TN_CONFIG || {};
  if (!cfg.url || !cfg.key || !window.supabase) return;       // no backend -> site runs in standalone mode
  const sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, storageKey: "tn-owner" } });

  const split = p => { const i = p.indexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; };
  const snap = (id, row) => ({ id, exists: !!row, data: () => row ? row.data : undefined });
  const fail = e => { const x = new Error(e && e.message || "db error"); x.code = e && e.code; throw x; };

  const db = {
    doc(path){
      const [col, id] = split(path);
      return {
        id,
        async get(){ const { data, error } = await sb.from("docs").select("data").eq("col", col).eq("id", id).maybeSingle(); if (error) fail(error); return snap(id, data); },
        async set(obj){ const { error } = await sb.from("docs").upsert({ col, id, data: obj, updated: new Date().toISOString() }); if (error) fail(error); },
        async delete(){ const { error } = await sb.from("docs").delete().eq("col", col).eq("id", id); if (error) fail(error); }
      };
    },
    collection(col){
      return {
        async get(){
          const rows = []; const page = 500;
          for (let from = 0; ; from += page){
            const { data, error } = await sb.from("docs").select("id,data").eq("col", col).order("id").range(from, from + page - 1);
            if (error) fail(error); rows.push(...data); if (data.length < page) break;
          }
          const docs = rows.map(r => ({ id: r.id, exists: true, data: () => r.data }));
          return { empty: !docs.length, docs, size: docs.length };
        }
      };
    }
  };

  async function isAdmin(){
    const { data } = await sb.auth.getSession(); const s = data && data.session;
    return !!(s && s.user && s.user.app_metadata && s.user.app_metadata.role === "admin");
  }
  const user = { canEdit: isAdmin };

  /* ---------- realtime room ----------
     Supabase Presence is rate-limited per client (a phone tapping fast got cut off), so presence is
     carried on broadcast instead: each tab announces its state (throttled), re-announces every 4 s as
     a heartbeat, and is dropped after 12 s of silence or on "bye". */
  let room = null;
  function makeRoom(){
    const me = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
    const ch = sb.channel("tanafus-live", { config: { broadcast: { self: false, ack: false } } });
    const handlers = {}, peerSubs = new Set(), others = {};      // others: key -> {p, t}
    let mine = {}, ready, readyRes, joined = false, lastSent = 0, pend = null;
    ready = new Promise(r => readyRes = r);
    const THROTTLE = 450, BEAT = 4000, EXPIRE = 12000;
    const peerOf = (k, p) => ({ peer: k, presence: p, sameTab: k === me });
    const notify = ch2 => { if (ch2.joined.length || ch2.updated.length || ch2.left.length) peerSubs.forEach(fn => { try { fn(ch2); } catch(e){} }); };
    const raw = (event, payload) => ch.send({ type: "broadcast", event, payload });
    const announce = () => { lastSent = Date.now(); pend = null; return raw("p", { f: me, p: mine }); };
    const schedule = () => {                                       // leading + trailing throttle
      if (!joined) return; const wait = THROTTLE - (Date.now() - lastSent);
      if (wait <= 0 && !pend) return announce();
      if (!pend) pend = setTimeout(announce, Math.max(0, wait));
    };
    ch.on("broadcast", { event: "m" }, ({ payload }) => {
      const t = payload && payload.t; (handlers[t] || []).forEach(fn => { try { fn({ type: t, data: payload.d, peer: payload.f, sameTab: false }); } catch(e){} });
    });
    ch.on("broadcast", { event: "p" }, ({ payload }) => {
      if (!payload || !payload.f || payload.f === me) return;
      const k = payload.f, old = others[k], p = payload.p || {};
      others[k] = { p, t: Date.now() };
      if (!old) notify({ joined: [peerOf(k, p)], updated: [], left: [] });
      else if (JSON.stringify(old.p) !== JSON.stringify(p)) notify({ joined: [], updated: [peerOf(k, p)], left: [] });
    });
    ch.on("broadcast", { event: "hello" }, ({ payload }) => { if (payload && payload.f !== me) setTimeout(announce, Math.random() * 600); });
    ch.on("broadcast", { event: "bye" }, ({ payload }) => {
      const k = payload && payload.f; if (!k || !others[k]) return; const o = others[k]; delete others[k];
      notify({ joined: [], updated: [], left: [peerOf(k, o.p)] });
    });
    ch.subscribe(status => {
      if (status === "SUBSCRIBED"){ joined = true; raw("hello", { f: me }); announce(); readyRes(); }
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") joined = false;
    });
    setInterval(() => {
      if (joined && Date.now() - lastSent > BEAT - 200) announce();
      const now = Date.now(), left = [];
      Object.keys(others).forEach(k => { if (now - others[k].t > EXPIRE){ left.push(peerOf(k, others[k].p)); delete others[k]; } });
      if (left.length) notify({ joined: [], updated: [], left });
    }, 1000);
    addEventListener("pagehide", () => { try { raw("bye", { f: me }); } catch(e){} });
    return {
      async emit(type, data){ await ready; const r = await raw("m", { t: type, d: data, f: me }); if (r !== "ok") throw new Error("emit " + r); },
      on(type, fn){ (handlers[type] = handlers[type] || []).push(fn); return () => { handlers[type] = (handlers[type] || []).filter(x => x !== fn); }; },
      async presence(obj){
        Object.keys(obj || {}).forEach(k => { if (obj[k] === null) delete mine[k]; else mine[k] = obj[k]; });
        schedule();
      },
      peers(){ return [peerOf(me, mine)].concat(Object.keys(others).map(k => peerOf(k, others[k].p))); },
      onPeers(fn){ peerSubs.add(fn); return () => peerSubs.delete(fn); }
    };
  }

  window.TN = {
    client: sb,
    async use(name){
      if (name === "db") return db;
      if (name === "user") return user;
      if (name === "room") return room || (room = makeRoom());
      return null;                       // downloads etc. -> the site falls back to normal browser behaviour
    },
    isAdmin,
    /* org login: the server checks the password, the hash never reaches the browser */
    async login(u, pw){ const { data, error } = await sb.rpc("tn_login", { p_user: u, p_pw: pw }); if (error) throw error; return data || null; },
    async pinLogin(pin){ const { data, error } = await sb.rpc("tn_pin_login", { p_pin: pin }); if (error) throw error; return data || null; },
    async setPin(u, pw, pin){ const { data, error } = await sb.rpc("tn_set_pin", { p_user: u, p_pw: pw, p_pin: pin }); if (error) throw error; return data; },
    /* organisation's own questions (TN-ORGQ): token from TN.login / TN.pinLogin */
    async orgqGet(tok){ const { data, error } = await sb.rpc("tn_orgq_get", { p_tok: tok }); if (error) throw error; return data; },
    async orgqSave(tok, items){ const { data, error } = await sb.rpc("tn_orgq_save", { p_tok: tok, p_items: items }); if (error) throw error; return data; },
    /* plan orders, contact messages and the owner's inbox (TN-ORDER) */
    async order(p){ const { data, error } = await sb.rpc("tn_order", { p }); if (error) throw error; return data; },
    async freeReg(p){ const { data, error } = await sb.rpc("tn_free_reg", { p }); if (error) throw error; return data; },
    async contact(p){ const { data, error } = await sb.rpc("tn_contact", { p }); if (error) throw error; return data; },
    async inbox(table){ const { data, error } = await sb.from(table).select("*").order("at", { ascending: false }).limit(300); if (error) throw error; return data || []; },
    async setStatus(table, id, status){ const { error } = await sb.from(table).update({ status }).eq("id", id); if (error) throw error; },
    /* counters and play log (TN-ID) */
    async visit(vid){ await sb.rpc("tn_visit", { p_vid: vid }); },
    async play(acct, contest){ await sb.rpc("tn_play", { p_acct: acct || "", p_contest: contest }); },
    async counts(){ const { data, error } = await sb.rpc("tn_counts"); if (error) throw error; return data; },
    async report(){ const { data, error } = await sb.rpc("tn_play_report"); if (error) throw error; return data || []; },
    async profile(u){ const { data, error } = await sb.rpc("tn_profile", { p_user: u }); if (error) return null; return data || null; },
    /* owner login (email + password, Supabase Auth) */
    async ownerLogin(email, pw){ const { error } = await sb.auth.signInWithPassword({ email, password: pw }); if (error) return false; return await isAdmin(); },
    async ownerLogout(){ await sb.auth.signOut(); }
  };
})();
</script>
<script>

var qrcode = function() {

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

/* Data */
function normLetter(ch){
  if (!ch) return "";
  if ("أإآاٱء".includes(ch)) return "أ";
  if (ch === "ه" || ch === "ة") return "هـ";
  if (ch === "ى" || ch === "ئ") return "ي";
  if (ch === "ؤ") return "و";
  return LETTERS.includes(ch) ? ch : "";
}
function firstLetter(text){
  let w = String(text||"").trim().replace(/^[«"'(\[]+/,"").replace(/[ً-ٰٟ]/g,"");
  if (/^ال/.test(w) && w.split(/\s/)[0].length > 3) w = w.slice(2);
  return normLetter(w.charAt(0));
}
function normalize(q){
  const options = Array.isArray(q.options) ? q.options.filter(o => String(o).trim() !== "") : [];
  let ai = Number.isInteger(q.answer_index) ? q.answer_index : -1;
  const answerText = ai >= 0 && options[ai] != null ? options[ai] : (q.answer ?? q.correct_answer ?? "");
  if (ai < 0 && answerText && options.length) ai = options.indexOf(answerText);
  const t = String(q.type||"");
  let kind = "open";
  if (/صح|خطأ/.test(t) || (options.length === 2 && options.includes("صح"))) kind = "tf";
  else if (options.length >= 2 && ai >= 0) kind = "mcq";
  const raw = q.letter || q.start_letter || q.starting_letter || q["الحرف"];
  // Letter questions are their own type: an explicit letter field, or an open question (letters book) whose answer gives the letter
  const letter = raw ? (normLetter(String(raw).trim().charAt(0)) || String(raw).trim()) : (kind === "open" ? firstLetter(answerText) : "");
  return { id:q.id, question:q.question, options, ai, answerText, kind, letter,
    category:q.category||"معلومات عامة", difficulty:q.difficulty||"", explanation:q.explanation||"", source:q.source||"" };
}

const CHUNK_MAX = 200;
const KIND_TYPE = {mcq:"اختيار من متعدد", tf:"صح وخطأ", open:"سؤال وجواب"};
async function useCap(name){

function rebuild(){

async function load(){
  DB = await useCap("db");
  const user = await useCap("user");
  if (DB){
    try {
      // meta/bank lists every chunk id, so the page reads each chunk on its own instead of relying on one large collection read
      const meta = await DB.doc("meta/bank").get();
      const ids = meta.exists ? ((meta.data() || {}).chunks || []) : [];
      if (ids.length){
        const snaps = await Promise.all(ids.map(id => DB.doc("chunks/" + id).get()));
        CHUNKS = {}; snaps.forEach(d => { if (d.exists) CHUNKS[d.id] = (d.data() || {}).items || []; });
        SOURCE = "db";
      } else {
        const snap = await DB.collection("chunks").get();
        if (!snap.empty){ CHUNKS = {}; snap.docs.forEach(d => { CHUNKS[d.id] = (d.data() || {}).items || []; }); SOURCE = "db"; }
      }
    } catch(e){ DB = null; }
  }
  if (DB){ try { CAN_EDIT = user ? await user.canEdit() : false; } catch(e){ CAN_EDIT = false; } }
  // standalone file only (no claude.ai, no hosted backend): edits stay in this browser. A backend that is down never grants editing.
  else CAN_EDIT = !(window.claude && window.claude.use) && !window.TN_CONFIG;
  REAL_ADMIN = CAN_EDIT;
  const pv = acPv();
  if (REAL_ADMIN && pv){ CAN_EDIT = false; if (pv === "guest") SESSION = null; else if (pv.startsWith("org:")) SESSION = {user:pv.slice(4)}; }
  if (SOURCE === "db") RAW = Object.keys(CHUNKS).sort().flatMap(k => CHUNKS[k]);
  else {
    const local = DB ? null : store.get("bank-local", null);
    if (Array.isArray(local)){ RAW = local; SOURCE = "local"; }
    else for (const u of ["questions.json","../question-bank/questions.json"]){
      try { const r = await fetch(u,{cache:"no-cache"}); if (!r.ok) continue;
        const d = await r.json(); RAW = (Array.isArray(d) ? d : (d.questions||[])).filter(q => q && q.question); break; } catch(e){}
    }
  }
  rebuild(); await freeLoad();
  acBrand(); acPvBar(); acRefresh().then(() => acPvBar()).then(() => { if (!SESSION && !CAN_EDIT && /^#(sj|b4|ss|tk$|tkplay|er$|erhost|erplay|em$|emplay)/.test(location.hash)) route(); });
  route();
}
function chunkOf(id){ for (const k in CHUNKS) if (CHUNKS[k].some(q => q.id === id)) return k; return null; }
function rebuildChunks(){ CHUNKS = {}; for (let i = 0; i < RAW.length; i += CHUNK_MAX) CHUNKS["c" + String(i/CHUNK_MAX + 1).padStart(4,"0")] = RAW.slice(i, i + CHUNK_MAX); }
async function writeChunk(k){ await DB.doc("chunks/" + k).set({ items: CHUNKS[k], updated: new Date().toISOString() }); }
async function writeMeta(){ await DB.doc("meta/bank").set({ chunks: Object.keys(CHUNKS).sort(), count: RAW.length, updated: new Date().toISOString() }); }
async function saveAll(){
  const old = await DB.collection("chunks").get();
  rebuildChunks();
  for (const k of Object.keys(CHUNKS)) await writeChunk(k);
  await writeMeta();
  for (const d of old.docs) if (!CHUNKS[d.id]) await DB.doc("chunks/" + d.id).delete();
  SOURCE = "db";
}
/* Persist one change (or everything). Returns an error message or "" */
async function persist(changed){
  if (ORGM) return orgqPersist();
  rebuild();
  if (!DB){ store.set("bank-local", RAW); SOURCE = "local"; return ""; }
  try {
    if (SOURCE !== "db" || !changed) { await saveAll(); return ""; }
    if (changed.removedFrom){ CHUNKS[changed.removedFrom] = CHUNKS[changed.removedFrom].filter(q => q.id !== changed.id); await writeChunk(changed.removedFrom); return ""; }
    let k = chunkOf(changed.id);
    if (k){ CHUNKS[k] = CHUNKS[k].map(q => q.id === changed.id ? changed.rec : q); }
    else { const keys = Object.keys(CHUNKS).sort(); k = keys.find(x => CHUNKS[x].length < CHUNK_MAX) || ("c" + String(keys.length + 1).padStart(4,"0")); const isNew = !CHUNKS[k]; CHUNKS[k] = [...(CHUNKS[k]||[]), changed.rec];
      await writeChunk(k); if (isNew) await writeMeta(); return ""; }
    await writeChunk(k); return "";
  } catch(e){ return e && e.code === "quota_exceeded" ? "امتلأت مساحة البنك." : "تعذّر الحفظ. تحقق من الاتصال ثم أعد المحاولة."; }
}
function nextId(){ const P0 = ORGM ? "J" : "Q", re = ORGM ? /^J(\d+)$/ : /^Q(\d+)$/; let m = 0; RAW.forEach(q => { const x = re.exec(q.id||""); if (x) m = Math.max(m, +x[1]); }); return P0 + String(m + 1).padStart(4,"0"); }

async function importBank(e){
  const file = e.target.files && e.target.files[0]; if (!file) return;
  let list;
  try { const d = JSON.parse(await file.text()); list = (Array.isArray(d) ? d : d.questions || []).filter(q => q && q.question); }
  catch(_){ flash("الملف ليس بصيغة questions.json."); return; }
  const byId = new Map(RAW.map(r => [r.id, r])); const seen = new Set(RAW.map(r => String(r.question).trim()));
  let added = 0, updated = 0, skipped = 0;
  for (const q of list){
    if (q.id && byId.has(q.id)){ byId.set(q.id, q); updated++; }
    else if (seen.has(String(q.question).trim())) skipped++;
    else { const rec = {...q, id: q.id || null}; if (!rec.id){ RAW = [...byId.values()]; rec.id = nextId(); } byId.set(rec.id, rec); seen.add(String(q.question).trim()); added++; }
  }
  RAW = [...byId.values()];
  flash("جارٍ الحفظ…");
  const err = await persist(null);
  adm.msg = err || `أُضيف ${n(added)}، وحُدّث ${n(updated)}، وتُرك ${n(skipped)} مكرر.`; admin();
}

/* ordering */
const ORD = {plan:"", games:[], step:1, f:{org:"", person:"", phone:"", email:"", logo:""}, sent:false};
const ORD_PLANS = {one:{n:"مسابقة واحدة", max:1}, five:{n:"خمس مسابقات", max:5}, all:{n:"كل المسابقات", max:99}};
const ordPrice = () => { const er = ORD.games.includes("er"); return ORD.plan === "one" ? (er ? 99 : 39) : ORD.plan === "five" ? (er ? 199 : 149) : 299; };
const toEnDigits = x => String(x || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const normPhone = x => { let d = toEnDigits(x).replace(/[^\d+]/g, ""); if (/^05\d{8}$/.test(d)) d = "966" + d.slice(1); return d.replace(/^\+/, ""); };
function tnOrder(plan, again){
  if (!ORD_PLANS[plan]) return nav("plans");
  if (!again && (ORD.plan !== plan || ORD.sent)){ ORD.plan = plan; ORD.sent = false; ORD.step = 1; ORD.games = plan === "all" ? CONTESTS.filter(c => c.go).map(c => c.go) : []; }
  window.scrollTo({top:0}); const P0 = ORD_PLANS[plan], live = CONTESTS.filter(c => c.go);
  const stepper = `<ol class="ord-steps"><li class="${ORD.step >= 1 ? "on" : ""}"><i>1</i>المسابقات</li><li class="${ORD.step >= 2 ? "on" : ""}"><i>2</i>بيانات الجهة</li><li class="${ORD.sent ? "on" : ""}"><i>3</i>تم الطلب</li></ol>`;
  if (ORD.sent){
    $app.innerHTML = `<section class="section gut view"><div class="wrap ord-done">${stepper}
      <span class="ord-wa">${I(P.tnwa)}</span><h1>تم استلام طلبك</h1>
      <p class="lead">سيتم التواصل معكم عبر الواتساب على الرقم <b dir="ltr">${esc(ORD.f.phone)}</b> لإتمام الطلب.</p>
      <p class="ord-sum">${P0.n} · ${ORD.games.map(g => (CONTESTS.find(c => c.go === g) || {}).name).join("، ")} · <b>${ordPrice()} ريال</b> دفعة واحدة</p>
      <p><button type="button" class="btn lg" id="ordHome">الرجوع للرئيسية</button></p></div></section>`;
    document.getElementById("ordHome").onclick = () => nav("start"); return;
  }
  const summary = `<div class="ord-bar"><span><b>${P0.n}</b> · ${ORD.games.length ? ORD.games.map(g => (CONTESTS.find(c => c.go === g) || {}).name).join("، ") : "لم تختر بعد"}</span><span class="ord-price">${ordPrice()} <small>ريال · دفعة واحدة</small></span></div>`;
  if (ORD.step === 1){
    const need = plan === "all" ? 0 : P0.max, full = plan !== "all" && ORD.games.length >= P0.max;
    $app.innerHTML = `<section class="section gut view tn-order"><div class="wrap">${stepper}
      <p class="eyebrow">اختر باقتك</p><h1>${P0.n}</h1>
      <p class="lead">${plan === "all" ? "الباقة تشمل كل المسابقات الحالية، وكل مسابقة جديدة تنضاف لجهتك تلقائيًا." : plan === "one" ? "اختر المسابقة اللي تبيها لجهتك." : `اختر ${n(need)} مسابقات (${n(ORD.games.length)} من ${n(need)}).`}</p>
      <div class="ord-grid">${live.map(c => { const on = ORD.games.includes(c.go), dis = plan === "all" || (!on && full && plan !== "one");
        return `<button type="button" class="ord-pick${on ? " on" : ""}" data-pick="${c.go}" ${dis && plan === "all" ? "disabled" : ""} aria-pressed="${on}">
          <img src="shots/${c.go}.webp" alt="" loading="lazy"><span class="ord-pick-tx">${I(P[c.icon])}<b>${c.name}</b><small>${c.go === "er" ? (plan === "five" ? "+50 ريال" : plan === "one" ? "99 ريال" : "مشمولة") : plan === "one" ? "39 ريال" : "مشمولة"}</small></span><i class="ord-tick">${I(P.check)}</i></button>`; }).join("")}</div>
      ${summary}
      <p class="ac-err" id="ordErr" role="alert"></p>
      <div class="ord-acts"><a class="btn sec lg" href="#plans">رجوع للباقات</a><button type="button" class="btn lg" id="ordNext">التالي: بيانات الجهة</button></div>
    </div></section>`;
    $app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const g = b.dataset.pick; if (plan === "all") return;
      if (plan === "one") ORD.games = [g];
      else if (ORD.games.includes(g)) ORD.games = ORD.games.filter(x => x !== g);
      else if (ORD.games.length < P0.max) ORD.games = ORD.games.concat(g);
      const y = scrollY; tnOrder(plan, true); scrollTo({top:y}); });
    document.getElementById("ordNext").onclick = () => { const e = document.getElementById("ordErr");
      if (plan === "one" && ORD.games.length !== 1) return e.textContent = "اختر مسابقة.";
      if (plan === "five" && ORD.games.length !== Math.min(5, live.length)) return e.textContent = `اختر ${n(Math.min(5, live.length))} مسابقات.`;
      ORD.step = 2; tnOrder(plan, true); };
    return;
  }
  const f = ORD.f;
  $app.innerHTML = `<section class="section gut view tn-order"><div class="wrap">${stepper}
    <p class="eyebrow">${P0.n}</p><h1>بيانات الجهة</h1><p class="lead">نكمل طلبك ونتواصل معك عبر الواتساب.</p>
    ${summary}
    <form class="sj-box ord-form" id="ordF" novalidate>
      <label><span>اسم الجهة</span><input id="ofOrg" maxlength="80" value="${esc(f.org)}" placeholder="مثال: مدرسة الرواد" required></label>
      <label><span>اسم مقدّم الطلب</span><input id="ofPerson" maxlength="80" value="${esc(f.person)}" autocomplete="name" required></label>
      <label><span>رقم الجوال (واتساب)</span><input id="ofPhone" dir="ltr" inputmode="tel" autocomplete="tel" maxlength="20" value="${esc(f.phone)}" placeholder="05xxxxxxxx" required></label>
      <label><span>البريد الإلكتروني</span><input id="ofEmail" dir="ltr" type="email" autocomplete="email" maxlength="120" value="${esc(f.email)}" placeholder="name@example.com" required></label>
      <div class="ord-logo"><span>شعار الجهة</span>
        <label class="ss-logo ac-logo">${f.logo ? `<img src="${f.logo}" alt="شعار الجهة">` : `${I(P.ssimg)}<span>ارفع الشعار</span>`}<input type="file" accept="image/*" id="ofLogo" hidden></label>

      <p class="ac-err" id="ordErr" role="alert"></p>
      <div class="ord-acts"><button type="button" class="btn sec lg" id="ordBack">رجوع</button><button type="submit" class="btn lg" id="ordGo">إرسال الطلب</button></div>
    </form></div></section>`;
  const $ = id => document.getElementById(id);
  const keep = () => { f.org = $("ofOrg").value; f.person = $("ofPerson").value; f.phone = $("ofPhone").value; f.email = $("ofEmail").value; };
  $("ordBack").onclick = () => { keep(); ORD.step = 1; tnOrder(plan, true); };
  $("ofLogo").onchange = async ev => { const file = ev.target.files && ev.target.files[0]; if (!file) return; keep();
    try { const {url} = await ssShrink(file, 320, "image/png"); f.logo = url; } catch(x){} const y = scrollY; tnOrder(plan, true); scrollTo({top:y}); };
  const nl = $("ofNoLogo"); if (nl) nl.onclick = () => { keep(); f.logo = ""; const y = scrollY; tnOrder(plan, true); scrollTo({top:y}); };
  $("ordF").onsubmit = async ev => { ev.preventDefault(); keep(); const err = $("ordErr"); err.textContent = "";
    const phone = normPhone(f.phone), email = f.email.trim();
    if (f.org.trim().length < 2) return err.textContent = "اكتب اسم الجهة.";
    if (f.person.trim().length < 2) return err.textContent = "اكتب اسم مقدّم الطلب.";
    if (!/^\d{8,15}$/.test(phone)) return err.textContent = "رقم الجوال غير صحيح. مثال: 0512345678";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent = "البريد الإلكتروني غير صحيح.";
    if (!f.logo) return err.textContent = "ارفع شعار الجهة.";
    const go = $("ordGo"); go.disabled = true; go.textContent = "جارٍ الإرسال…";
    const payload = {plan, games:ORD.games, price:ordPrice(), org:f.org.trim(), person:f.person.trim(), phone, email, logo:f.logo};
    try {
      let r = "ok";
      if (window.TN && TN.order) r = await TN.order(payload);
      else { const all = store.get("tn-orders", []); all.unshift(Object.assign({id:Date.now(), at:new Date().toISOString(), status:"new"}, payload)); store.set("tn-orders", all); }
      if (r !== "ok") throw new Error(r);
      f.phone = toEnDigits(f.phone); ORD.sent = true; tnOrder(plan, true);
    } catch(x){ go.disabled = false; go.textContent = "إرسال الطلب";
      err.textContent = /phone/.test(x.message) ? "رقم الجوال غير صحيح." : /email/.test(x.message) ? "البريد الإلكتروني غير صحيح." : /logo/.test(x.message) ? "الشعار كبير، جرّب صورة أصغر." : "تعذّر إرسال الطلب الآن. حاول مرة ثانية."; }
  };
}

function route(){
  const h = (location.hash || "#start").slice(1);
  tnTrack(h);

  if (!h.startsWith("em")) emStop();
  if (!h.startsWith("mf")) mfStop();
  if (!h.startsWith("tkjoin")) tkCamStop();
  if (!/^er(play|join)/.test(h)) erStop();
  if (h !== "erhost") erHostStop();
  if (h === "admin"){ game = null;
    if (CAN_EDIT){ orgqLeave(); renderLinks("admin"); return admin(); }
    if (orgCanEdit()){ orgqEnter(); renderLinks("admin"); return admin(); }
    renderLinks(""); return acGate(); }
  orgqLeave();
  if (h === "accounts"){ game = null; renderLinks("accounts"); return acAdmin().then(tnFreeBox).then(tnInbox).then(tnReport); }
  if (/^(sj|b4|ss|mf|tk|em|er)$/.test(h) && fregNeed(h)){ game = null; renderLinks(""); return tnFreeReg(h); }
  if (!gameOk(tnCt(h)) && /^(sj|sjgame|b4|b4game|b4host|ss|ssgame|tk|tkplay|er|erhost|erplay|em|emplay|mf|mfplay)$/.test(h)){ game = null; renderLinks(""); return SESSION ? acNoGame(tnCt(h)) : acGate(); }
  if (h.startsWith("join")){ game = null; renderLinks(""); return joinPage(); }
  if (h === "em" || h === "emplay" || h.startsWith("emjoin")){ game = null; renderLinks("");
    if (h.startsWith("emjoin")) return emJoin();
    return h === "emplay" && EM ? emRender() : emSetup(); }
  if (h === "tk" || h === "tkplay" || h.startsWith("tkjoin")){ game = null; renderLinks("");
    if (!BANK.length){ $app.innerHTML = `<div class="empty gut">لا توجد أسئلة بعد.</div>`; return; }
    if (h.startsWith("tkjoin")) return tkJoin();
    return h === "tkplay" && TK ? tkRender() : tkSetup(); }
  if (h === "er" || h === "erhost" || h === "erplay" || h.startsWith("erjoin")){ game = null; renderLinks("");
    if (h.startsWith("erjoin")) return erJoin();
    if (h === "erhost") return erHost();
    if (h === "erplay") return erPractice();
    return erSetup(); }
  if (h === "mf" || h === "mfplay"){ game = null; renderLinks("");
    if (!BANK.length){ $app.innerHTML = `<div class="empty gut">لا توجد أسئلة بعد.</div>`; return; }
    return h === "mfplay" && MF ? mfRender() : mfSetup(); }
  if (h === "ss" || h === "ssgame"){ game = null; renderLinks("");
    return h === "ssgame" && SS ? ssRender() : ssSetup(); }
  if (h === "b4" || h === "b4game" || h.startsWith("b4host")){ game = null; renderLinks("");
    if (!BANK.length){ $app.innerHTML = `<div class="empty gut">لا توجد أسئلة بعد.</div>`; return; }
    if (h.startsWith("b4host")) return b4Host();
    return h === "b4game" && B4 ? b4Render() : b4Setup(); }
  if (h === "sj" || h === "sjgame"){ game = null; renderLinks("");
    if (!BANK.length){ $app.innerHTML = `<div class="empty gut">لا توجد أسئلة بعد.</div>`; return; }
    return h === "sjgame" && SJ ? (SJ.cur ? sjQuestion() : sjBoard()) : sjSetup(); }
  if (h === "" || h === "home" || h === "start"){ game = null; renderLinks("start"); landing(); return tnCounts(); }
  if (h === "contests" || h === "plans" || h === "login"){ game = null; renderLinks(h); landing(); tnJump(h); return tnCounts(); }
  if (h.startsWith("about-")){ game = null; renderLinks("contests"); return tnAbout(h.slice(6)); }
  if (h.startsWith("order-")){ game = null; renderLinks("plans"); return tnOrder(h.slice(6)); }
  if (h === "contact"){ game = null; renderLinks("contact"); return tnContact(); }
  if (!/^(cats|level|type|teams|play)$/.test(h)){ game = null; renderLinks(""); return tn404(); }
  renderLinks("cats");
  if (!BANK.length){ $app.innerHTML = `<div class="empty gut">لا توجد أسئلة بعد. أضفها من <a href="#admin">إدارة الأسئلة</a>.</div>`; return; }

async function acHash(salt, pw){

const acSalt = () => [...crypto.getRandomValues(new Uint8Array(12))].map(x => x.toString(16).padStart(2, "0")).join("");

async function acPinLogin(pin){

}
async function acSetPin(u, pw, pin){
  if (window.TN) return TN.setPin(u, pw, pin);
  const a = await acGet(u); if (!a || await acHash(a.salt, pw) !== a.hash) return "badpw";
  if ((await acList()).some(x => x.pin === pin && acKey(x.user) !== acKey(u))) return "taken";

}
const acGenPw = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; return [...crypto.getRandomValues(new Uint8Array(8))].map(x => a[x % a.length]).join(""); };
async function acGet(u){
  u = acKey(u); if (!u) return null;
  if (DB && window.TN && !REAL_ADMIN) return TN.profile(u);
  if (DB){ try { const d = await DB.doc("accounts/" + u).get(); return d.exists ? Object.assign({user:u}, d.data()) : null; } catch(e){ return null; } }
  const all = store.get("tn-accounts", {}); return all[u] ? Object.assign({user:u}, all[u]) : null;
}
async function acList(){
  if (DB){ try { const s = await DB.collection("accounts").get(); return s.docs.map(d => Object.assign({user:d.id}, d.data())); } catch(e){ return []; } }
  const all = store.get("tn-accounts", {}); return Object.keys(all).map(u => Object.assign({user:u}, all[u]));
}
async function acPut(a){

}
async function acDel(u){

/* Game: continuous, no score, team rotation */
let game = null;
/* Fair deal: questions go out in cycles of one question per team, and every
   question in a cycle shares the same category and difficulty. A bucket that
   can no longer serve every team is left out, so no team gets an odd one. */
function buildQueue(pool, teams, mixed){
  const buckets = {};
  shuffle(pool).forEach(q => (buckets[q.category + "|" + q.difficulty] = buckets[q.category + "|" + q.difficulty] || []).push(q));
  const out = []; let li = 0;
  for (;;){
    const ready = Object.keys(buckets).filter(k => buckets[k].length >= teams);
    if (!ready.length) break;
    let cand = ready;
    if (mixed){ const want = LEVELS[li % 3]; const same = ready.filter(k => k.endsWith("|" + want)); if (same.length) cand = same; li++; }
    const k = cand[Math.floor(Math.random() * cand.length)];
    out.push(...buckets[k].splice(0, teams));
  }
  return out;
}
function start(pool, ctx){
  const qs = buildQueue(pool, teamCount, ctx.mixed).map(q => { if (q.kind !== "mcq") return q;
    const order = shuffle(q.options.map((o,i) => i));
    return {...q, options: order.map(i => q.options[i]), ai: order.indexOf(q.ai)}; });
  game = { qs, i:0, teams:teamCount, ctx, shown:false };
  nav("play");
}
function play(){
  const g = game; if (g.i >= g.qs.length) return finished(true);
  const q = g.qs[g.i]; const team = (g.i % g.teams) + 1; g.shown = false;
  let area;
  if (q.kind === "mcq" || q.kind === "tf"){
    area = `<div class="choices ${q.kind==="tf"?"two":""}">${q.options.map((o,k) =>
      `<button class="choice" type="button" data-k="${k}"><span class="k">${KEYS[k]||k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else area = "";
  $app.innerHTML = `<section class="game gut view"><div class="wrap">
    <div class="gbar"><div class="turn"><small>الدور على</small><b>الفريق ${n(team)}</b><small>· الدورة ${n(Math.floor(g.i / g.teams) + 1)}</small></div>
      <button class="end" type="button" id="end">إنهاء اللعبة</button></div>
    <div class="teams" id="teamStrip" aria-hidden="true">${Array.from({length:g.teams},(_,k) => `<span class="${k+1===team?"now":""}">${n(k+1)}</span>`).join("")}</div>
    <article class="card">
      <div class="meta-row"><span>${esc(g.ctx.label)}</span>${q.difficulty && !g.ctx.label.includes(q.difficulty)?`<span class="lvl-${esc(q.difficulty)}">${esc(q.difficulty)}</span>`:""}${g.ctx.multiCat?`<span>${esc(q.category)}</span>`:""}</div>
      <p class="qtext">${esc(q.question)}</p>
      ${area}
      <div id="ans"></div>
      <div class="actions"><span class="count">السؤال ${n(g.i+1)} · المتبقي ${n(g.qs.length - g.i - 1)}${team === g.teams ? " · آخر سؤال في الدورة" : ""}</span>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn sec" type="button" id="show">إظهار الإجابة</button>
          <button class="btn" type="button" id="next">السؤال التالي</button></div></div>
    </article>
    <p class="hint">مفاتيح سريعة: المسافة لإظهار الإجابة، والسهم ← للسؤال التالي</p>
  </div></section>`;
  const now = document.querySelector("#teamStrip .now"); if (now) now.scrollIntoView({inline:"center",block:"nearest"});
  document.getElementById("end").onclick = () => finished(false);
  document.getElementById("show").onclick = reveal;
  document.getElementById("next").onclick = next;
  $app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => reveal(+b.dataset.k));
}
function reveal(picked){
  const g = game, q = g.qs[g.i]; if (g.shown) return; g.shown = true;
  if (q.kind === "mcq" || q.kind === "tf"){
    $app.querySelectorAll("[data-k]").forEach(b => { const j = +b.dataset.k; b.disabled = true;
      if (j === q.ai) b.classList.add("correct"); else if (j === picked) b.classList.add("wrong"); else b.classList.add("dim"); });
  } else {
    document.getElementById("ans").innerHTML = `<div class="answer"><small>الإجابة</small><b>${esc(q.answerText)}</b></div>`;
  }
  const extra = [q.explanation && esc(q.explanation), q.source && `<span class="src">المصدر: ${esc(q.source)}</span>`].filter(Boolean).join("");
  if (extra) document.getElementById("ans").insertAdjacentHTML("beforeend", `<div class="note">${extra}</div>`);
  const s = document.getElementById("show"); s.disabled = true;
  document.getElementById("next").focus({preventScroll:true});
}
function next(){ game.i++; play(); window.scrollTo({top:0,behavior:"smooth"}); }
function finished(all){
  const g = game; const asked = Math.min(g.i + (g.shown ? 1 : 0), g.qs.length) || g.i;
  const ctx = g.ctx; game = null;
  history.replaceState(null, "", "#cats");
  renderLinks("");
  $app.innerHTML = `<section class="done gut view"><div class="wrap">${I(P.check)}
    <h1>${all ? "انتهت أسئلة هذه الجولة." : "انتهت اللعبة."}</h1>

      <button class="btn sec" type="button" id="toHome">تغيير الاختيارات</button></div></div></section>`;
  document.getElementById("again").onclick = () => nav("teams");
  document.getElementById("toHome").onclick = () => nav("cats");
  window.scrollTo({top:0});
}
/* ================= Contest: سين جيم =================
   Teams (⁦2–4⁩) each bring ⁦1–3⁩ categories to a shared board. Each category holds
   3 or 6 questions worth 200 / 400 / 600 by difficulty. Teams take turns picking
   a category and a value; the picking team answers first, then the others in
   order. After the answer is shown, the host gives the points to the team that

  {id:"consult", name:"استشارة",        desc:"يستشير الفريق أحد الحضور قبل أن يجيب."},
  {id:"second",  name:"فرصة ثانية",     desc:"إذا أخطأ الفريق يجيب مرة ثانية قبل الفريق التالي."},
];

const sjPool = (cat, lvl, kind) => BANK.filter(q => q.category === cat && q.difficulty === lvl && q.kind === kind);
const sjAvail = cat => LEVELS.every(l => sjPool(cat, l, sjCfg.kind).length >= sjCfg.perCat / 3);
function sjPrep(q){ if (q.kind !== "mcq") return {...q};
  const order = shuffle(q.options.map((o,i) => i)); return {...q, options: order.map(i => q.options[i]), ai: order.indexOf(q.ai)}; }

    if (!cats.includes(c) || seen.has(c) || !sjAvail(c)) return false; seen.add(c); return true; }).slice(0, sjCfg.perTeam));
  while (sjCfg.names.length < 4) sjCfg.names.push("");
  if (sjCfg.tab >= sjCfg.teams) sjCfg.tab = 0;
}

/* ---------- geometry: h[r*N+c] r 0..N, v[r*(N+1)+c] c 0..N ---------- */
const b4Sides = (g, s) => { const N = g.N, r = Math.floor(s / N), c = s % N;
  return [["h", r * N + c], ["h", (r + 1) * N + c], ["v", r * (N + 1) + c], ["v", r * (N + 1) + c + 1]]; };
const b4Squares = (g, t, i) => { const N = g.N, out = [];
  if (t === "h"){ const r = Math.floor(i / N), c = i % N; if (r > 0) out.push((r - 1) * N + c); if (r < N) out.push(r * N + c); }
  else { const r = Math.floor(i / (N + 1)), c = i % (N + 1); if (c > 0) out.push(r * N + c - 1); if (c < N) out.push(r * N + c); }
  return out; };
const b4Closed = (g, s) => b4Sides(g, s).every(([t,i]) => g[t][i] >= 0);
const b4Count = (g, team) => g.owner.filter(o => o === team).length;
function b4Snap(){ const s = JSON.parse(JSON.stringify(B4)); delete s.hist; B4.hist.push(s); if (B4.hist.length > 30) B4.hist.shift(); }
function b4Draw(t, i, team){
  const g = B4; g[t][i] = team;
  const closed = b4Squares(g, t, i).filter(s => g.owner[s] < 0 && b4Closed(g, s));
  let pts = 10;
  if (closed.length){ pts = 0; closed.forEach(s => { g.owner[s] = team; pts += g.gold.includes(s) ? 40 : 20; }); }
  g.scores[team] += pts;
  g.msg = `${g.names[team]} +${pts}` + (closed.length ? (closed.length === 1 ? " · أقفل مربعًا" : " · أقفل مربعين") : "");
}
function b4Unlock(t, i){
  const g = B4;
  b4Squares(g, t, i).forEach(s => { if (g.owner[s] >= 0){ g.scores[g.owner[s]] -= g.gold.includes(s) ? 40 : 20; g.owner[s] = -1; } });
  g[t][i] = -1; g.msg = "فُكّ الضلع";
}
function b4EndTurn(){
  const g = B4; g.sel = null; g.q = null; g.cardUsed = false;
  if (g.owner.every(o => o >= 0)){ g.phase = "round"; b4Save(); return b4Render(); }
  if (g.extra) g.extra = false; else g.turn = (g.turn + 1) % g.T;
  g.phase = "pick"; b4Save(); b4Render();
}
function b4Ask(s){
  const g = B4, L = g.letters[s], hard = g.gold.includes(s);
  let pool = b4For(L, hard).filter(q => !g.used.includes(q.id));
  if (!pool.length) pool = b4For(L, hard);
  const q = pool[Math.floor(Math.random() * pool.length)];
  g.used.push(q.id); g.sel = s; g.q = q; g.phase = "question"; g.shown = false; g.left = g.time;
  b4Save(); b4Render();
}
/* ---------- timer ---------- */
function b4Beep(f, d){ try { b4Audio = b4Audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = b4Audio.createOscillator(), v = b4Audio.createGain(); o.frequency.value = f; o.connect(v); v.connect(b4Audio.destination);
  v.gain.setValueAtTime(.18, b4Audio.currentTime); v.gain.exponentialRampToValueAtTime(.001, b4Audio.currentTime + d); o.start(); o.stop(b4Audio.currentTime + d); } catch(e){} }
function b4StopTimer(){ if (b4Timer){ clearInterval(b4Timer); b4Timer = null; } }
function b4StartTimer(){
  b4StopTimer();
  b4Timer = setInterval(() => { const g = B4; if (!g || g.phase !== "question"){ b4StopTimer(); return; }
    g.left = Math.max(0, g.left - 1); b4Tick();
    if (g.left > 0 && g.left <= 5) b4Beep(880, .12);
    if (g.left === 0){ b4Beep(440, .7); b4StopTimer(); }
  }, 1000);
}
function b4Tick(){
  const g = B4, el = document.getElementById("b4clock"); if (!el) return;
  const frac = g.left / g.time, C = 2 * Math.PI * 44;
  el.classList.toggle("warn", g.left <= 5);
  el.querySelector(".arc").style.strokeDashoffset = String(C * (1 - frac));
  el.querySelector("b").textContent = g.left ? g.left : "انتهى";
}
/* ---------- rendering ---------- */
function b4BoardHTML(mode){
  const g = B4, N = g.N, cells = [];
  const span = (r, c) => `grid-row:${r + 1};grid-column:${c + 1}`;
  for (let r = 0; r <= 2 * N; r++) for (let c = 0; c <= 2 * N; c++){
    const er = r % 2 === 0, ec = c % 2 === 0;
    if (er && ec){ cells.push(`<i class="b4-dot" style="${span(r,c)}"></i>`); continue; }
    if (er || ec){
      const t = er ? "h" : "v", i = er ? (r / 2) * N + (c - 1) / 2 : ((r - 1) / 2) * (N + 1) + c / 2, who = g[t][i];
      const near = b4Squares(g, t, i);
      const can = mode === "edge" ? who < 0 && near.includes(g.sel) : mode === "free" ? who < 0 : mode === "unlock" ? who >= 0 : false;
      cells.push(`<button type="button" class="b4-e ${t} ${who >= 0 ? "on" : ""} ${can ? "can" : ""}" style="${span(r,c)};${who >= 0 ? "--tc:" + B4_COL[who] : ""}" ${can ? `data-b4e="${t}${i}"` : "disabled"} aria-label="ضلع"><span></span></button>`);
      continue;
    }
    const s = ((r - 1) / 2) * N + (c - 1) / 2, own = g.owner[s], gold = g.gold.includes(s), pick = mode === "pick" && own < 0;
    cells.push(`<button type="button" class="b4-sq ${gold ? "gold" : ""} ${own >= 0 ? "own" : ""} ${g.sel === s ? "sel" : ""}" style="${span(r,c)};${own >= 0 ? "--tc:" + B4_COL[own] : ""}" ${pick ? `data-b4sq="${s}"` : "disabled"} aria-label="حرف ${g.letters[s]}${gold ? " ذهبي" : ""}">
      <b>${g.letters[s]}</b>${own >= 0 ? `<small>${esc(g.names[own])}</small>` : gold ? `<small>40</small>` : ""}</button>`);
  }
  return `<div class="b4-board" style="--n:${N}">${cells.join("")}</div>`;
}
function b4Side(){
  const g = B4;
  return `<div class="b4-teams">${g.names.map((t,i) => `<div class="b4-team ${i === g.turn && g.phase !== "round" ? "now" : ""}" style="--tc:${B4_COL[i]}">
    <div class="b4-tn"><b>${esc(t)}</b>${i === g.turn && g.phase !== "round" ? `<em>الدور</em>` : ""}</div>
    <div class="b4-ts"><strong>${g.scores[i]}</strong><span>نقطة</span></div>
    <div class="b4-tm"><span>المربعات ${b4Count(g, i)}</span><span>الجولات ${g.wins[i]}</span><span>كروت الحظ ${g.cards[i]}</span></div></div>`).join("")}</div>`;
}
function b4Render(){
  const g = B4; if (!g) return b4Setup();
  if (g.phase !== "question") b4StopTimer();
  if (g.phase === "round") return b4Round();
  const me = g.turn, col = B4_COL[me];
  let prompt = "", tools = "";
  if (g.phase === "pick"){
    prompt = `الدور على <b style="color:${col}">${esc(g.names[me])}</b>: اختر مربعًا`;
    tools = `<button class="mini" type="button" id="b4Card" ${g.cards[me] && !g.cardUsed ? "" : "disabled"}>${I(P.sjcard)}كرت حظ (${g.cards[me]})</button>
      <button class="mini" type="button" id="b4Skip">${I(P.sjskip)}تخطي الدور</button>`;
  } else if (g.phase === "edge"){
    prompt = `<b style="color:${B4_COL[g.answerer]}">${esc(g.names[g.answerer])}</b> يرسم ضلعًا من مربع «${g.letters[g.sel]}»`;
  } else if (g.phase === "free"){
    prompt = `ضلع مجاني: <b style="color:${col}">${esc(g.names[me])}</b> يرسم أي ضلع`;
  } else if (g.phase === "unlock"){
    prompt = `فك مربع: <b style="color:${col}">${esc(g.names[me])}</b> يختار ضلعًا مرسومًا لحذفه`;
  }
  $app.innerHTML = `<section class="b4 gut view"><div class="wrap">
    <div class="b4-top"><div class="b4-title"><b>بالأربع تربح</b><span>الجولة ${n(g.round)}</span></div>
      <div class="b4-acts"><button class="mini" type="button" id="b4Undo" ${g.hist.length ? "" : "disabled"}>${I(P.sjundo)}تراجع</button>
        <button class="mini" type="button" id="b4Host">${I(P.sjhost)}ورقة الملقي</button>
        <button class="mini" type="button" id="b4Full">${I(P.sjfull)}ملء الشاشة</button>
        <button class="mini" type="button" id="b4Menu">${I(P.sjgear)}الإعدادات</button>
        <button class="mini" type="button" id="b4End">إنهاء المسابقة</button></div></div>
    <div class="b4-main">
      <div class="b4-left">${b4BoardHTML(g.phase)}</div>
      <aside class="b4-right">
        <div class="b4-prompt"><span>${prompt}</span>${g.extra ? `<small>معه دور إضافي</small>` : ""}${g.msg ? `<span class="b4-msg">${esc(g.msg)}</span>` : ""}</div>
        ${tools ? `<div class="b4-tools">${tools}</div>` : ""}
        ${b4Side()}
      </aside>
    </div>
    ${g.phase === "question" ? b4QHTML() : ""}
    ${g.card ? b4CardHTML() : ""}
  </div></section>`;
  b4Bind();
  if (g.phase === "question"){ b4Tick(); if (!g.shown && g.left > 0) b4StartTimer(); }
}
function b4QHTML(){

      <div class="b4-clock" id="b4clock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="arc" style="stroke-dasharray:${C};stroke-dashoffset:0"/></svg><b></b></div></div>

}
function b4CardHTML(){
  const g = B4, c = B4_CARDS[g.card], me = g.turn;

}
function b4Bind(){
  const g = B4, $ = id => document.getElementById(id);

  $app.querySelectorAll("[data-b4e]").forEach(b => b.onclick = () => {
    const t = b.dataset.b4e[0], i = +b.dataset.b4e.slice(1);
    if (g.phase === "edge"){ b4Draw(t, i, g.answerer); return b4EndTurn(); }
    b4Snap();
    if (g.phase === "free"){ b4Draw(t, i, g.turn); if (g.owner.every(o => o >= 0)){ g.phase = "round"; b4Save(); return b4Render(); } }
    else if (g.phase === "unlock") b4Unlock(t, i);
    g.phase = "pick"; b4Save(); b4Render(); });

    g.answerer = w; g.q = null; g.phase = "edge"; g.msg = "";
    const free = b4Sides(g, g.sel).filter(([t,i]) => g[t][i] < 0);
    if (free.length === 1){ b4Draw(free[0][0], free[0][1], w); return b4EndTurn(); }
    b4Save(); b4Render(); });

  if ($("b4Card")) $("b4Card").onclick = () => { b4Snap(); g.cards[g.turn]--; g.cardUsed = true;
    const opts = Object.keys(B4_CARDS).filter(k => k !== "unlock" || g.h.concat(g.v).some(x => x >= 0)).filter(k => k !== "free" || g.h.concat(g.v).some(x => x < 0));
    g.card = opts[Math.floor(Math.random() * opts.length)]; b4Save(); b4Render(); };
  if ($("b4CardOk")) $("b4CardOk").onclick = () => { const c = g.card; g.card = null;
    if (c === "extra"){ g.extra = true; g.msg = "دور إضافي"; } else g.phase = c; b4Save(); b4Render(); };
  $app.querySelectorAll("[data-b4minus]").forEach(b => b.onclick = () => { const t = +b.dataset.b4minus; g.scores[t] -= 20; g.card = null; g.msg = `خُصمت 20 نقطة من ${g.names[t]}`; b4Save(); b4Render(); });
  if ($("b4Skip")) $("b4Skip").onclick = () => { b4Snap(); g.msg = "تخطى الدور"; g.extra = false; b4EndTurn(); };

      <p>امسح الرمز بجوال الملقي ليظهر عنده السؤال الحالي وإجابته أولًا بأول.</p>

  b4Wire();

function b4Round(){

  if (!decided && top.length > 1){
    const L = shuffle(LETTERS)[0], pool = b4Bank().filter(q => q.hard && !g.used.includes(q.id));
    g.tieQ = g.tieQ || pool[Math.floor(Math.random() * pool.length)] || null; b4Save();
    tie = `<div class="b4-tie"><p><b>تعادل في الصدارة.</b> اطرح سؤال الحسم، ثم اختر الفريق الذي أجاب أولًا.</p>

      <div class="b4-qb">${top.map(i => `<button class="btn" type="button" data-b4rw="${i}" style="background:${B4_COL[i]}">${esc(g.names[i])}</button>`).join("")}</div></div>`;

    <h1>${w != null ? `${esc(g.names[w])} يفوز بالجولة ${n(g.round)}` : `انتهت الجولة ${n(g.round)}`}</h1>
    <p>كل المربعات أُقفلت</p>
    <ol class="sj-rank">${rank.map((r,k) => `<li style="--tc:${B4_COL[r.i]}"><i>${k+1}</i><b>${esc(r.t)}</b><small style="color:var(--muted)">المربعات ${b4Count(g, r.i)} · الجولات ${g.wins[r.i]}</small><span>${r.s}</span></li>`).join("")}</ol>
    ${tie}
    ${w != null ? `<div class="cta" style="margin-top:28px"><button class="btn" type="button" id="b4Next">جولة جديدة</button><button class="btn sec" type="button" id="b4Final">إنهاء المسابقة</button></div>` : ""}
  </div></section>`;
  $app.querySelectorAll("[data-b4rw]").forEach(b => b.onclick = () => { const i = +b.dataset.b4rw; g.roundWinner = i; g.wins[i]++; b4Save(); b4Round(); });

    B4 = Object.assign(g, b4Board(g.N), { scores: Array(g.T).fill(0), round: g.round + 1, starter, turn: starter, phase:"pick", sel:null, q:null,

  const fin = document.getElementById("b4Final"); if (fin) fin.onclick = b4Final;
  window.scrollTo({top:0});
}
function b4Final(){
  const g = B4, best = Math.max(...g.wins), top = g.wins.map((s,i) => s === best ? i : -1).filter(i => i >= 0);
  B4 = null; b4Save(); history.replaceState(null, "", "#b4");

    <p>${n(g.round)} ${g.round === 1 ? "جولة" : "جولات"}</p>
    <ol class="sj-rank">${rank.map((r,k) => `<li style="--tc:${B4_COL[r.i]}"><i>${k+1}</i><b>${esc(r.t)}</b><span>${r.w}</span></li>`).join("")}</ol>

/* ---------- host sheet ---------- */

  $app.innerHTML = `<section class="section gut view"><div class="wrap b4-host">

      <div class="b4-acts"><button class="mini" type="button" id="b4Print">${I(P.sjprint)}طباعة</button><button class="mini" type="button" id="b4Back">العودة للمسابقة</button></div></div>

    <div id="b4list"></div>
  </div></section>`;
  const draw = () => { const f = document.getElementById("b4find").value.trim();

   A photo starts fully blurred; every correct answer to the host's spoken

function ssDB(){ return new Promise((res) => { try { const r = indexedDB.open("tanafus-66", 1);

async function ssStoreImgs(){ const db = await ssDB(); if (!db) return;

function ssShrink(file, max, type){ return new Promise((res, rej) => { const fr = new FileReader();

    const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);

function ssColors(canvas){

    const mx = Math.max(r,g,b), mn = Math.min(r,g,b); if (mx - mn < 40 || mx < 50 || mn > 225) continue;
    const k = (r >> 5) + "," + (g >> 5) + "," + (b >> 5); const e = bins[k] = bins[k] || {n:0, r:0, g:0, b:0}; e.n++; e.r += r; e.g += g; e.b += b; }
  const top = Object.values(bins).sort((a,b) => b.n - a.n).map(e => [e.r / e.n, e.g / e.n, e.b / e.n].map(Math.round));
  const hex = c => "#" + c.map(x => x.toString(16).padStart(2, "0")).join("");
  const far = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) > 120;

function ssPass(){

  let nx = g.turn; do { nx = (nx + 1) % g.n; } while (g.t[nx].done);

function ssNextImg(team, pts, how){

function ssAct(a){
  const g = SS, me = g.turn, x = g.t[me];
  if (g.over || x.done) return;
  ssSnap(); g.show = null;
  if (a === "right"){
    x.rev = Math.min(100, x.rev + 10);
    if (x.rev >= 100){ ssNextImg(me, 0, "full"); ssPass(); }
    else if ((x.rev / 10) % g.k === 0) g.open = true;
    else ssPass();
  } else if (a === "wrong") ssPass();
  else if (a === "gright"){ ssNextImg(me, 100 - x.rev, "guess"); ssPass(); }
  else if (a === "gwrong"){ if (g.pen) x.score -= 10; ssPass(); }

}

/* ================= Contest: تكبيس =================
   The host screen runs the game. Players open the same page on their phones
   (#tkjoin), pick a team and tap a big button during short tap windows.
   Phones report their own tap count in room presence (any viewer may set
   presence); the host sums the counts of each team's first N devices.
   The host broadcasts the game state on an admin-only room topic, re-sent
   every two seconds so late joiners catch up.
   Turn of team T: T's phones tap for D seconds; the total is the question's
   value; correct = +taps, wrong = −taps. After every team has had a turn, all
   teams tap together; most taps answers the round question (tie = tap again).
   Without phones (or for testing) each team also has an on-screen pad and a
   keyboard key on the host screen. */
const TK_COL = ["var(--c5)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c6)"];
const TK_KEYS = ["a","l","q","p","z","m"];
const tkDefName = i => "الفريق " + ["الأول","الثاني","الثالث","الرابع","الخامس","السادس"][i];
let tkCfg = Object.assign({teams:4, names:["","","","","",""], dev:5, dur:5, rounds:5, level:"*", cats:[]}, store.get("tk-cfg", {}));
let TK = store.get("tk-game", null);
if (TK && !(TK.scores && TK.names)) TK = null;
let ROOM = null, tkRoomTried = false, tkBeat = null, tkWinTimer = null, tkTick = null;
let tkLocal = {};                 // host on-screen pad taps for the open window: {team: n}
const tkFirstSeen = {};           // peer -> first time seen (device order per team)
const tkSaveCfg = () => store.set("tk-cfg", tkCfg);
const tkSave = () => { if (TK){ const s = Object.assign({}, TK); delete s.hist; store.set("tk-game", Object.assign(s, {hist: (TK.hist || []).slice(-30)})); } else store.set("tk-game", null); };

async function tkRoom(){ if (!tkRoomTried){ tkRoomTried = true; ROOM = await useCap("room");
  if (ROOM){ ROOM.onPeers(() => { if (location.hash === "#tkplay" && TK) tkLive(); }, () => {}); } } return ROOM; }
function tkTidy(){
  tkCfg.teams = Math.min(6, Math.max(2, +tkCfg.teams || 4));
  tkCfg.dev = Math.min(20, Math.max(1, +tkCfg.dev || 5));
  tkCfg.dur = [3,5,7,10].includes(+tkCfg.dur) ? +tkCfg.dur : 5;
  tkCfg.rounds = [3,5,10,0].includes(+tkCfg.rounds) ? +tkCfg.rounds : 5;
  if (!["*", ...LEVELS].includes(tkCfg.level)) tkCfg.level = "*";
  const cats = allCats(); tkCfg.cats = (tkCfg.cats || []).filter(c => cats.includes(c));
  while (tkCfg.names.length < 6) tkCfg.names.push("");
}
const tkPool = () => BANK.filter(q => q.kind === "open" && (!tkCfg.cats.length || tkCfg.cats.includes(q.category)) && (tkCfg.level === "*" || q.difficulty === tkCfg.level));
/* ---------- devices: who counts for which team ---------- */
function tkDevices(){
  const by = {}; if (!ROOM || !TK) return by;
  ROOM.peers().forEach(p => { const t = p.presence && p.presence.tk; if (!t || p.sameTab || !Number.isInteger(t.team) || t.team < 0 || t.team >= TK.names.length) return;
    tkFirstSeen[p.peer] = tkFirstSeen[p.peer] || Date.now(); (by[t.team] = by[t.team] || []).push(p); });
  Object.keys(by).forEach(k => by[k] = by[k].sort((a,b) => tkFirstSeen[a.peer] - tkFirstSeen[b.peer]).slice(0, TK.dev));
  return by;
}
function tkCounts(){
  const by = tkDevices(), w = TK.win, out = {};
  if (!w) return out;
  w.teams.forEach(t => { let s = tkLocal[t] || 0;
    (by[t] || []).forEach(p => { const x = p.presence.tk; if (x.win === w.id) s += Math.max(0, +x.taps || 0); });
    out[t] = s; });

}
function tkBroadcast(){
  if (!ROOM || !TK) return;

  Object.keys(by).forEach(t => by[t].forEach(p => acc[p.peer] = +t));
  const w = TK.win;
  ROOM.emit("tk.state", { game: TK.id, names: TK.names, acc, win: w ? {id:w.id, teams:w.teams, dur:TK.dur, open: TK.phase === "tap" || TK.phase === "rtap"} : null,
    msg: TK.phase === "q" || TK.phase === "rq" ? `يجيب ${TK.names[TK.ans]}` : "",
    code: TK.code, orient: dispGet("tk").player, phase: TK.phase, turn: TK.turn, ans: TK.ans, val: TK.val, round: TK.round, rounds: TK.rounds, dev: TK.dev, scores: TK.scores,
    teamTaps: TK.win ? null : TK.taps }).catch(() => {});
}

function tkNextQ(){
  const pool = tkPool().filter(q => !TK.used.includes(q.id)), all = tkPool();
  const q = (pool.length ? pool : all)[Math.floor(Math.random() * (pool.length ? pool.length : all.length))];
  if (q) TK.used.push(q.id); return q ? {id:q.id, question:q.question, answer:q.answerText, category:q.category, level:q.difficulty} : null;

function tkOpen(teams, phase){

/* ================= Contest: غرفة الهروب (escape room) =================
   Three story rooms played as a journey (room 1 easiest → room 3 hardest).
   Each room has six puzzle stations; every solved station reveals one digit
   of the chest's six-digit code. Some stations are locked until an item
   (key, lens, access card) is found at another station. Optional knowledge
   boxes ask an encyclopedia question and give an extra hint.
   Puzzles are generated from a seed, so every team (and every device of a
   team) gets the same puzzles and the race is fair. Difficulty level of a
   puzzle = base level (سهل 0 / متوسط 1 / صعب 2) + room index (0..2). */

const erTiles = (arr, ask) => `<div class="er-seq">${arr.map(v => `<span>${v}</span>`).join("<i>←</i>")}${ask ? `<i>←</i><span class="q">؟</span>` : ""}</div>`;

  clock(R, lv){

  map(R, lv){

  abjad(R, lv){

  gates(R, lv){

  deduce(R, lv){
    const N = lv <= 2 ? 4 : 5, NAMES = ["الحمراء","الزرقاء","الخضراء","الصفراء","البنفسجية"].slice(0, N), COLS = ["#E0413A","#0071E3","#248A3D","#E8B100","#8944AB"];
    const perms = []; const gen = (a, rest) => { if (!rest.length) return perms.push(a); rest.forEach((x,i) => gen(a.concat(x), rest.filter((_,j) => j !== i))); }; gen([], NAMES.map((_,i) => i));
    const sol = erPick(R, perms); // sol[pos] = item
    const posOf = (p, it) => p.indexOf(it);
    const mkClue = () => { const a = erRi(R,0,N-1); let b = erRi(R,0,N-1); while (b === a) b = erRi(R,0,N-1);
      const pa = posOf(sol,a), pb = posOf(sol,b), t = erRi(R,0, lv >= 4 ? 6 : 7);
      if (t === 0 && pa === pb + 1) return {f:p => posOf(p,a) === posOf(p,b) + 1, s:`العيّنة ${NAMES[a]} في الخزانة التي تلي خزانة ${NAMES[b]} مباشرة.`};
      if (t === 1) return pa < pb ? {f:p => posOf(p,a) < posOf(p,b), s:`رقم خزانة ${NAMES[a]} أصغر من رقم خزانة ${NAMES[b]}.`} : {f:p => posOf(p,a) > posOf(p,b), s:`رقم خزانة ${NAMES[a]} أكبر من رقم خزانة ${NAMES[b]}.`};
      if (t === 2) return Math.abs(pa-pb) === 1 ? {f:p => Math.abs(posOf(p,a)-posOf(p,b)) === 1, s:`العيّنتان ${NAMES[a]} و${NAMES[b]} في خزانتين متجاورتين.`} : {f:p => Math.abs(posOf(p,a)-posOf(p,b)) !== 1, s:`العيّنتان ${NAMES[a]} و${NAMES[b]} ليستا في خزانتين متجاورتين.`};
      if (t === 3 && pa > 0 && pa < N-1) return {f:p => posOf(p,a) > 0 && posOf(p,a) < N-1, s:`العيّنة ${NAMES[a]} ليست في الخزانة الأولى ولا الأخيرة.`};
      if (t === 4) return (pa+1) % 2 === 0 ? {f:p => (posOf(p,a)+1) % 2 === 0, s:`رقم خزانة ${NAMES[a]} زوجي.`} : {f:p => (posOf(p,a)+1) % 2 === 1, s:`رقم خزانة ${NAMES[a]} فردي.`};
      if (t === 5){ const k = erRi(R,0,N-1); if (k !== pa) return {f:p => posOf(p,a) !== k, s:`العيّنة ${NAMES[a]} ليست في الخزانة ${k+1}.`}; }
      if (t === 6 && Math.abs(pa-pb) >= 2) return {f:p => Math.abs(posOf(p,a)-posOf(p,b)) === Math.abs(pa-pb), s:`بين خزانتي ${NAMES[a]} و${NAMES[b]} ${Math.abs(pa-pb)-1 === 1 ? "خزانة واحدة" : (Math.abs(pa-pb)-1) + " خزانات"} بالضبط.`};
      if (t === 7) return {f:p => posOf(p,a) === pa, s:`العيّنة ${NAMES[a]} في الخزانة ${pa+1}.`, pos:a};
      return null; };
    let clues = [], cand = perms;
    for (let g = 0; g < 400 && cand.length > 1; g++){ const c = mkClue(); if (!c) continue; const nc = cand.filter(c.f); if (nc.length < cand.length){ clues.push(c); cand = nc; } }
    for (let i = clues.length - 1; i >= 0; i--){ const rest = clues.filter((_,j) => j !== i); if (perms.filter(p => rest.every(c => c.f(p))).length === 1) clues = rest; }
    const given = new Set(clues.filter(c => c.pos != null).map(c => c.pos));
    let ask = erRi(R,0,N-1); for (let k = 0; k < N && given.has(ask); k++) ask = (ask + 1) % N;
    const v = posOf(sol, ask) + 1;
    return { title:"خزائن العيّنات", html:`<p>${N === 4 ? "أربع" : "خمس"} عيّنات ملوّنة موزّعة على ${N === 4 ? "أربع" : "خمس"} خزائن مرقّمة من 1 إلى ${N}، في كل خزانة عيّنة واحدة.</p><ol class="er-steps">${erShuf(R, clues).map(c => `<li>${c.s}</li>`).join("")}</ol>
      <div class="er-lockers">${Array.from({length:N},(_,i) => `<span>${i+1}</span>`).join("")}</div><p>في أي خزانة العيّنة <b style="color:${COLS[ask]}">${NAMES[ask]}</b>؟</p>`,

  paths(R, lv){

    blocked.forEach(k => { const [x,y] = k.split(",").map(Number); svg += `<g stroke="#D70015" stroke-width="4" stroke-linecap="round"><line x1="${X(x)-9}" y1="${Y(y)-9}" x2="${X(x)+9}" y2="${Y(y)+9}"/><line x1="${X(x)+9}" y1="${Y(y)-9}" x2="${X(x)-9}" y2="${Y(y)+9}"/></g>`; });

      ans:{type:"num", v}, hints:["اكتبوا عند كل تقاطع عدد الطرق التي توصل إليه، بدءًا من النقطة الخضراء.", "عدد الطرق إلى أي تقاطع = طرق التقاطع الذي تحته + طرق التقاطع الذي على يساره (والمعطّل = 0)."], why:`عدد المسارات ${v}.` };
  },

  magic(R, lv){
    let g = [[2,7,6],[9,5,1],[4,3,8]];
    const rot = m => m[0].map((_,i) => m.map(r => r[i]).reverse());

    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const solvable = h => { const kn = new Set([...Array(9).keys()].filter(i => !h.has(i))); let ch = true; while (ch){ ch = false; for (const L of lines){ const u = L.filter(i => !kn.has(i)); if (u.length === 1){ kn.add(u[0]); ch = true; } } } return kn.size === 9; };
    const order = erShuf(R, [...Array(9).keys()]); let last = -1;

    else if (k === "ok"){ [[262,"a"],[330,"a"],[392,"a"]].forEach(([f, vw], j) => this.voice(f, .9, vw, .09, j * .08)); this.voice(523, 1.0, "o", .06, .3); }
    else if (k === "bad"){ this.voice(220, .28, "u", .12, 0); this.voice(165, .5, "u", .12, .26, 147); }
    else if (k === "hint"){ this.voice(392, .5, "m", .08, 0, 440); this.voice(494, .6, "m", .06, .18); }

    else if (k === "item"){ this.voice(392, .7, "o", .08, 0); this.voice(494, .7, "o", .07, .14); this.voice(587, .8, "a", .07, .28); }

    else if (k === "tick") this.click(.22, 0, 3200);

};

/* ---------- configuration ---------- */

let erCfg = Object.assign({mode:"race", teams:4, names:Array(10).fill(""), dev:6, base:1, mins:20, hints:3, hc:60, pen:30, rooms:3, know:true, cats:[]}, store.get("er-cfg", {}));

const erName = i => (erCfg.names[i] || "").trim() || erDefName(i);
function erTidy(){
  const c = erCfg; c.mode = c.mode === "coop" ? "coop" : "race"; c.teams = Math.min(10, Math.max(2, +c.teams || 4)); c.dev = Math.min(10, Math.max(5, +c.dev || 6));
  c.base = [0,1,2].includes(+c.base) ? +c.base : 1; c.mins = [10,15,20,30,45].includes(+c.mins) ? +c.mins : 20; c.hints = Math.min(5, Math.max(0, +c.hints)); if (isNaN(c.hints)) c.hints = 3;
  c.hc = [30,60,120].includes(+c.hc) ? +c.hc : 60; c.pen = [0,15,30,60].includes(+c.pen) ? +c.pen : 30; c.pick = erPickOf(c); c.rooms = c.pick.length; c.know = c.know !== false;

/* TN-ERPICK: the host picks which rooms to play (any of the three, played in story order).

const erPickOf = G => { const p = Array.isArray(G.pick) ? [...new Set(G.pick.map(Number))].filter(i => i === 0 || i === 1 || i === 2).sort() : [];
  return p.length ? p : [0, 1, 2].slice(0, [1, 2, 3].includes(+G.rooms) ? +G.rooms : 3); };
const erPrev = (G, r) => { const pk = erPickOf(G), i = pk.indexOf(r); return i > 0 ? pk[i - 1] : -1; };
const ER_LVN = ["سهل","متوسط","صعب"];

const erFromCfg = () => ({ id: Math.random().toString(36).slice(2, 10), seed: Math.random().toString(36).slice(2, 12), mode:erCfg.mode, base:erCfg.base, mins:erCfg.mins, hints:erCfg.hints, hc:erCfg.hc, pen:erCfg.pen, rooms:erCfg.pick.length, pick:erCfg.pick.slice(), know:erCfg.know, cats:erCfg.cats.slice(), dev:erCfg.dev });

/* ---------- team state: every device keeps its own record; a team's state is the union of its devices ---------- */
function erMerge(list, G){
  const m = {solved:new Set(), know:{}, pen:[0,0,0], hints:[], bonus:0, open:[null,null,null], fail:[null,null,null], devs:list.length};
  list.forEach(s => { (Array.isArray(s.s) ? s.s : Object.keys(s.s || {})).forEach(id => m.solved.add(id)); Object.entries(s.k || {}).forEach(([k, v]) => { if (m.know[k] !== 1) m.know[k] = v; });
    (s.p || []).forEach((v, i) => m.pen[i] += +v || 0); (s.h || []).forEach(h => m.hints.push(h)); m.bonus += +s.b || 0;
    [0,1,2].forEach(i => { const o = s.o && s.o[i], f = s.f && s.f[i]; if (o && (!m.open[i] || o < m.open[i])) m.open[i] = o; if (f && (!m.fail[i] || f < m.fail[i])) m.fail[i] = f; }); });
  return m;
}
function erProgress(G, m, now){
  const pk = erPickOf(G), rooms = pk.length; let pos = 0; while (pos < rooms && (m.open[pk[pos]] || m.fail[pk[pos]])) pos++;
  const done = pos >= rooms, r = pk[Math.min(pos, rooms - 1)];
  const stOf = k => k === 0 ? G.startAt : (m.open[pk[k-1]] || m.fail[pk[k-1]]) + 15000, start = done ? 0 : stOf(pos);
  const left = done || !G.startAt ? 0 : G.mins * 60 - (now - start) / 1000 - m.pen[r];
  const escaped = pk.filter(i => m.open[i] && !(m.fail[i] && m.fail[i] < m.open[i])).length;
  let used = 0; for (let k = 0; k < pos; k++){ const i = pk[k]; used += ((m.open[i] || m.fail[i]) - stOf(k)) / 1000 + m.pen[i]; }
  const solvedNow = done ? 6 : ER_ROOMS[r].st.filter(s => m.solved.has(s.id)).length;
  return {r, pos, done, start, left, escaped, used, solvedNow, hintsLeft: (G.hints * (G.mode === "coop" ? (G.names || []).length || 1 : 1)) + m.bonus - m.hints.length};
}

/* periodic: merge team state, timer, room transitions */
function erTick(first){
  const X = ERX; if (!X) return; const G = X.G;

  const m = X.merged = erMerge(erTeamStates(), G), now = erNow(), pr = X.pr = erProgress(G, m, now);
  if (G.phase === "end" && X.net){ if (X.room !== -2) erFinal(true); return; }
  const cur = X.room;
  if (cur >= 0 && (m.open[cur] || m.fail[cur]) && !X.ended[cur]){ if (X.modalFor == null) erTransition(cur); return; }
  if (X.modalFor != null) return;
  if (pr.done){ if (X.room !== -2) erFinal(); return; }
  if (pr.r !== X.room){ erLoadRoom(pr.r); if (!X.me.seen[pr.r]) erIntro(pr.r); return; }
  if (!G.startAt && !X.net) return;                 // practice: waiting for the intro's start button
  if (pr.left <= 0 && !m.open[pr.r] && !m.fail[pr.r]){ X.me.f[pr.r] = now; erSave(); erPublish(); ERA.sfx("fail"); erTick(); return; }
  ERA.level = pr.left < 60 ? 2 : pr.left < 180 ? 1 : 0;
  if (pr.left < 11 && Math.floor(pr.left) !== X.lastTick){ X.lastTick = Math.floor(pr.left); ERA.sfx("tick"); }
  erSync(); erHud();
}

    if (m.solved.has(s.id)) state = "solved"; else if (s.needs && !erHasItem(s.needs)) state = "locked"; else if ((X.cool[s.id] || 0) > now) state = "cool";
    st.state = state; const tag = document.querySelector(`.er-tag[data-ersid="${s.id}"]`); if (tag) tag.dataset.state = state; });

function erBag(fresh){
  const X = ERX, b = document.getElementById("erBag"); if (!b || X.room < 0) return; const d = erRoomData(X.room), m = X.merged || {solved:new Set()}, symMode = X.G.base > 0;

function ervScene(r){

  if (!ERV.box){ ERV.box = document.createElement("div"); ERV.box.setAttribute("aria-hidden", "true");
    ERV.box.style.cssText = "position:fixed;left:-12000px;top:0;width:960px;height:600px;pointer-events:none;visibility:hidden"; document.body.appendChild(ERV.box); }

  window.removeEventListener("keydown", sc.onKey); window.removeEventListener("keyup", sc.onKey);
  sc.me.visible = false; sc.renderer.setPixelRatio(1); sc.resize(); sc.home.dist *= 1.08; sc.goal.dist = sc.home.dist; sc.view = Object.assign({}, sc.goal);

function ervDraw(H, rows){
  document.querySelectorAll(".er-vslot[data-erv]").forEach(slot => { const i = slot.dataset.erv;
    let cv = ERV.cv[i]; if (!cv){ cv = ERV.cv[i] = document.createElement("canvas"); cv.width = 960; cv.height = 600; cv.className = "er-vcv"; }
    if (cv.parentNode !== slot) slot.appendChild(cv); });
  if (!window.THREE){ if (!ERV.busy){ ERV.busy = true; erThree().catch(() => {}).then(() => { ERV.busy = false; }); } return; }
  const now = Date.now(); if (now - ERV.last < 700) return; ERV.last = now;
  rows.forEach(x => { const cv = ERV.cv[x.i]; if (!cv) return;
    const r = x.pr.r; let sc; try { sc = ervScene(r); } catch(e){ return; }
    const want = new Set();
    (x.list || []).forEach(m => { if (m.x == null || m.z == null) return; const id = (m.t || 0) + ":" + (m.j || 0); want.add(id);
      const p = sc.peerAvatar(id, ER_COL[(m.t || 0) % 10], m.x, m.z); p.g.position.set(m.x, 0, m.z); p.g.visible = true; });
    Object.keys(sc.peers).forEach(id => { if (!want.has(id)) sc.peers[id].g.visible = false; });
    Object.values(sc.stations).forEach(st => { st.state = x.m.solved.has(st.s.id) ? "solved" : ""; });
    sc.chest.ready = false;
    try { sc.frame(); cv.getContext("2d").drawImage(sc.renderer.domElement, 0, 0, cv.width, cv.height); } catch(e){}
  });
}

/* ================= Contest: إعمار =================
   Simple city building, no trivia. One idea: solve puzzles -> collect
   resources -> build your city -> protect it from the coming crisis.

   leader builds on the 6x6 map at any time) -> the forecast event arrives
   (announced at the start of the round, so protecting the city is planning,
   not luck; unprotected cities get one rescue puzzle) -> result.
   Score = population: every building adds residents; a park adds +20 for
   each house next to it.
   Transport: phones write their actions into room presence (anyone may set
   presence); the host applies them and broadcasts the state on the

/* pipes: rotate tiles to connect the well (left) to the city (right). bits N1 E2 S4 W8 */
function emPipes(el, L, fin){

  const draw = () => { const f = flow(), win = f.has(r1 * N + N - 1) && (g[r1 * N + N - 1] & 2);

/* power board: each press flips a lamp and its four neighbours; light them all */
